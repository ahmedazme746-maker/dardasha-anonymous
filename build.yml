name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f dardasha-anonymous-chat/settings.gradle.kts
          test -f dardasha-anonymous-chat/app/google-services.json
          grep -q 'com.android.application.*8.13.0' dardasha-anonymous-chat/build.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.3.0' dardasha-anonymous-chat/build.gradle.kts
          grep -q 'compileSdk = 36' dardasha-anonymous-chat/app/build.gradle.kts
          grep -q 'verticalAlignment = Alignment.CenterVertically' dardasha-anonymous-chat/app/src/main/java/com/dardasha/anonymous/MainActivity.kt

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Build debug APK
        working-directory: dardasha-anonymous-chat
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-chat-apk
          path: dardasha-anonymous-chat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
