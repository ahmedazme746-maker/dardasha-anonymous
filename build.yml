name: Build Dardasha Fixed Storage Auth Audio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Select ONLY the audited source by marker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dardasha-v9 project
          mkdir -p /tmp/dardasha-v9 project
          marker='DARDASHA-MAIN-BUILD-V9-END-TO-END-STORAGE-AUDIT'
          main_path='app/src/main/java/com/dardasha/anonymous/MainActivity.kt'
          matches=()
          while IFS= read -r -d '' zip; do
            hash="$(printf '%s' "$zip" | sha256sum | cut -d' ' -f1)"
            tmp="/tmp/dardasha-v9/$hash"
            mkdir -p "$tmp"
            if unzip -q -o "$zip" -d "$tmp" 2>/dev/null && [ -f "$tmp/$main_path" ] && grep -Fq "$marker" "$tmp/$main_path"; then
              matches+=("$zip")
            fi
          done < <(find . -type f -name '*.zip' -print0)
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one audited source ZIP, found ${#matches[@]}."
            printf '%s\n' "${matches[@]:-<none>}"
            exit 1
          fi
          ZIP_FILE="${matches[0]}"
          echo "Selected audited source: $ZIP_FILE"
          mkdir -p /tmp/dardasha-v9/selected
          unzip -q -o "$ZIP_FILE" -d /tmp/dardasha-v9/selected
          PROJECT_DIR="$(find /tmp/dardasha-v9/selected -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          cp -R "$PROJECT_DIR"/. project/

      - name: Audit source and Firebase config before Gradle
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          MAIN='app/src/main/java/com/dardasha/anonymous/MainActivity.kt'
          test -f "$MAIN"
          test -f app/google-services.json
          test -f storage.rules
          test -f database.rules.json
          grep -Fq 'DARDASHA-MAIN-BUILD-V9-END-TO-END-STORAGE-AUDIT' "$MAIN"
          grep -Fq 'FirebaseStorage.getInstance()' "$MAIN"
          grep -Fq 'ref.putFile(uploadUri, metadata)' "$MAIN"
          grep -Fq 'ref.downloadUrl' "$MAIN"
          grep -Fq 'Storage URL FAILED:' "$MAIN"
          grep -Fq 'auth.signInWithEmailAndPassword' "$MAIN"
          grep -Fq 'MediaRecorder.AudioSource.MIC' "$MAIN"
          grep -Fq 'storage.app.options.storageBucket' "$MAIN"
          grep -Fq 'getBytes(' "$MAIN"
          grep -Fq 'wDMqt8jpP1gEJJtLuUMrTTaeU8q1' "$MAIN"
          grep -Fq 'wDMqt8jpP1gEJJtLuUMrTTaeU8q1' database.rules.json
          grep -Fq 'dardasha-anonymous.firebasestorage.app' app/google-services.json
          echo 'fixed source/config audit: PASSED'

      - name: Build V10 debug APK
        working-directory: project
        shell: bash
        run: gradle --no-daemon --stacktrace --warning-mode all clean :app:assembleDebug

      - name: Verify V10 APK identity
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"
          grep -E 'versionCode|versionName' app/build.gradle.kts
          grep -F 'DARDASHA-MAIN-BUILD-V9-END-TO-END-STORAGE-AUDIT' app/src/main/java/com/dardasha/anonymous/MainActivity.kt

      - name: Upload fixed Dardasha APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-fixed-v10
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
