name: Build Dardasha V11 Fixed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Extract ONLY V11 audited project
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Dardasha-V11-FIXED-STORAGE-AUTH-AUDIO.zip'
          test -f "$ZIP" || { echo "ERROR: $ZIP is missing from repository root."; exit 1; }
          rm -rf project /tmp/dardasha-v11
          mkdir -p project /tmp/dardasha-v11
          unzip -q -o "$ZIP" -d /tmp/dardasha-v11
          PROJECT_DIR="$(find /tmp/dardasha-v11 -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          cp -R "$PROJECT_DIR"/. project/

      - name: Audit V11 source and Firebase config
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          MAIN='app/src/main/java/com/dardasha/anonymous/MainActivity.kt'
          test -f "$MAIN"
          test -f app/google-services.json
          test -f storage.rules
          test -f database.rules.json
          grep -Fq 'DARDASHA-MAIN-BUILD-V11-STORAGE-AUTH-AUDIO-FIX' "$MAIN"
          grep -Fq 'FirebaseStorage.getInstance()' "$MAIN"
          grep -Fq 'ref.putFile' "$MAIN"
          grep -Fq 'firebaseStorageDownloadTokens' "$MAIN"
          grep -Fq 'auth.signInWithEmailAndPassword' "$MAIN"
          grep -Fq 'MediaRecorder.AudioSource.MIC' "$MAIN"
          grep -Fq 'wDMqt8jpP1gEJJtLuUMrTTaeU8q1' database.rules.json
          grep -Fq 'dardasha-anonymous.firebasestorage.app' app/google-services.json
          echo 'V11 source/config audit: PASSED'

      - name: Build V11 debug APK
        working-directory: project
        shell: bash
        run: gradle --no-daemon --stacktrace --warning-mode all clean :app:assembleDebug

      - name: Verify APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Upload fixed Dardasha APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-fixed-v11
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
