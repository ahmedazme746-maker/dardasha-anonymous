    private fun setTyping(value: Boolean) {
        if (uid.isBlank()) return
        typingRunnable?.let(typingHandler::removeCallbacks)
        val ref = db.reference.child("typing").child(uid)
        if (!value) { ref.onDisconnect().cancel(); ref.setValue(false); return }
        ref.onDisconnect().setValue(false)
        ref.setValue(true)
        typingRunnable = Runnable { ref.setValue(false) }
        typingHandler.postDelayed(typingRunnable!!, TYPING_TIMEOUT_MS)
    }

    private fun stopTyping() { typingRunnable?.let(typingHandler::removeCallbacks); typingRunnable = null; if (uid.isNotBlank()) db.reference.child("typing").child(uid).setValue(false) }

