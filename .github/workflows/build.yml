    private fun setBanned(targetUid: String, value: Boolean) {
        if (targetUid == OWNER_UID) { showError("لا يمكن حظر مالك التطبيق"); return }
        db.reference.child("users").child(targetUid).child("banned").setValue(value)
            .addOnSuccessListener { if (value) db.reference.child("users").child(targetUid).child("online").setValue(false) }
            .addOnFailureListener { showError(it.message ?: "تعذر تغيير الحظر") }
    }

    private fun extractStoragePath(downloadUrl: String): String? {
        return try {
            val uri = Uri.parse(downloadUrl)
            val encoded = uri.path?.substringAfter("/o/") ?: return null
            java.net.URLDecoder.decode(encoded, "UTF-8")
        } catch (_: Exception) {
            null
        }
    }
