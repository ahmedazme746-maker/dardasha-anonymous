name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: 'none'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          GRADLEW=$(find . -type f -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "Found Gradle wrapper: $GRADLEW"
          else
            SETTINGS=$(find . -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: No Gradle project was found."
              echo "Repository contents:"
              find . -maxdepth 4 -type f | sort
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "Found Gradle project: $PROJECT_DIR"
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "================================"
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"
          echo "================================"

          ls -la "$PROJECT_DIR"

      - name: Check Gradle files
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          echo "Checking:"
          echo "$PROJECT"

          if [ -f "$PROJECT/settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
          elif [ -f "$PROJECT/settings.gradle" ]; then
            echo "Found settings.gradle"
          else
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          if [ -f "$PROJECT/build.gradle.kts" ]; then
            echo "Found build.gradle.kts"
          elif [ -f "$PROJECT/build.gradle" ]; then
            echo "Found build.gradle"
          else
            echo "ERROR: build.gradle was not found."
            exit 1
          fi

      - name: Make Gradle executable
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          if [ -f "$PROJECT/gradlew" ]; then
            chmod +x "$PROJECT/gradlew"
          fi

      - name: Build APK
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT"

          echo "Building project from:"
          pwd

          if [ -f "./gradlew" ]; then
            ./gradlew --version
            ./gradlew --no-daemon clean assembleDebug --stacktrace
          else
            echo "ERROR: gradlew was not found."
            echo "The project must contain a Gradle wrapper."
            exit 1
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dardasha-anonymous-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          overwrite: true
