name: Build Dardasha Anonymous Chat

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find chat project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip" ]; then
            ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip"
          elif [ -f "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip" ]; then
            ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip"
          else
            echo "::error::Chat project ZIP not found."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

          unzip -t "$ZIP" >/dev/null

          echo "Using:"
          echo "$ZIP"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/project" -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          # Ubuntu 24.04 currently provides API 37 as android-37.0.
          # Create compatibility alias for tools expecting android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && \
             [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then

            ln -s \
              "$ANDROID_HOME/platforms/android-37.0" \
              "$ANDROID_HOME/platforms/android-37"
          fi

          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

          echo
          echo "Android SDK 37 is ready."

      - name: Fix project configuration
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PROJECT_DIR/build.gradle.kts"
          APP="$PROJECT_DIR/app/build.gradle.kts"

          test -f "$ROOT"
          test -f "$APP"

          # Android Gradle Plugin
          sed -i \
            's/id("com.android.application") version "8\.13\.0"/id("com.android.application") version "8.13.2"/g' \
            "$ROOT"

          # Compile against Android 37 because current core-ktx 1.19.1
          # requires API 37.
          sed -i \
            's/compileSdk = 36/compileSdk = 37/g' \
            "$APP"

          # Compose BOM compatible with the project.
          sed -i \
            's/2026\.09\.00/2026.06.01/g' \
            "$APP"

          echo
          echo "===== ROOT BUILD FILE ====="
          cat "$ROOT"

          echo
          echo "===== APP BUILD FILE ====="
          cat "$APP"

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Android Gradle Plugin:"
          grep -n "com.android.application" \
            "$PROJECT_DIR/build.gradle.kts"

          echo
          echo "Compile SDK:"
          grep -n "compileSdk" \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo
          echo "Compose BOM:"
          grep -n "compose-bom" \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo
          echo "SDK check:"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

          echo "ALL CHECKS PASSED."

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo
          echo "===== GRADLE ====="
          gradle --version

          echo
          echo "===== BUILDING APK ====="

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not created."

            find "$PROJECT_DIR/app/build" \
              -type f \
              | sort || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          echo
          echo "===== APK CREATED ====="

          ls -lh \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
