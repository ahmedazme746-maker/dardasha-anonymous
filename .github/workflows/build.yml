        messagesListener = null; messageDeletesListener = null; typingListener = null; currentRoomRef = null; currentRoom = null; currentPeer = null; messages.clear(); deletedMessageIds.clear(); peerTyping = false; messageListenerPrimed = false; isBlocked = false; iBlockedPeer = false; isRecording = false; screen = "main"; selectedTab = 1
