name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Firebase project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*firebase*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Firebase project ZIP was not found."
            echo "ZIP files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using Firebase project ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted
          echo "ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare compatible Gradle plugin versions
        shell: bash
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/ci-version-fix.init.gradle" <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  resolutionStrategy {
                      eachPlugin {
                          if (requested.id.id.startsWith("org.jetbrains.kotlin.")) {
                              useVersion("2.3.0")
                          }

                          if (requested.id.id == "com.android.application" ||
                              requested.id.id == "com.android.library") {
                              useVersion("8.13.0")
                          }
                      }
                  }
              }
          }
          EOF

          echo "CI plugin compatibility rules prepared:"
          echo "Kotlin -> 2.3.0"
          echo "Android Gradle Plugin -> 8.13.0"

      - name: Fix Kotlin Material3 experimental API
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt was not found."
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN_FILE"

          if ! grep -q "androidx.compose.material3.ExperimentalMaterial3Api" "$MAIN_FILE"; then
            sed -i '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' "$MAIN_FILE"
          fi

          echo "Experimental Material3 API opt-in applied."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Starting Gradle build..."
          echo "Gradle: 8.13"
          echo "Android Gradle Plugin: 8.13.0"
          echo "Kotlin: 2.3.0"

          gradle \
            --no-daemon \
            --init-script "$GITHUB_WORKSPACE/ci-version-fix.init.gradle" \
            assembleDebug \
            --stacktrace

      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: dardasha-anonymous-debug.apk
