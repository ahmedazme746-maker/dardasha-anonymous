name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -d app/src/main

          echo "Project structure OK."

      - name: Configure Compose BOM
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Compose BOM..."

          grep -n "compose-bom" app/build.gradle.kts

          # Use the official current stable Compose BOM.
          sed -i \
            's/compose-bom:[0-9][0-9.]*"/compose-bom:2026.09.00"/g' \
            app/build.gradle.kts

          echo "Compose BOM after configuration:"
          grep -n "compose-bom" app/build.gradle.kts

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-36" \
            || {
              echo "ERROR: Android SDK 36 not installed."
              exit 1
            }

          echo "Android SDK 36 OK."

      - name: Verify Gradle configuration
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          echo "Running Gradle configuration check..."

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            tasks \
            --console=plain

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Building Dardasha Debug APK"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug \
            --console=plain

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated APK..."

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find app/build/outputs \
              -maxdepth 8 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            release/dardasha-anonymous-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
