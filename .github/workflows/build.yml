import com.google.firebase.auth.FirebaseAuth
import com.google.firebase.database.DataSnapshot
import com.google.firebase.database.DatabaseError
import com.google.firebase.database.FirebaseDatabase
import com.google.firebase.database.ValueEventListener
import com.google.firebase.database.ServerValue

data class ChatMessage(
    val senderId: String = "",
    val text: String = "",
    val timestamp: Long = 0L
)

@OptIn(ExperimentalMaterial3Api::class)
class MainActivity : ComponentActivity() {

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        setContent {
            MaterialTheme {
                DardashaApp()
            }
        }
    }
}

@Composable
fun DardashaApp() {

    val auth = remember {
        FirebaseAuth.getInstance()
    }

    val database = remember {
        FirebaseDatabase.getInstance().reference
    }

    var currentUserId by remember {
        mutableStateOf(auth.currentUser?.uid)
    }

    var roomId by remember {
        mutableStateOf<String?>(null)
    }

    var waiting by remember {
        mutableStateOf(false)
    }

    var messageText by remember {
        mutableStateOf("")
    }

    val messages = remember {
        mutableStateListOf<ChatMessage>()
    }

    var errorMessage by remember {
        mutableStateOf("")
    }

    /*
     * Firebase Anonymous Login
     */
    LaunchedEffect(Unit) {

        if (auth.currentUser == null) {

            auth.signInAnonymously()
                .addOnSuccessListener {
                    currentUserId = it.user?.uid
                }
                .addOnFailureListener {
                    errorMessage =
                        "تعذر الاتصال بالخادم: ${it.message}"
                }

        } else {

            currentUserId = auth.currentUser?.uid
        }
    }

    /*
     * Listen for room changes
     */
    LaunchedEffect(roomId) {

        val room = roomId ?: return@LaunchedEffect

        val messagesReference =
            database
                .child("rooms")
                .child(room)
                .child("messages")

        val listener =
            object : ValueEventListener {

                override fun onDataChange(snapshot: DataSnapshot) {

                    messages.clear()

                    for (child in snapshot.children) {

                        val message =
                            child.getValue(ChatMessage::class.java)

                        if (message != null) {
                            messages.add(message)
                        }
                    }
                }

                override fun onCancelled(error: DatabaseError) {

                    errorMessage =
                        "حدث خطأ في قراءة المحادثة"
                }
            }

        messagesReference.addValueEventListener(listener)
    }

    Scaffold(

        topBar = {

            TopAppBar(
                title = {
                    Text("دردشة مع مجهول")
                }
            )
        }

    ) { padding ->

        if (roomId == null) {

            WaitingScreen(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(padding),

                waiting = waiting,

                errorMessage = errorMessage,

                onStartChat = {

                    val uid = currentUserId

                    if (uid == null) {

                        errorMessage =
                            "جاري تسجيل الدخول..."

                        return@WaitingScreen
                    }

                    waiting = true
                    errorMessage = ""

                    findRandomPartner(
                        database = database,
                        userId = uid,

                        onMatched = { newRoomId ->

                            waiting = false
                            roomId = newRoomId
                        },

                        onWaiting = {

                            waiting = true
                        },

                        onError = { message ->

                            waiting = false
                            errorMessage = message
                        }
                    )
                }
            )

        } else {

            ChatScreen(

                messages = messages,

                messageText = messageText,

                onMessageChange = {
                    messageText = it
                },

                onSend = {

                    val uid = currentUserId
                    val room = roomId

                    if (
                        uid != null &&
                        room != null &&
                        messageText.isNotBlank()
                    ) {

                        sendMessage(
                            database = database,
                            roomId = room,
                            senderId = uid,
                            text = messageText.trim()
                        )

                        messageText = ""
                    }
                }
            )
        }
    }
}


@Composable
fun WaitingScreen(
    modifier: Modifier,
    waiting: Boolean,
    errorMessage: String,
    onStartChat: () -> Unit
) {

    Column(

        modifier = modifier.padding(24.dp),

        horizontalAlignment = Alignment.CenterHorizontally,

        verticalArrangement =
            Arrangement.Center
    ) {

        Text(
            text =
                if (waiting)
                    "جاري البحث عن شخص..."
                else
                    "أهلاً بك في دردشة مع مجهول",
            style = MaterialTheme.typography.headlineSmall
        )

        Spacer(
            modifier = Modifier.padding(8.dp)
        )

        Text(
            text =
                if (waiting)
                    "انتظر حتى يتم العثور على شخص متاح"
                else
                    "تواصل مع أشخاص جدد بشكل مجهول."
        )

        Spacer(
            modifier = Modifier.padding(16.dp)
        )

        if (!waiting) {

            Button(
                onClick = onStartChat
            ) {

                Text("ابدأ محادثة عشوائية")
            }
        }

        if (errorMessage.isNotBlank()) {

            Spacer(
                modifier = Modifier.padding(8.dp)
            )

            Text(
                text = errorMessage
            )
        }
    }
}


@Composable
fun ChatScreen(
    messages: List<ChatMessage>,
    messageText: String,
    onMessageChange: (String) -> Unit,
    onSend: () -> Unit
) {

    Column(
        modifier = Modifier.fillMaxSize()
    ) {

        LazyColumn(
            modifier = Modifier
                .weight(1f)
                .fillMaxWidth()
                .padding(12.dp)
        ) {

            items(messages) { message ->

                Card(
                    modifier = Modifier
                        .fillMaxWidth()
                        .padding(vertical = 4.dp)
                ) {

                    Text(
                        text = message.text,
                        modifier = Modifier.padding(12.dp)
                    )
                }
            }
        }

        Row(
            modifier = Modifier
                .fillMaxWidth()
                .padding(8.dp),

            verticalAlignment =
                Alignment.CenterVertically
        ) {

            OutlinedTextField(

                value = messageText,

                onValueChange = onMessageChange,

                modifier = Modifier.weight(1f),

                placeholder = {
                    Text("اكتب رسالة...")
                },

                singleLine = true
            )

            Spacer(
                modifier = Modifier.padding(4.dp)
            )

            Button(
                onClick = onSend
            ) {

                Text("إرسال")
            }
        }
    }
}


/*
 * البحث عن مستخدم عشوائي
 */
fun findRandomPartner(
    database: com.google.firebase.database.DatabaseReference,
    userId: String,
    onMatched: (String) -> Unit,
    onWaiting: () -> Unit,
    onError: (String) -> Unit
) {

    val queueReference =
        database.child("queue")

    queueReference
        .get()
        .addOnSuccessListener { snapshot ->

            var partnerId: String? = null

            for (child in snapshot.children) {

                val candidateId = child.key

                if (
                    candidateId != null &&
                    candidateId != userId
                ) {

                    partnerId = candidateId
                    break
                }
            }

            if (partnerId == null) {

                queueReference
                    .child(userId)
                    .setValue(
                        mapOf(
                            "userId" to userId,
                            "createdAt" to ServerValue.TIMESTAMP
                        )
                    )
                    .addOnSuccessListener {

                        onWaiting()
                    }
                    .addOnFailureListener {

                        onError(
                            "تعذر دخول قائمة الانتظار"
                        )
                    }

            } else {

                val roomId =
                    database
                        .child("rooms")
                        .push()
                        .key

                if (roomId == null) {

                    onError(
                        "تعذر إنشاء المحادثة"
                    )

                    return@addOnSuccessListener
                }

                val updates =
                    hashMapOf<String, Any?>()

                updates["rooms/$roomId/user1"] =
                    userId

                updates["rooms/$roomId/user2"] =
                    partnerId

                updates["rooms/$roomId/createdAt"] =
                    ServerValue.TIMESTAMP

                updates["queue/$partnerId"] =
                    null

                database
                    .updateChildren(updates)
                    .addOnSuccessListener {

                        onMatched(roomId)
                    }
                    .addOnFailureListener {

                        onError(
                            "تعذر إنشاء المحادثة"
                        )
                    }
            }
        }

        .addOnFailureListener {

            onError(
                "تعذر الاتصال بقاعدة البيانات"
            )
        }
}


/*
 * إرسال رسالة
 */
fun sendMessage(
    database: com.google.firebase.database.DatabaseReference,
    roomId: String,
    senderId: String,
    text: String
) {

    val messageReference =
        database
            .child("rooms")
            .child(roomId)
            .child("messages")
            .push()

    val message =
        mapOf(
            "senderId" to senderId,
            "text" to text,
            "timestamp" to ServerValue.TIMESTAMP
        )

    messageReference.setValue(message)
}
