                                text = it
                                setTyping(it.isNotBlank())
                            }
                        },
                        Modifier.weight(1f), enabled = !isBlocked && !loading, placeholder = { Text("اكتب رسالة") }, singleLine = true,
                        colors = OutlinedTextFieldDefaults.colors(focusedContainerColor = Panel2, unfocusedContainerColor = Panel, focusedBorderColor = Pink, unfocusedBorderColor = Color(0xFF3A3355), focusedTextColor = TextMain, unfocusedTextColor = TextMain, cursorColor = Pink)
                    )
                    IconButton({ val v = text.trim(); if (v.isNotEmpty()) { sendMessage(v); text = ""; setTyping(false) } }, enabled = text.trim().isNotEmpty() && !isBlocked && !loading) { Icon(Icons.Default.Send, "إرسال", tint = Pink) }
                }
            }
        }
    }

    @Composable
    private fun MessageTextWithLinks(text: String, mine: Boolean) {
        val urlRegex = Regex("https?://[^\\s]+")
        val annotated = buildAnnotatedString {
            var cursor = 0
            urlRegex.findAll(text).forEach { match ->
                append(text.substring(cursor, match.range.first))
                pushStringAnnotation("URL", match.value)
                withStyle(SpanStyle(color = if (mine) Color.White else Blue, textDecoration = TextDecoration.Underline)) { append(match.value) }
                pop()
                cursor = match.range.last + 1
            }
            append(text.substring(cursor))
        }
        ClickableText(text = annotated, modifier = Modifier.padding(horizontal = 14.dp, vertical = 10.dp), style = MaterialTheme.typography.bodyLarge.copy(color = TextMain), onClick = { offset ->
            annotated.getStringAnnotations("URL", offset, offset).firstOrNull()?.let {
                try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(it.item))) } catch (_: Exception) { showError("تعذر فتح الرابط") }
            }
        })
    }

    @Composable
    private fun MessageBubble(m: Msg) {
        val mine = m.senderId == uid
        var menu by remember(m.id) { mutableStateOf(false) }
        Row(Modifier.fillMaxWidth(), horizontalArrangement = if (mine) Arrangement.End else Arrangement.Start) {
            Column(horizontalAlignment = if (mine) Alignment.End else Alignment.Start) {
                Column(Modifier.combinedClickable(onClick = {}, onLongClick = { menu = true })) {
                    when (m.type) {
                        "image" -> RemoteStorageImage(m.imageUrl, m.storagePath, "صورة", Modifier.widthIn(max = 250.dp).heightIn(max = 280.dp).clip(RoundedCornerShape(18.dp)))
                        "audio" -> OutlinedButton({ playAudio(m.audioUrl) }) { Icon(Icons.Default.PlayArrow, null); Spacer(Modifier.width(5.dp)); Text("تشغيل التسجيل") }
                        else -> Surface(color = if (mine) Color(0xFF6D25D9) else Panel2, shape = RoundedCornerShape(18.dp)) {
                            MessageTextWithLinks(m.text, mine)
                        }
                    }
                }
                Row(verticalAlignment = Alignment.CenterVertically) {
                    Text(formatTime(m.timestamp), color = TextMuted, style = MaterialTheme.typography.labelSmall, modifier = Modifier.padding(horizontal = 4.dp, vertical = 2.dp))
                    if (mine) {
                        val read = m.readAt > 0L
                        val delivered = m.deliveredAt > 0L
                        Text(if (read) "✓✓" else if (delivered) "✓✓" else "✓", color = if (read) Blue else TextMuted, style = MaterialTheme.typography.labelSmall)
                    }
                }
                DropdownMenu(expanded = menu, onDismissRequest = { menu = false }) {
                    DropdownMenuItem(text = { Text("حذف لدي") }, onClick = { menu = false; deleteForMe(m.id) }, leadingIcon = { Icon(Icons.Default.DeleteOutline, null) })
                    if (mine) DropdownMenuItem(text = { Text("حذف لدى الجميع") }, onClick = { menu = false; deleteForEveryone(m) }, leadingIcon = { Icon(Icons.Default.DeleteForever, null) })
                }
            }
        }
        Spacer(Modifier.height(5.dp))
    }

