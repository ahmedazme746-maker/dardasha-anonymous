    private fun approveAvatar(u: UserProfile) {
        if (u.avatarPendingUrl.isBlank() || u.avatarPendingStoragePath.isBlank() || !u.avatarPendingStoragePath.startsWith("pendingAvatars/${u.uid}-")) { showError("طلب الصورة غير صالح"); return }
        db.reference.child("users").child(u.uid).updateChildren(mapOf("avatarUrl" to u.avatarPendingUrl, "avatarStoragePath" to u.avatarPendingStoragePath, "avatarPending" to false, "avatarPendingUrl" to "", "avatarPendingStoragePath" to ""))
            .addOnFailureListener { showError(it.message ?: "تعذر قبول الصورة") }
    }
    private fun rejectAvatar(u: UserProfile) {
        val pendingUrl = u.avatarPendingUrl
        val pendingPath = u.avatarPendingStoragePath
        db.reference.child("users").child(u.uid).updateChildren(mapOf("avatarPending" to false, "avatarPendingUrl" to "", "avatarPendingStoragePath" to ""))
            .addOnSuccessListener {
                if (pendingPath.isNotBlank()) storage.reference.child(pendingPath).delete() else extractStoragePath(pendingUrl)?.let { storage.reference.child(it).delete() }
            }
            .addOnFailureListener { showError(it.message ?: "تعذر رفض الصورة") }
    }
