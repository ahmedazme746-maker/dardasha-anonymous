name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Find final Dardasha ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "Dardasha-FINAL-FIXED-V3-UPDATED.zip" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Dardasha-FINAL-FIXED-V3-UPDATED.zip not found."
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -print
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$RUNNER_TEMP/dardasha-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          SETTINGS_FILE=$(find "$PROJECT_ROOT" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/dardasha/anonymous/MainActivity.kt"

          echo "Project structure OK."
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Java and Gradle
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Prepare source
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          MAIN="app/src/main/java/com/dardasha/anonymous/MainActivity.kt"

          echo "Checking MainActivity.kt..."

          # Fix the known Firebase Presence syntax.
          sed -i \
            's/ref\.onDisconnect()\.child("online")\.setValue(false)/ref.child("online").onDisconnect().setValue(false)/g' \
            "$MAIN"

          # Add verticalScroll import if it is used.
          if grep -q "verticalScroll" "$MAIN"; then
            if ! grep -q "^import androidx.compose.foundation.verticalScroll$" "$MAIN"; then
              sed -i \
                '/^package /a import androidx.compose.foundation.verticalScroll' \
                "$MAIN"
            fi
          fi

          # Add rememberScrollState import if it is used.
          if grep -q "rememberScrollState" "$MAIN"; then
            if ! grep -q "^import androidx.compose.foundation.rememberScrollState$" "$MAIN"; then
              sed -i \
                '/^package /a import androidx.compose.foundation.rememberScrollState' \
                "$MAIN"
            fi
          fi

          # Make sure the old invalid Firebase syntax is gone.
          if grep -q 'ref\.onDisconnect()\.child' "$MAIN"; then
            echo "ERROR: Invalid Firebase Presence syntax remains."
            exit 1
          fi

          # Verify the scroll imports.
          if grep -q "verticalScroll" "$MAIN"; then
            grep -q "^import androidx.compose.foundation.verticalScroll$" "$MAIN"
          fi

          if grep -q "rememberScrollState" "$MAIN"; then
            grep -q "^import androidx.compose.foundation.rememberScrollState$" "$MAIN"
          fi

          echo "Source preparation completed."

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            clean \
            :app:assembleDebug \
            --console=plain \
            --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          echo "================================"
          echo "APK SUCCESSFULLY CREATED"
          echo "================================"

          ls -lh \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dardasha-Anonymous-APK
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
          retention-days: 14
