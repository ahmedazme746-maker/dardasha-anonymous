name: Build Dardasha Anonymous Chat

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find chat project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip" ]; then
            ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip"
          elif [ -f "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip" ]; then
            ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip"
          else
            echo "::error::Chat project ZIP not found."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" -printf '%f\n'
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

          unzip -t "$ZIP" >/dev/null
          echo "ZIP OK"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/project" -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle(.kts) not found."
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Fix known Android compatibility
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PROJECT_DIR/build.gradle.kts"
          APP="$PROJECT_DIR/app/build.gradle.kts"

          test -f "$ROOT"
          test -f "$APP"

          # AGP 8.13.2
          sed -i 's/8\.13\.0/8.13.2/g' "$ROOT"

          # Compose 1.11.4 stable line.
          # The old ZIP used Compose BOM 2026.09.00,
          # which resolves to Compose 1.12.x and requires API 37.
          sed -i 's/2026\.09\.00/2026.06.01/g' "$APP"

          echo "Root Gradle:"
          cat "$ROOT"

          echo
          echo "App Compose dependency:"
          grep -n "compose-bom" "$APP"

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android SDK 36 is available."

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          java -version
          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not created."
            find "$PROJECT_DIR/app/build" -type f | sort || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          echo "APK CREATED:"
          ls -lh "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
