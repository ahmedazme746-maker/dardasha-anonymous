name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Find correct Dardasha ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/dardasha
          mkdir -p /tmp/dardasha

          SELECTED=""

          echo "Searching all ZIP files..."

          while IFS= read -r ZIP_FILE; do
            echo ""
            echo "Testing:"
            echo "$ZIP_FILE"

            rm -rf /tmp/test_zip
            mkdir -p /tmp/test_zip

            if ! unzip -q "$ZIP_FILE" -d /tmp/test_zip; then
              echo "Cannot extract this ZIP. Skipping."
              continue
            fi

            MAIN_FILE="$(find /tmp/test_zip \
              -type f \
              -name 'MainActivity.kt' \
              -print -quit)"

            if [ -z "$MAIN_FILE" ]; then
              echo "No MainActivity.kt. Skipping."
              continue
            fi

            echo "Found MainActivity:"
            echo "$MAIN_FILE"

            if ! grep -q \
              'import androidx.compose.ui.text.withStyle' \
              "$MAIN_FILE"; then
              echo "Missing withStyle import. Skipping."
              continue
            fi

            if ! grep -q \
              'import androidx.compose.foundation.verticalScroll' \
              "$MAIN_FILE"; then
              echo "Missing verticalScroll import. Skipping."
              continue
            fi

            if ! grep -q \
              'wDMqt8jpP1gEJJtLuUMrTTaeU8q1' \
              "$MAIN_FILE"; then
              echo "Missing owner UID. Skipping."
              continue
            fi

            echo ""
            echo "======================================"
            echo "CORRECT DARDASHA PROJECT FOUND"
            echo "======================================"
            echo "$ZIP_FILE"

            SELECTED="$ZIP_FILE"
            break

          done < <(find . -type f -iname '*.zip' | sort)

          if [ -z "$SELECTED" ]; then
            echo ""
            echo "ERROR: No ZIP containing the corrected Dardasha source was found."
            exit 1
          fi

          echo ""
          echo "Selected ZIP:"
          echo "$SELECTED"

          rm -rf /tmp/final_extract
          mkdir -p /tmp/final_extract

          unzip -q "$SELECTED" -d /tmp/final_extract

          SETTINGS_FILE="$(find /tmp/final_extract \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          rm -rf project
          mkdir -p project

          cp -R "$PROJECT_DIR"/. project/

          echo ""
          echo "Project selected successfully."

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/com/dardasha/anonymous/MainActivity.kt

          echo "Project structure OK."

      - name: Verify corrected source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="project/app/src/main/java/com/dardasha/anonymous/MainActivity.kt"

          grep -q \
            'import androidx.compose.ui.text.withStyle' \
            "$MAIN"

          grep -q \
            'import androidx.compose.foundation.verticalScroll' \
            "$MAIN"

          grep -q \
            'wDMqt8jpP1gEJJtLuUMrTTaeU8q1' \
            "$MAIN"

          echo "======================================"
          echo "CORRECT SOURCE CONFIRMED"
          echo "======================================"

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
