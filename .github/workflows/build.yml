    private fun uploadPendingAvatar(uri: Uri) {
        if (uid.isBlank()) { showError("سجل الدخول أولًا"); return }
        val compressed = compressImageUri(uri)
        if (compressed == null) { showError("تعذر تجهيز الصورة"); return }
        val storagePath = "pendingAvatars/$uid-${UUID.randomUUID()}.jpg"
        val metadata = com.google.firebase.storage.StorageMetadata.Builder().setContentType("image/jpeg").build()
        loading = true
        uploadFileAndGetUrl(storagePath, compressed, metadata, { url ->
            db.reference.child("users").child(uid).updateChildren(mapOf("avatarPendingUrl" to url.toString(), "avatarPendingStoragePath" to storagePath, "avatarPending" to true))
                .addOnSuccessListener { loading = false; compressed.delete(); loadProfileOrSetup(); showError("تم رفع الصورة وهي الآن بانتظار موافقة الأدمن") }
                .addOnFailureListener { loading = false; compressed.delete(); showError(it.message ?: "تم رفع الصورة لكن تعذر حفظ طلب المراجعة") }
        }, { error ->
            loading = false
            compressed.delete()
