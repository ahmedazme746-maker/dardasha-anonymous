name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. تثبيت Android SDK 36
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. التأكد من وجود المشروع
      - name: Check project
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/dardasha-anonymous-chat"

          echo "Project path:"
          echo "$PROJECT"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Project directory not found:"
            echo "$PROJECT"
            echo ""
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo ""
          echo "Project files:"
          find "$PROJECT" -maxdepth 3 -type f | sort

      # 6. التأكد من ملفات Gradle
      - name: Check Gradle project
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/dardasha-anonymous-chat"

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "$PROJECT/build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          echo "Gradle project structure OK."

      # 7. فحص الإصدارات
      - name: Verify project configuration
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/dardasha-anonymous-chat"

          echo "Checking AGP..."
          grep -q 'com.android.application.*8.13.0' \
            "$PROJECT/build.gradle.kts" || {
              echo "ERROR: AGP 8.13.0 not found."
              exit 1
            }

          echo "Checking Kotlin..."
          grep -q 'org.jetbrains.kotlin.android.*2.3.0' \
            "$PROJECT/build.gradle.kts" || {
              echo "ERROR: Kotlin 2.3.0 not found."
              exit 1
            }

          echo "Checking compileSdk..."
          grep -q 'compileSdk = 36' \
            "$PROJECT/app/build.gradle.kts" || {
              echo "ERROR: compileSdk 36 not found."
              exit 1
            }

          echo "Project configuration OK."

      # 8. إعطاء صلاحية التنفيذ لـ Gradle
      - name: Make Gradle executable
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/dardasha-anonymous-chat"

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x "$PROJECT/gradlew"

      # 9. عرض نسخة Gradle
      - name: Check Gradle
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/dardasha-anonymous-chat"

          cd "$PROJECT"

          ./gradlew --version

      # 10. تنظيف المشروع
      - name: Clean project
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/dardasha-anonymous-chat"

          cd "$PROJECT"

          ./gradlew --no-daemon clean

      # 11. بناء APK
      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/dardasha-anonymous-chat"

          cd "$PROJECT"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 12. البحث عن APK
      - name: Find APK
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/dardasha-anonymous-chat"

          echo "Searching for APK..."

          find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 13. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dardasha-anonymous-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          overwrite: true
