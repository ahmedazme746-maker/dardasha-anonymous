name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "*/.gradle/*" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Kotlin experimental Material API
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" -type f -name "MainActivity.kt" -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "MainActivity: $MAIN_FILE"

          if ! grep -q "ExperimentalMaterial3Api" "$MAIN_FILE"; then
            sed -i '/@Composable fun DardashaApp()/i @OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' "$MAIN_FILE"
          fi

          echo "Kotlin Material3 experimental API fix applied."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: dardasha-anonymous-debug.apk
