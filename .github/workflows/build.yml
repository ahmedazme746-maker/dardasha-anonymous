name: Build Dardasha Anonymous Chat

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "dardasha-anonymous-chat-project-FINAL.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::dardasha-anonymous-chat-project-FINAL.zip was not found in the repository root."
            echo "ZIP files currently in the root:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" -printf '%f\n' | sort || true
            exit 1
          fi

          echo "Using: $ZIP"
          unzip -t "$ZIP" >/dev/null
          echo "ZIP integrity: OK"

      - name: Extract chat project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip" \
            -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "*/.gradle/*" | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle(.kts) was found inside the chat project ZIP."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"

          grep -q 'com.android.application.*8.13.2' "$PROJECT_DIR/build.gradle.kts"
          grep -q 'org.jetbrains.kotlin.android.*2.3.0' "$PROJECT_DIR/build.gradle.kts"
          grep -q 'compileSdk = 36' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'targetSdk = 36' "$PROJECT_DIR/app/build.gradle.kts"

          echo "Project structure and versions: OK"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found on the GitHub runner."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Gradle:"
          gradle --version

          echo "Building:"
          echo "$PWD"

          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            find "$PROJECT_DIR/app/build" -maxdepth 6 -type f 2>/dev/null | sort | head -200 || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          echo "APK created:"
          ls -lh "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
