    private fun reserveMessageSlot(action: () -> Unit) {
        if (uid.isBlank()) return
        val ref = db.reference.child("rateLimits").child(uid)
        ref.runTransaction(object : Transaction.Handler {
            override fun doTransaction(d: MutableData): Transaction.Result {
                val nowTs = System.currentTimeMillis()
                val windowStart = d.child("windowStart").getValue(Long::class.java) ?: 0L
                val count = d.child("count").getValue(Int::class.java) ?: 0
                if (windowStart <= 0L || nowTs - windowStart >= 10_000L) { d.child("windowStart").value = nowTs; d.child("count").value = 1; return Transaction.success(d) }
                if (count >= 6) return Transaction.abort()
                d.child("count").value = count + 1
                return Transaction.success(d)
            }
            override fun onComplete(e: DatabaseError?, committed: Boolean, s: DataSnapshot?) {
                if (e != null) { showError(e.message); return }
                if (!committed) { showError("تم إيقاف الإرسال مؤقتًا لتقليل السبام"); return }
                action()
            }
        })
    }

