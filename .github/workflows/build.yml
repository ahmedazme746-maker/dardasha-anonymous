        db.reference.child("reports").child(id).setValue(data).addOnSuccessListener { showError("تم إرسال البلاغ للإدارة") }.addOnFailureListener { showError(it.message ?: "تعذر إرسال البلاغ") }
    }

    private fun sendMessage(text: String) {
        val room = currentRoom ?: return; val peer = currentPeer ?: return; if (isBlocked) return
        reserveMessageSlot {
            val ref = db.reference.child("rooms").child(room).child("messages").push()
            val data = mapOf<String, Any>("senderId" to uid, "type" to "text", "text" to text.take(MAX_MESSAGE_LENGTH), "timestamp" to ServerValue.TIMESTAMP, "expiresAt" to 0L, "deliveredAt" to 0L, "readAt" to 0L, "storagePath" to "")
            ref.setValue(data).addOnSuccessListener { updateChatPreview(peer, text) }.addOnFailureListener { showError(it.message ?: "فشل إرسال الرسالة") }
        }
    }

    private fun updateChatPreview(peer: UserProfile, last: String) {
        val room = currentRoom ?: return
        val nowTs = System.currentTimeMillis()
        val mine = mapOf("peerId" to peer.uid, "peerName" to peer.name, "peerVerified" to peer.verified, "peerAvatar" to peer.avatarUrl, "peerAvatarPath" to peer.avatarStoragePath, "lastMessage" to last, "updatedAt" to nowTs, "unreadCount" to 0)
        val peerRef = db.reference.child("userChats").child(peer.uid).child(room)
        db.reference.child("userChats").child(uid).child(room).setValue(mine)
        peerRef.runTransaction(object : Transaction.Handler {
            override fun doTransaction(d: MutableData): Transaction.Result {
                val old = d.child("unreadCount").getValue(Int::class.java) ?: 0
                d.child("peerId").value = uid
                d.child("peerName").value = profile?.name ?: "مستخدم"
                d.child("peerVerified").value = profile?.verified ?: false
                d.child("peerAvatar").value = profile?.avatarUrl ?: ""
                d.child("peerAvatarPath").value = profile?.avatarStoragePath ?: ""
                d.child("lastMessage").value = last
                d.child("updatedAt").value = nowTs
                d.child("unreadCount").value = old + 1
                return Transaction.success(d)
            }
            override fun onComplete(e: DatabaseError?, committed: Boolean, s: DataSnapshot?) { if (e != null) showError(e.message) }
        })
    }

    private fun uploadFileAndGetUrl(
        path: String,
        file: File,
        metadata: com.google.firebase.storage.StorageMetadata,
        onSuccess: (Uri) -> Unit,
        onFailure: (Exception) -> Unit
    ) {
        if (!file.exists() || file.length() <= 0L) {
            onFailure(IllegalStateException("الملف المحلي غير موجود أو فارغ"))
            return
        }
        val ref = storage.reference.child(path)
        ref.putFile(Uri.fromFile(file), metadata)
            .continueWithTask { uploadTask ->
                if (!uploadTask.isSuccessful) {
                    throw (uploadTask.exception ?: IllegalStateException("فشل رفع الملف"))
                }
                // Verify the exact object that was uploaded before asking
                // Firebase for its download URL.
                ref.getMetadata()
            }
            .continueWithTask { metadataTask ->
                if (!metadataTask.isSuccessful) {
                    throw (metadataTask.exception ?: IllegalStateException("تم الرفع لكن الملف غير قابل للقراءة"))
                }
                ref.downloadUrl
            }
            .addOnSuccessListener { onSuccess(it) }
            .addOnFailureListener { e ->
                val code = (e as? com.google.firebase.storage.StorageException)?.errorCode
                val details = when (code) {
                    com.google.firebase.storage.StorageException.ERROR_OBJECT_NOT_FOUND -> "الملف غير موجود في Storage بعد الرفع"
                    com.google.firebase.storage.StorageException.ERROR_NOT_AUTHORIZED -> "صلاحية Storage مرفوضة"
                    com.google.firebase.storage.StorageException.ERROR_BUCKET_NOT_FOUND -> "Firebase Storage غير مهيأ لهذا المشروع"
                    else -> e.message ?: e.javaClass.simpleName
                }
                onFailure(IllegalStateException("Storage: $details | path=$path", e))
            }
    }

    private fun uploadChatImage(uri: Uri) {
        val room = currentRoom ?: return
        val peer = currentPeer ?: return
        if (isBlocked) return
        reserveMessageSlot {
            loading = true
            val id = UUID.randomUUID().toString()
            val storagePath = "messages/$room/$id.jpg"
            val compressed = compressImageUri(uri)
            if (compressed == null) { loading = false; showError("تعذر تجهيز الصورة"); return@reserveMessageSlot }
            val metadata = com.google.firebase.storage.StorageMetadata.Builder().setContentType("image/jpeg").build()
            uploadFileAndGetUrl(storagePath, compressed, metadata, { url ->
                val expires = System.currentTimeMillis() + IMAGE_LIFETIME_MS
                val data = mapOf<String, Any>("senderId" to uid, "type" to "image", "text" to "", "imageUrl" to url.toString(), "timestamp" to ServerValue.TIMESTAMP, "expiresAt" to expires, "deliveredAt" to 0L, "readAt" to 0L, "storagePath" to storagePath)
                db.reference.child("rooms").child(room).child("messages").child(id).setValue(data)
                    .addOnSuccessListener { loading = false; compressed.delete(); updateChatPreview(peer, "📷 صورة") }
                    .addOnFailureListener {
                        loading = false
                        compressed.delete()
                        storage.reference.child(storagePath).delete()
                        showError(it.message ?: "فشل إرسال الصورة")
                    }
            }, { error ->
                loading = false
                compressed.delete()
                showError(error.message ?: "فشل رفع الصورة")
            })
        }
    }

    private fun compressImageUri(uri: Uri): File? {
        return try {
            val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
            contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
            var sample = 1
            while (bounds.outWidth / sample > 1280 || bounds.outHeight / sample > 1280) sample *= 2
            val opts = BitmapFactory.Options().apply { inSampleSize = sample; inPreferredConfig = Bitmap.Config.RGB_565 }
            val bitmap = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return null
            val file = File(cacheDir, "compressed-${UUID.randomUUID()}.jpg")
            file.outputStream().use { bitmap.compress(Bitmap.CompressFormat.JPEG, 80, it) }
            bitmap.recycle()
            file
        } catch (_: Exception) { null }
    }

    private fun startRecording() {
        if (isRecording) return
        val file = File(cacheDir, "voice-${UUID.randomUUID()}.m4a"); recordingFile = file
        try {
            mediaRecorder = MediaRecorder().apply { setAudioSource(MediaRecorder.AudioSource.MIC); setOutputFormat(MediaRecorder.OutputFormat.MPEG_4); setAudioEncoder(MediaRecorder.AudioEncoder.AAC); setAudioEncodingBitRate(64000); setAudioSamplingRate(44100); setOutputFile(file.absolutePath); prepare(); start() }
            isRecording = true
            Toast.makeText(this, "جاري التسجيل… اضغط الميكروفون مرة أخرى للإرسال", Toast.LENGTH_SHORT).show()
        } catch (e: Exception) { mediaRecorder?.release(); mediaRecorder = null; showError(e.message ?: "تعذر بدء التسجيل") }
    }

    private fun stopRecordingAndSend() {
        if (!isRecording) return
        try { mediaRecorder?.stop() } catch (_: Exception) {}
        mediaRecorder?.release(); mediaRecorder = null; isRecording = false
        val file = recordingFile ?: return
        val room = currentRoom ?: return
        val peer = currentPeer ?: return
        reserveMessageSlot {
            loading = true
            val id = UUID.randomUUID().toString()
            val storagePath = "messages/$room/$id.m4a"
            val metadata = com.google.firebase.storage.StorageMetadata.Builder().setContentType("audio/mp4").build()
            uploadFileAndGetUrl(storagePath, file, metadata, { url ->
                val data = mapOf<String, Any>("senderId" to uid, "type" to "audio", "text" to "", "audioUrl" to url.toString(), "timestamp" to ServerValue.TIMESTAMP, "expiresAt" to 0L, "deliveredAt" to 0L, "readAt" to 0L, "storagePath" to storagePath)
                db.reference.child("rooms").child(room).child("messages").child(id).setValue(data)
                    .addOnSuccessListener { loading = false; updateChatPreview(peer, "🎤 تسجيل صوتي"); file.delete(); recordingFile = null }
                    .addOnFailureListener {
                        loading = false
                        storage.reference.child(storagePath).delete()
                        file.delete()
                        recordingFile = null
                        showError(it.message ?: "فشل إرسال التسجيل")
                    }
            }, { error ->
                loading = false
                file.delete()
                showError(error.message ?: "فشل رفع التسجيل")
            })
        }
    }

