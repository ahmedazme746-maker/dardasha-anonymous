name: Build Dardasha APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # =========================
      # 1. Download repository
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. Java
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # 3. Gradle
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # =========================
      # 4. Extract Android project
      # =========================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR DARDASHA ZIP"
          echo "========================================"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "Dardasha-FINAL-FIXED-V3.zip" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*dardasha*.zip" \
              -not -path "*/.git/*" \
              | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Dardasha ZIP not found."
            find "$GITHUB_WORKSPACE" -type f
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "Testing ZIP..."
          unzip -t "$ZIP_FILE"

          PROJECT_ROOT="$RUNNER_TEMP/dardasha"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          echo "Extracting..."
          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          echo "Searching for Gradle project..."

          SETTINGS=$(find "$PROJECT_ROOT" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            echo ""
            echo "Extracted files:"
            find "$PROJECT_ROOT" -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "========================================"
          echo "PROJECT FOUND"
          echo "$PROJECT_DIR"
          echo "========================================"

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Found app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Found app/build.gradle"
          else
            echo "ERROR: app Gradle file not found."
            find "$PROJECT_DIR" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================
      # 5. Check Android project
      # =========================
      - name: Check Project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "Gradle files:"
          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "*.gradle" \
              -o \
              -name "*.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            | sort

          echo ""
          echo "Android files:"
          find app \
            -maxdepth 5 \
            -type f \
            | sort | head -300

      # =========================
      # 6. Firebase check
      # =========================
      - name: Check Firebase
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "Firebase configuration found."
          else
            echo "WARNING: google-services.json not found."
            echo "Build will continue."
          fi

      # =========================
      # 7. Gradle configuration
      # =========================
      - name: Gradle Configuration Test
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            tasks \
            --console=plain

      # =========================
      # 8. Build APK
      # =========================
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "BUILDING DARDASHA"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug \
            --console=plain

      # =========================
      # 9. Find APK
      # =========================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build/outputs" \
              -maxdepth 10 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "APK:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      # =========================
      # 10. Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
