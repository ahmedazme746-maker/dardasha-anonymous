name: Build Dardasha Anonymous APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Dardasha ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Dardasha project ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*dardasha*.zip" \
            -not -path "*/.git/*" \
            -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Dardasha ZIP found."
            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -print \
              | sort
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP integrity: OK"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$RUNNER_TEMP/dardasha-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          echo "Searching for Android project..."

          SETTINGS_FILE=$(find "$PROJECT_ROOT" \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            -not -path "*/.gradle/*" \
            -print -quit || true)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found inside ZIP."
            echo ""
            echo "Extracted files:"
            find "$PROJECT_ROOT" \
              -maxdepth 8 \
              -type f \
              | sort \
              | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "========================================"
          echo "ANDROID PROJECT FOUND"
          echo "$PROJECT_DIR"
          echo "========================================"

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts found."
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "app/build.gradle found."
          else
            echo "ERROR: app Gradle file not found."

            find "$PROJECT_DIR" \
              -maxdepth 5 \
              -type f \
              | sort

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check MainActivity
        shell: bash
        run: |
          set -euo pipefail

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit || true)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_FILE"

          echo ""
          echo "Checking known Firebase error..."

          if grep -n 'onDisconnect().child' "$MAIN_FILE"; then
            echo "ERROR: Invalid onDisconnect().child() found."
            exit 1
          fi

          echo "Firebase presence syntax check: OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test Gradle configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            tasks \
            --console=plain

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING DARDASHA APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug \
            --console=plain

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR/app/build/outputs" \
              -maxdepth 10 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
