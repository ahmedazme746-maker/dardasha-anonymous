                                TextButton(onClick = { reportDialog = false; reportPeer(reason) }, modifier = Modifier.fillMaxWidth()) { Text(reason, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Start) }
                            }
                        } },
                        confirmButton = { TextButton(onClick = { reportDialog = false }) { Text("إلغاء") } }
                    )
                }
                if (isBlocked) Box(Modifier.fillMaxWidth().background(Color(0xFF341126)).padding(10.dp), contentAlignment = Alignment.Center) { Text("تم حظر هذا المستخدم", color = Red, fontWeight = FontWeight.Bold) }
