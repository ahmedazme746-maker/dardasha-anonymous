tton({ setBanned(u.uid, !u.banned) }, Modifier.weight(1f), colors = ButtonDefaults.outlinedButtonColors(contentColor = if (u.banned) Green else Red)) { Text(if (u.banned) \"إلغاء الحظر\" else \"حظر\") }\n            }\n            if (!u.admin) {\n                Spacer(Modifier.height(6.dp))\n                OutlinedButton({ deleteUserData(u) }, Modifier.fillMaxWidth(), colors = ButtonDefaults.outlinedButtonColors(contentColor = Red)) {\n                    Icon(Icons.Default.DeleteForever, null)\n                    Spacer(Modifier.width(6.dp))\n                    Text(\"حذف بيانات المستخدم\")\n                }\n            }\n        }\n    }\n\n    @Composable\n    private fun ChatScreen() {\n        val peer = currentPeer\n        var text by remember(currentRoom) { mutableStateOf(\"\") }\n        var menu by remember { mutableStateOf(false) }\n        var reportDialog by remember { mutableStateOf(false) }\n        val imageLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri -> if (uri != null) uploadChatImage(uri) }\n        val micLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { granted -> if (granted) startRecording() else showError(\"نحتاج إذن الميكروفون لإرسال تسجيل صوتي\") }\n        ScreenBackground {\n            Column(Modifier.fillMaxSize()) {\n                Row(Modifier.fillMaxWidth().background(Color(0xFF0A091B)).padding(8.dp), verticalAlignment = Alignment.CenterVertically) {\n                    IconButton({ closeRoom() }) { Icon(Icons.Default.ArrowBack, null, tint = TextMain) }\n                    Avatar(peer?.name ?: \"مستخدم\", peer?.verified == true, peer?.avatarUrl, peer?.gender, Modifier.size(42.dp), peer?.avatarStoragePath)\n                    Spacer(Modifier.width(9.dp))\n                    Column(Modifier.weight(1f)) {\n                        Row(verticalAlignment = Alignment.CenterVertically) { Text(peer?.name ?: \"مستخدم\", color = TextMain, fontWeight = FontWeight.Bold); if (peer?.verified == t
rue) VerifiedBadge() }\n                        Text(peerStatusText(peer), color = if (peer?.online == true) Green else TextMuted, style = MaterialTheme.typography.labelSmall)\n                        if (peerTyping) Text(\"يكتب الآن…\", color = Pink, style = MaterialTheme.typography.labelSmall)\n                    }\n                    IconButton({ menu = true }) { Icon(Icons.Default.MoreVert, null, tint = TextMain) }\n                    DropdownMenu(expanded = menu, onDismissRequest = { menu = false }) {\n                        DropdownMenuItem(text = { Text(\"حظر المستخدم\") }, onClick = { menu = false; blockPeer() }, leadingIcon = { Icon(Icons.Default.Block, null) })\n                        DropdownMenuItem(text = { Text(\"إبلاغ عن المستخدم\") }, onClick = { menu = false; reportDialog = true }, leadingIcon = { Icon(Icons.Default.Report, null) })\n                    }\n                }\n                if (reportDialog) {\n                    AlertDialog(\n                        onDismissRequest = { reportDialog = false },\n                        title = { Text(\"إبلاغ عن المستخدم\") },\n                        text = { Column {\n                            listOf(\"إساءة أو شتائم\", \"تحرش أو محتوى غير مناسب\", \"سبام\", \"اسم مخالف\").forEach { reason ->\n                                TextButton(onClick = { reportDialog = false; reportPeer(reason) }, modifier = Modifier.fillMaxWidth()) { Text(reason, modifier = Modifier.fillMaxWidth(), textAlign = TextAlign.Start) }\n                            }\n                        } },\n                        confirmButton = { TextButton(onClick = { reportDialog = false }) { Text(\"إلغاء\") } }\n                    )\n                }\n                if (isBlocked) Box(Modifier.fillMaxWidth().background(Color(0xFF341126)).padding(10.dp), contentAlignment = Alignment.Center) { Text(\"تم حظر هذا المستخدم\", color = Red, fontWeight = FontWeight.Bold) }\n                LazyColumn(Modifier.weight(1f).fillMaxWidth().padding(10.dp), reverseLayout = false) {\n 
                   items(messages.filter { it.id !in deletedMessageIds && (it.type != \"image\" || it.expiresAt == 0L || it.expiresAt > now) }, key = { it.id }) { m -> MessageBubble(m) }\n                }\n                Row(Modifier.fillMaxWidth().background(Color(0xFF0A091B)).padding(8.dp).navigationBarsPadding(), verticalAlignment = Alignment.CenterVertically) {\n                    IconButton({ imageLauncher.launch(arrayOf(\"image/*\")) }, enabled = !isBlocked && !loading) { Icon(Icons.Default.CameraAlt, \"صورة\", tint = Pink) }\n                    IconButton({ if (isRecording) stopRecordingAndSend() else micLauncher.launch(Manifest.permission.RECORD_AUDIO) }, enabled = !isBlocked && !loading) { Icon(if (isRecording) Icons.Default.Stop else Icons.Default.Mic, \"صوت\", tint = if (isRecording) Red else Blue) }\n                    OutlinedTextField(\n                        text,\n                        {\n                            if (it.length <= MAX_MESSAGE_LENGTH) {\n                                text = it\n                                setTyping(it.isNotBlank())\n                            }\n                        },\n                        Modifier.weight(1f), enabled = !isBlocked && !loading, placeholder = { Text(\"اكتب رسالة\") }, singleLine = true,\n                        colors = OutlinedTextFieldDefaults.colors(focusedContainerColor = Panel2, unfocusedContainerColor = Panel, focusedBorderColor = Pink, unfocusedBorderColor = Color(0xFF3A3355), focusedTextColor = TextMain, unfocusedTextColor = TextMain, cursorColor = Pink)\n                    )\n                    IconButton({ val v = text.trim(); if (v.isNotEmpty()) { sendMessage(v); text = \"\"; setTyping(false) } }, enabled = text.trim().isNotEmpty() && !isBlocked && !loading) { Icon(Icons.Default.Send, \"إرسال\", tint = Pink) }\n                }\n            }\n        }\n    }\n\n    @Composable\n    private fun MessageTextWithLinks(text: String, mine: Boolean) {\n        val urlRegex = Regex(\"https?://[^\\\\s]+\")\n        val 
annotated = buildAnnotatedString {\n            var cursor = 0\n            urlRegex.findAll(text).forEach { match ->\n                append(text.substring(cursor, match.range.first))\n                pushStringAnnotation(\"URL\", match.value)\n                withStyle(SpanStyle(color = if (mine) Color.White else Blue, textDecoration = TextDecoration.Underline)) { append(match.value) }\n                pop()\n                cursor = match.range.last + 1\n            }\n            append(text.substring(cursor))\n        }\n        ClickableText(text = annotated, modifier = Modifier.padding(horizontal = 14.dp, vertical = 10.dp), style = MaterialTheme.typography.bodyLarge.copy(color = TextMain), onClick = { offset ->\n            annotated.getStringAnnotations(\"URL\", offset, offset).firstOrNull()?.let {\n                try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(it.item))) } catch (_: Exception) { showError(\"تعذر فتح الرابط\") }\n            }\n        })\n    }\n\n    @Composable\n    private fun MessageBubble(m: Msg) {\n        val mine = m.senderId == uid\n        var menu by remember(m.id) { mutableStateOf(false) }\n        Row(Modifier.fillMaxWidth(), horizontalArrangement = if (mine) Arrangement.End else Arrangement.Start) {\n            Column(horizontalAlignment = if (mine) Alignment.End else Alignment.Start) {\n                Column(Modifier.combinedClickable(onClick = {}, onLongClick = { menu = true })) {\n                    when (m.type) {\n                        \"image\" -> RemoteStorageImage(m.imageUrl, m.storagePath, \"صورة\", Modifier.widthIn(max = 250.dp).heightIn(max = 280.dp).clip(RoundedCornerShape(18.dp)))\n                        \"audio\" -> OutlinedButton({ playAudio(m.audioUrl) }) { Icon(Icons.Default.PlayArrow, null); Spacer(Modifier.width(5.dp)); Text(\"تشغيل التسجيل\") }\n                        else -> Surface(color = if (mine) Color(0xFF6D25D9) else Panel2, shape = RoundedCornerShape(18.dp)) {\n                            MessageTextWithLinks(m.text, mine)\n     
                   }\n                    }\n                }\n                Row(verticalAlignment = Alignment.CenterVertically) {\n                    Text(formatTime(m.timestamp), color = TextMuted, style = MaterialTheme.typography.labelSmall, modifier = Modifier.padding(horizontal = 4.dp, vertical = 2.dp))\n                    if (mine) {\n                        val read = m.readAt > 0L\n                        val delivered = m.deliveredAt > 0L\n                        Text(if (read) \"✓✓\" else if (delivered) \"✓✓\" else \"✓\", color = if (read) Blue else TextMuted, style = MaterialTheme.typography.labelSmall)\n                    }\n                }\n                DropdownMenu(expanded = menu, onDismissRequest = { menu = false }) {\n                    DropdownMenuItem(text = { Text(\"حذف لدي\") }, onClick = { menu = false; deleteForMe(m.id) }, leadingIcon = { Icon(Icons.Default.DeleteOutline, null) })\n                    if (mine) DropdownMenuItem(text = { Text(\"حذف لدى الجميع\") }, onClick = { menu = false; deleteForEveryone(m) }, leadingIcon = { Icon(Icons.Default.DeleteForever, null) })\n                }\n            }\n        }\n        Spacer(Modifier.height(5.dp))\n    }\n\n    @Composable\n    private fun GenderChoice(value: String, onChange: (String) -> Unit) {\n        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {\n            GenderCard(\"male\", \"ذكر\", value == \"male\", onChange, Modifier.weight(1f))\n            GenderCard(\"female\", \"أنثى\", value == \"female\", onChange, Modifier.weight(1f))\n        }\n    }\n\n    @Composable\n    private fun GenderCard(gender: String, label: String, selected: Boolean, onChange: (String) -> Unit, modifier: Modifier) {\n        Column(modifier.clip(RoundedCornerShape(18.dp)).background(if (selected) Color(0xFF28104D) else Panel).border(1.dp, if (selected) (if (gender == \"male\") Blue else Pink) else Color(0xFF363052), RoundedCornerShape(18.dp)).clickable { onChange(gender) }.padding(12.dp), horizontalAli
gnment = Alignment.CenterHorizontally) {\n            GenderAvatar(gender, Modifier.size(68.dp)); Spacer(Modifier.height(5.dp)); Text(label, color = if (selected) Color.White else TextMuted, fontWeight = FontWeight.Bold)\n        }\n    }\n\n    @Composable\n    private fun GenderAvatar(gender: String, modifier: Modifier) {\n        val base = if (gender == \"female\") Pink else Blue\n        Canvas(modifier.clip(CircleShape).background(base.copy(alpha = .18f))) {\n            val w = size.width; val h = size.height\n            drawCircle(base, radius = w * .23f, center = Offset(w / 2f, h * .34f))\n            drawRoundRect(base, topLeft = Offset(w * .23f, h * .52f), size = androidx.compose.ui.geometry.Size(w * .54f, h * .34f), cornerRadius = androidx.compose.ui.geometry.CornerRadius(w * .18f, w * .18f))\n            if (gender == \"female\") {\n                drawArc(Color(0xFF4A194D), 190f, 160f, false, style = Stroke(w * .16f, cap = StrokeCap.Round), topLeft = Offset(w * .17f, h * .08f), size = androidx.compose.ui.geometry.Size(w * .66f, h * .48f))\n            } else {\n                drawLine(Color(0xFF15335D), Offset(w * .31f, h * .19f), Offset(w * .69f, h * .19f), strokeWidth = w * .12f, cap = StrokeCap.Round)\n            }\n        }\n    }\n\n    @Composable\n    private fun RemoteStorageImage(\n        url: String?,\n        storagePath: String?,\n        contentDescription: String?,\n        modifier: Modifier,\n        contentScale: ContentScale = ContentScale.Crop\n    ) {\n        var resolvedUrl by remember(url, storagePath) { mutableStateOf(url.orEmpty()) }\n        LaunchedEffect(url, storagePath) {\n            if (!storagePath.isNullOrBlank()) {\n                storage.reference.child(storagePath).downloadUrl\n                    .addOnSuccessListener { resolvedUrl = it.toString() }\n            }\n        }\n        if (resolvedUrl.isNotBlank()) {\n            AsyncImage(resolvedUrl, contentDescription, modifier, contentScale = contentScale)\n        }\n    }\n\n    @Composable\n    priva
te fun Avatar(name: String, verified: Boolean, url: String?, gender: String?, modifier: Modifier, storagePath: String? = null) {\n        Box(modifier.clip(CircleShape).background(Color(0xFF26154B)), contentAlignment = Alignment.Center) {\n            if (!url.isNullOrBlank() || !storagePath.isNullOrBlank()) RemoteStorageImage(url, storagePath, \"صورة المستخدم\", Modifier.fillMaxSize())\n            else GenderAvatar(if (gender == \"female\") \"female\" else \"male\", Modifier.fillMaxSize())\n\n        }\n    }\n\n    @Composable\n    private fun VerifiedBadge() { Box(Modifier.padding(start = 4.dp).size(18.dp).background(Blue, CircleShape), contentAlignment = Alignment.Center) { Icon(Icons.Default.Check, null, tint = Color.White, modifier = Modifier.size(12.dp)) } }\n\n    @Composable\n    private fun AdminBadge() { Surface(color = Color(0xFF35203F), shape = RoundedCornerShape(8.dp)) { Text(\"ADMIN\", color = Color(0xFFFFC24B), fontSize = MaterialTheme.typography.labelSmall.fontSize, fontWeight = FontWeight.ExtraBold, modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp)) } }\n\n    @Composable\n    private fun ErrorText() { errorText?.let { Text(it, color = Red, textAlign = TextAlign.Center, modifier = Modifier.fillMaxWidth().padding(10.dp)) } }\n\n    private fun loadProfileOrSetup() {\n        if (uid.isBlank()) return\n        db.reference.child(\"users\").child(uid).get().addOnSuccessListener { s ->\n            val u = parseUser(s)\n            profile = u\n            // Repair old accounts that were created before the name filter existed.\n            if (u != null && u.name.isNotBlank()) {\n                val safe = sanitizeDisplayName(u.name)\n                if (safe != u.name) {\n                    db.reference.child(\"users\").child(uid).child(\"name\").setValue(safe)\n                    profile = u.copy(name = safe)\n                }\n            }\n            if (u?.banned == true) { showError(\"هذا الحساب محظور من الإدارة\"); logout(); return@addOnSuccessListener }\n            if (
u == null || u.name.isBlank() || u.gender.isBlank()) screen = \"guest\" else { screen = \"main\"; if (uid == OWNER_UID) normalizeAdminFlags(); startListeners(); setPresence(true); requestNotificationPermissionIfNeeded() }\n        }.addOnFailureListener { showError(it.message ?: \"تعذر تحميل الحساب\") }\n    }\n\n    private fun normalizeAdminFlags() {\n        if (uid != OWNER_UID) return\n        db.reference.child(\"users\").get().addOnSuccessListener { snap ->\n            snap.children.forEach { child ->\n                val id = child.key ?: return@forEach\n                val isAdmin = child.child(\"admin\").getValue(Boolean::class.java) ?: false\n                if (id != OWNER_UID && isAdmin) db.reference.child(\"users\").child(id).child(\"admin\").setValue(false)\n            }\n            db.reference.child(\"users\").child(OWNER_UID).child(\"admin\").setValue(true)\n        }\n    }\n\n    private fun createGuestProfile(name: String, gender: String) {\n        loading = true; errorText = null\n        if (uid.isBlank()) auth.signInAnonymously().addOnSuccessListener { uid = it.user!!.uid; saveProfile(sanitizeDisplayName(name), \"\", gender, true) }.addOnFailureListener { loading = false; showError(it.message ?: \"تعذر دخول الزائر\") }\n        else saveProfile(sanitizeDisplayName(name), \"\", gender, true)\n    }\n\n    private fun register(name: String, email: String, password: String, gender: String) {\n        loading = true; errorText = null\n        val current = auth.currentUser\n        val credential = EmailAuthProvider.getCredential(email.trim(), password)\n        val task = if (current?.isAnonymous == true) current.linkWithCredential(credential) else auth.createUserWithEmailAndPassword(email.trim(), password)\n        task.addOnSuccessListener { uid = it.user?.uid ?: uid; saveProfile(sanitizeDisplayName(name), email.trim(), gender, false) }.addOnFailureListener { loading = false; showError(it.message ?: \"تعذر إنشاء الحساب\") }\n    }\n\n    private fun signInWithGoogle() {\n        val cli
entIdRes = resources.getIdentifier(\"default_web_client_id\", \"string\", packageName)\n        if (clientIdRes == 0) {\n            showError(\"فعّل Google من Firebase ثم نزّل google-services.json الجديد وضعه في المشروع\")\n            return\n        }\n        val serverClientId = getString(clientIdRes)\n        if (serverClientId.isBlank()) {\n            showError(\"معرّف Google OAuth غير موجود في إعدادات Firebase\")\n            return\n        }\n        loading = true\n        val credentialManager = CredentialManager.create(this)\n        val googleIdOption = GetGoogleIdOption.Builder()\n            .setServerClientId(serverClientId)\n            .setFilterByAuthorizedAccounts(false)\n            .setAutoSelectEnabled(false)\n            .build()\n        val request = GetCredentialRequest.Builder().addCredentialOption(googleIdOption).build()\n        lifecycleScope.launch {\n            try {\n                val result = credentialManager.getCredential(this@MainActivity, request)\n                val credential = result.credential\n                if (credential is CustomCredential && credential.type == GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL) {\n                    val googleCredential = try {\n                        GoogleIdTokenCredential.createFrom(credential.data)\n                    } catch (e: GoogleIdTokenParsingException) {\n                        loading = false\n                        showError(\"تعذر قراءة حساب Google\")\n                        return@launch\n                    }\n                    val firebaseCredential = GoogleAuthProvider.getCredential(googleCredential.idToken, null)\n                    val current = auth.currentUser\n                    val authTask = if (current?.isAnonymous == true) current.linkWithCredential(firebaseCredential) else auth.signInWithCredential(firebaseCredential)\n                    authTask\n                        .addOnSuccessListener { uid = it.user?.uid ?: uid; loadProfileOrSetup() }\n                        .addOnFailure
Listener { loading = false; showError(it.message ?: \"تعذر تسجيل الدخول عبر Google\") }\n                } else {\n                    loading = false\n                    showError(\"لم يتم اختيار حساب Google صالح\")\n                }\n            } catch (e: Exception) {\n                loading = false\n                showError(e.message ?: \"تعذر تسجيل الدخول عبر Google\")\n            }\n        }\n    }\n\n    private fun login(email: String, password: String) {\n        loading = true; errorText = null\n        auth.signInWithEmailAndPassword(email.trim(), password).addOnSuccessListener { uid = it.user!!.uid; loadProfileOrSetup() }.addOnFailureListener { loading = false; showError(it.message ?: \"تعذر تسجيل الدخول\") }\n    }\n\n    private fun resetPassword(email: String) {\n        if (!email.contains(\"@\")) { showError(\"اكتب بريدًا إلكترونيًا صحيحًا\"); return }\n        auth.sendPasswordResetEmail(email.trim()).addOnSuccessListener { showError(\"تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك\") }.addOnFailureListener { showError(it.message ?: \"تعذر إرسال الرابط\") }\n    }\n\n    private fun changePassword(current: String, newPassword: String, confirm: String) {\n        val user = auth.currentUser\n        val email = user?.email\n        if (user == null || email.isNullOrBlank() || user.isAnonymous) { showError(\"هذا الحساب لا يدعم تغيير كلمة المرور\"); return }\n        if (current.isBlank() || newPassword.length < 6 || confirm.isBlank()) { showError(\"أدخل كلمة المرور الحالية والجديدة وتأكيدها\"); return }\n        if (newPassword != confirm) { showError(\"كلمتا المرور الجديدتان غير متطابقتين\"); return }\n        loading = true\n        user.reauthenticate(EmailAuthProvider.getCredential(email, current))\n            .continueWithTask { user.updatePassword(newPassword) }\n            .addOnSuccessListener { loading = false; showError(\"تم تغيير كلمة المرور بنجاح\") }\n            .addOnFailureListener { loading = false; showError(it.message ?: \"تعذر تغيير كلمة المرور\") }\n    }\n\n    priv
ate fun saveProfile(name: String, email: String, gender: String, anonymous: Boolean) {\n        val safeName = sanitizeDisplayName(name)\n        val ref = db.reference.child(\"users\").child(uid)\n        ref.get().addOnSuccessListener { existing ->\n            val old = parseUser(existing)\n            val data = mutableMapOf<String, Any>(\n                \"uid\" to uid, \"name\" to safeName, \"email\" to email,\n                \"gender\" to (old?.gender?.takeIf { it.isNotBlank() } ?: gender),\n                \"verified\" to (old?.verified ?: false),\n                \"banned\" to (old?.banned ?: false),\n                \"online\" to (old?.manualOffline != true),\n                \"joinedAt\" to if ((old?.joinedAt ?: 0L) > 0L) old!!.joinedAt else ServerValue.TIMESTAMP,\n                \"lastSeen\" to ServerValue.TIMESTAMP,\n                \"manualOffline\" to (old?.manualOffline ?: false)\n            )\n            // Admin is derived from the fixed owner UID. Preserve any legacy\n            // non-owner admin flag instead of trying to rewrite it during profile updates.\n            if (uid == OWNER_UID || !existing.hasChild(\"admin\")) {\n                data[\"admin\"] = (uid == OWNER_UID)\n            }\n            ref.updateChildren(data).addOnSuccessListener {\n                if (old?.manualOffline == true) setPresence(false) else setPresence(true)\n                loading = false\n                loadProfileOrSetup()\n            }.addOnFailureListener { loading = false; showError(it.message ?: \"تعذر حفظ البيانات\") }\n        }.addOnFailureListener {\n            loading = false\n            showError(it.message ?: \"تعذر قراءة بيانات الحساب\")\n        }\n    }\n\n    private fun setManualOffline(offline: Boolean) {\n        if (uid.isBlank()) return\n        db.reference.child(\"users\").child(uid).updateChildren(mapOf(\"manualOffline\" to offline, \"online\" to !offline, \"lastSeen\" to ServerValue.TIMESTAMP))\n            .addOnSuccessListener {\n                profile = profile?.copy(ma
nualOffline = offline, online = !offline, lastSeen = System.currentTimeMillis())\n                if (offline) db.reference.child(\"waiting\").child(uid).removeValue() else setPresence(true)\n            }\n            .addOnFailureListener { showError(it.message ?: \"تعذر تغيير حالة الظهور\") }\n    }\n\n    private fun setPresence(isOnline: Boolean) {\n        if (uid.isBlank()) return\n        if (isOnline && profile?.manualOffline == true) return\n        val ref = db.reference.child(\"users\").child(uid)\n        if (isOnline) {\n            // Register disconnect handlers once per foreground session. Do not\n            // rewrite joinedAt here; it is the user's original join time.\n            ref.child(\"online\").onDisconnect().setValue(false)\n            ref.child(\"lastSeen\").onDisconnect().setValue(ServerValue.TIMESTAMP)\n            ref.updateChildren(mapOf(\"online\" to true, \"lastSeen\" to ServerValue.TIMESTAMP))\n        } else {\n            ref.updateChildren(mapOf(\"online\" to false, \"lastSeen\" to ServerValue.TIMESTAMP))\n        }\n    }\n\n    private fun startListeners() {\n        usersListener?.let { db.reference.child(\"users\").removeEventListener(it) }\n        usersListener = object : ValueEventListener {\n            override fun onDataChange(s: DataSnapshot) {\n                onlineUsers.clear()\n                s.children.mapNotNull { parseUser(it) }.forEach { if (it.online || it.uid == uid) onlineUsers.add(it) }\n                parseUser(s.child(uid))?.let { profile = it }\n            }\n            override fun onCancelled(e: DatabaseError) { showError(e.message) }\n        }\n        db.reference.child(\"users\").addValueEventListener(usersListener!!)\n\n        chatsListener?.let { db.reference.child(\"userChats\").child(uid).removeEventListener(it) }\n        chatsListener = object : ValueEventListener {\n            override fun onDataChange(s: DataSnapshot) {\n                chats.clear()\n                s.children.mapNotNull { snap -> ChatPreview(snap.key ?: retur
n@mapNotNull null, snap.child(\"peerId\").getValue(String::class.java).orEmpty(), snap.child(\"peerName\").getValue(String::class.java).orEmpty(), snap.child(\"peerVerified\").getValue(Boolean::class.java) ?: false, snap.child(\"peerAvatar\").getValue(String::class.java).orEmpty(), snap.child(\"peerAvatarPath\").getValue(String::class.java).orEmpty(), snap.child(\"lastMessage\").getValue(String::class.java).orEmpty(), snap.child(\"updatedAt\").getValue(Long::class.java) ?: 0L, snap.child(\"unreadCount\").getValue(Int::class.java) ?: 0) }.forEach { chats.add(it) }\n                val totalUnread = chats.sumOf { it.unreadCount }\n                if (unreadInitialized && totalUnread > lastUnreadTotal && screen != \"chat\") playMessageSoundIfEnabled(true)\n                lastUnreadTotal = totalUnread\n                unreadInitialized = true\n            }\n            override fun onCancelled(e: DatabaseError) { showError(e.message) }\n        }\n        db.reference.child(\"userChats\").child(uid).addValueEventListener(chatsListener!!)\n    }\n\n    private fun startMatching() {\n        if (uid.isBlank()) return\n        if (profile?.manualOffline == true) { showError(\"فعّل الظهور متصل لاستخدام العشوائي\"); return }\n        loading = true; errorText = null\n        val root = db.reference.child(\"waiting\")\n        val me = root.child(uid)\n        me.onDisconnect().removeValue()\n        root.runTransaction(object : Transaction.Handler {\n            override fun doTransaction(d: MutableData): Transaction.Result {\n                var peer: String? = null\n                for (c in d.children) if (c.key != uid && c.child(\"roomId\").value == null) { peer = c.key; break }\n                if (peer == null) d.child(uid).value = mapOf(\"createdAt\" to ServerValue.TIMESTAMP)\n                else {\n                    val p = peer!!; val roomId = listOf(uid, p).sorted().joinToString(\"-\")\n                    d.child(uid).value = mapOf(\"createdAt\" to ServerValue.TIMESTAMP, \"roomId\" to roomId, \"peerId\" to
 p)\n                    d.child(p).child(\"roomId\").value = roomId; d.child(p).child(\"peerId\").value = uid\n                }\n                return Transaction.success(d)\n            }\n            override fun onComplete(e: DatabaseError?, committed: Boolean, s: DataSnapshot?) {\n                if (e != null || !committed) { loading = false; showError(e?.message ?: \"تعذر البحث\"); return }\n                val meSnap = s?.child(uid); val room = meSnap?.child(\"roomId\")?.getValue(String::class.java)\n                if (!room.isNullOrBlank()) openRoom(room, meSnap.child(\"peerId\").getValue(String::class.java).orEmpty()) else waitForMatch()\n            }\n        })\n    }\n\n    private fun waitForMatch() {\n        val ref = db.reference.child(\"waiting\").child(uid)\n        waitingListener?.let { ref.removeEventListener(it) }\n        waitingListener = object : ValueEventListener {\n            override fun onDataChange(s: DataSnapshot) {\n                val room = s.child(\"roomId\").getValue(String::class.java)\n                if (!room.isNullOrBlank()) { ref.removeValue(); waitingListener?.let { ref.removeEventListener(it) }; waitingListener = null; openRoom(room, s.child(\"peerId\").getValue(String::class.java).orEmpty()) }\n            }\n            override fun onCancelled(e: DatabaseError) { loading = false; showError(e.message) }\n        }\n        ref.addValueEventListener(waitingListener!!)\n    }\n\n    private fun openRoom(roomId: String, peerId: String) {\n        if (peerId.isBlank() || peerId == uid) { showError(\"لا يمكن فتح محادثة مع هذا الحساب\"); return }\n        db.reference.child(\"waiting\").child(uid).removeValue()\n        stopTyping()\n        currentRoomRef?.let { old -> messagesListener?.let { old.removeEventListener(it) } }\n        messageDeletesListener?.let { db.reference.child(\"messageDeletes\").child(uid).child(roomId).removeEventListener(it) }\n        typingListener?.let { db.reference.child(\"typing\").child(peerId).removeEventListener(it) }\n        curren
tRoomRef = null; messagesListener = null; messageDeletesListener = null; typingListener = null\n        currentRoom = roomId; currentPeer = null; messages.clear(); deletedMessageIds.clear(); peerTyping = false; isBlocked = false; loading = false; errorText = null; screen = \"chat\"\n\n        db.reference.child(\"users\").child(peerId).get().addOnSuccessListener { snap -> currentPeer = parseUser(snap); checkBlocked() }.addOnFailureListener { showError(\"تعذر تحميل بيانات المستخدم\") }\n\n        val membersRef = db.reference.child(\"rooms\").child(roomId).child(\"members\")\n        membersRef.child(uid).setValue(true).addOnSuccessListener {\n            // Each participant adds only their own UID. The other participant\n            // will become a member automatically when they open the same room.\n            attachRoomMessages(roomId, peerId)\n            markRoomMessagesRead(roomId)\n            db.reference.child(\"userChats\").child(uid).child(roomId).child(\"unreadCount\").setValue(0)\n        }.addOnFailureListener { showError(it.message ?: \"تعذر فتح المحادثة\") }\n    }\n\n    private fun addMessageSnapshot(s: DataSnapshot) {\n        val type = s.child(\"type\").getValue(String::class.java).orEmpty().ifBlank { \"text\" }\n        val expires = s.child(\"expiresAt\").getValue(Long::class.java) ?: 0L\n        if (type == \"image\" && expires > 0 && expires <= System.currentTimeMillis()) { s.ref.removeValue(); return }\n        val m = Msg(\n            s.key ?: return,\n            s.child(\"senderId\").getValue(String::class.java).orEmpty(),\n            type,\n            s.child(\"text\").getValue(String::class.java).orEmpty(),\n            s.child(\"imageUrl\").getValue(String::class.java).orEmpty(),\n            s.child(\"audioUrl\").getValue(String::class.java).orEmpty(),\n            s.child(\"storagePath\").getValue(String::class.java).orEmpty(),\n            s.child(\"timestamp\").getValue(Long::class.java) ?: 0L,\n            expires,\n            s.child(\"deliveredAt\").getValue(Long::class.
java) ?: 0L,\n            s.child(\"readAt\").getValue(Long::class.java) ?: 0L\n        )\n        val idx = messages.indexOfFirst { it.id == m.id }\n        if (idx >= 0) messages[idx] = m else messages.add(m)\n        messages.sortBy { it.timestamp }\n    }\n\n    private fun attachRoomMessages(roomId: String, peerId: String) {\n        if (currentRoom != roomId) return\n        currentRoomRef?.let { old -> messagesListener?.let { old.removeEventListener(it) } }\n        val ref = db.reference.child(\"rooms\").child(roomId).child(\"messages\")\n        currentRoomRef = ref\n        messageListenerPrimed = false\n        messagesListener = object : ChildEventListener {\n            override fun onChildAdded(s: DataSnapshot, p: String?) {\n                val wasKnown = messages.any { it.id == s.key }\n                addMessageSnapshot(s)\n                if (!wasKnown && s.child(\"senderId\").getValue(String::class.java) != uid) {\n                    markMessageRead(roomId, s.key.orEmpty())\n                    if (messageListenerPrimed) playMessageSoundIfEnabled(false)\n                }\n            }\n            override fun onChildChanged(s: DataSnapshot, p: String?) {\n                val idx = messages.indexOfFirst { it.id == s.key }\n                if (idx >= 0) {\n                    val old = messages[idx]\n                    messages[idx] = old.copy(deliveredAt = s.child(\"deliveredAt\").getValue(Long::class.java) ?: old.deliveredAt, readAt = s.child(\"readAt\").getValue(Long::class.java) ?: old.readAt)\n                }\n            }\n            override fun onChildRemoved(s: DataSnapshot) { messages.removeAll { it.id == s.key } }\n            override fun onChildMoved(s: DataSnapshot, p: String?) {}\n            override fun onCancelled(e: DatabaseError) { showError(e.message) }\n        }\n        ref.addChildEventListener(messagesListener!!)\n        ref.get().addOnSuccessListener { s ->\n            s.children.forEach { addMessageSnapshot(it) }\n            markRoomMessagesRead(roomId)\n  
          messageListenerPrimed = true\n        }.addOnFailureListener { messageListenerPrimed = true }\n\n        val deletesRef = db.reference.child(\"messageDeletes\").child(uid).child(roomId)\n        messageDeletesListener = object : ValueEventListener {\n            override fun onDataChange(s: DataSnapshot) { deletedMessageIds.clear(); s.children.forEach { if (it.getValue(Boolean::class.java) == true) it.key?.let(deletedMessageIds::add) } }\n            override fun onCancelled(e: DatabaseError) {}\n        }\n        deletesRef.addValueEventListener(messageDeletesListener!!)\n\n        typingListener = object : ValueEventListener {\n            override fun onDataChange(s: DataSnapshot) { peerTyping = s.getValue(Boolean::class.java) == true }\n            override fun onCancelled(e: DatabaseError) {}\n        }\n        db.reference.child(\"typing\").child(peerId).addValueEventListener(typingListener!!)\n\n        ref.orderByChild(\"expiresAt\").addListenerForSingleValueEvent(object : ValueEventListener {\n            override fun onDataChange(s: DataSnapshot) {\n                val cutoff = System.currentTimeMillis() - MESSAGE_RETENTION_MS\n                s.children.forEach {\n                    val ex = it.child(\"expiresAt\").getValue(Long::class.java) ?: 0L\n                    val ts = it.child(\"timestamp\").getValue(Long::class.java) ?: 0L\n                    val path = it.child(\"storagePath\").getValue(String::class.java).orEmpty()\n                    if ((ex > 0 && ex <= System.currentTimeMillis()) || (ts > 0 && ts < cutoff)) {\n                        it.ref.removeValue()\n                        if (path.isNotBlank()) storage.reference.child(path).delete()\n                    }\n                }\n            }\n            override fun onCancelled(e: DatabaseError) {}\n        })\n    }\n\n    private fun markRoomMessagesRead(roomId: String) {\n        val ref = db.reference.child(\"rooms\").child(roomId).child(\"messages\")\n        ref.addListenerForSingleValueEvent(object : ValueEvent
Listener {\n            override fun onDataChange(s: DataSnapshot) { s.children.forEach { if (it.child(\"senderId\").getValue(String::class.java) != uid && it.child(\"readAt\").getValue(Long::class.java) ?: 0L == 0L) markMessageRead(roomId, it.key.orEmpty()) } }\n            override fun onCancelled(e: DatabaseError) {}\n        })\n    }\n\n    private fun markMessageRead(roomId: String, messageId: String) {\n        if (messageId.isBlank()) return\n        val ts = ServerValue.TIMESTAMP\n        db.reference.child(\"rooms\").child(roomId).child(\"messages\").child(messageId).updateChildren(mapOf(\"deliveredAt\" to ts, \"readAt\" to ts))\n    }\n\n    private fun setTyping(value: Boolean) {\n        if (uid.isBlank()) return\n        typingRunnable?.let(typingHandler::removeCallbacks)\n        val ref = db.reference.child(\"typing\").child(uid)\n        if (!value) { ref.onDisconnect().cancel(); ref.setValue(false); return }\n        ref.onDisconnect().setValue(false)\n        ref.setValue(true)\n        typingRunnable = Runnable { ref.setValue(false) }\n        typingHandler.postDelayed(typingRunnable!!, TYPING_TIMEOUT_MS)\n    }\n\n    private fun stopTyping() { typingRunnable?.let(typingHandler::removeCallbacks); typingRunnable = null; if (uid.isNotBlank()) db.reference.child(\"typing\").child(uid).setValue(false) }\n\n    private fun checkBlocked() {\n        val peer = currentPeer ?: return\n        db.reference.child(\"blocks\").child(uid).child(peer.uid).get().addOnSuccessListener { a -> db.reference.child(\"blocks\").child(peer.uid).child(uid).get().addOnSuccessListener { b -> isBlocked = a.exists() || b.exists() } }\n    }\n\n    private fun reserveMessageSlot(action: () -> Unit) {\n        if (uid.isBlank()) return\n        val ref = db.reference.child(\"rateLimits\").child(uid)\n        ref.runTransaction(object : Transaction.Handler {\n            override fun doTransaction(d: MutableData): Transaction.Result {\n                val nowTs = System.currentTimeMillis()\n                val windowStart =
 d.child(\"windowStart\").getValue(Long::class.java) ?: 0L\n                val count = d.child(\"count\").getValue(Int::class.java) ?: 0\n                if (windowStart <= 0L || nowTs - windowStart >= 10_000L) { d.child(\"windowStart\").value = nowTs; d.child(\"count\").value = 1; return Transaction.success(d) }\n                if (count >= 6) return Transaction.abort()\n                d.child(\"count\").value = count + 1\n                return Transaction.success(d)\n            }\n            override fun onComplete(e: DatabaseError?, committed: Boolean, s: DataSnapshot?) {\n                if (e != null) { showError(e.message); return }\n                if (!committed) { showError(\"تم إيقاف الإرسال مؤقتًا لتقليل السبام\"); return }\n                action()\n            }\n        })\n    }\n\n    private fun reportPeer(reason: String) {\n        val peer = currentPeer ?: return\n        val id = db.reference.child(\"reports\").push().key ?: return\n        val data = mapOf<String, Any>(\"reporterId\" to uid, \"reportedId\" to peer.uid, \"reason\" to reason, \"createdAt\" to ServerValue.TIMESTAMP)\n        db.reference.child(\"reports\").child(id).setValue(data).addOnSuccessListener { showError(\"تم إرسال البلاغ للإدارة\") }.addOnFailureListener { showError(it.message ?: \"تعذر إرسال البلاغ\") }\n    }\n\n    private fun sendMessage(text: String) {\n        val room = currentRoom ?: return; val peer = currentPeer ?: return; if (isBlocked) return\n        reserveMessageSlot {\n            val ref = db.reference.child(\"rooms\").child(room).child(\"messages\").push()\n            val data = mapOf<String, Any>(\"senderId\" to uid, \"type\" to \"text\", \"text\" to text.take(MAX_MESSAGE_LENGTH), \"timestamp\" to ServerValue.TIMESTAMP, \"expiresAt\" to 0L, \"deliveredAt\" to 0L, \"readAt\" to 0L, \"storagePath\" to \"\")\n            ref.setValue(data).addOnSuccessListener { updateChatPreview(peer, text) }.addOnFailureListener { showError(it.message ?: \"فشل إرسال الرسالة\") }\n        }\n    }\n\n    private
 fun updateChatPreview(peer: UserProfile, last: String) {\n        val room = currentRoom ?: return\n        val nowTs = System.currentTimeMillis()\n        val mine = mapOf(\"peerId\" to peer.uid, \"peerName\" to peer.name, \"peerVerified\" to peer.verified, \"peerAvatar\" to peer.avatarUrl, \"peerAvatarPath\" to peer.avatarStoragePath, \"lastMessage\" to last, \"updatedAt\" to nowTs, \"unreadCount\" to 0)\n        val peerRef = db.reference.child(\"userChats\").child(peer.uid).child(room)\n        db.reference.child(\"userChats\").child(uid).child(room).setValue(mine)\n        peerRef.runTransaction(object : Transaction.Handler {\n            override fun doTransaction(d: MutableData): Transaction.Result {\n                val old = d.child(\"unreadCount\").getValue(Int::class.java) ?: 0\n                d.child(\"peerId\").value = uid\n                d.child(\"peerName\").value = profile?.name ?: \"مستخدم\"\n                d.child(\"peerVerified\").value = profile?.verified ?: false\n                d.child(\"peerAvatar\").value = profile?.avatarUrl ?: \"\"\n                d.child(\"peerAvatarPath\").value = profile?.avatarStoragePath ?: \"\"\n                d.child(\"lastMessage\").value = last\n                d.child(\"updatedAt\").value = nowTs\n                d.child(\"unreadCount\").value = old + 1\n                return Transaction.success(d)\n            }\n            override fun onComplete(e: DatabaseError?, committed: Boolean, s: DataSnapshot?) { if (e != null) showError(e.message) }\n        })\n    }\n\n    private fun uploadFileAndGetUrl(\n        path: String,\n        file: File,\n        metadata: com.google.firebase.storage.StorageMetadata,\n        onSuccess: (Uri) -> Unit,\n        onFailure: (Exception) -> Unit\n    ) {\n        if (!file.exists() || file.length() <= 0L) {\n            onFailure(IllegalStateException(\"الملف المحلي غير موجود أو فارغ\"))\n            return\n        }\n        val ref = storage.reference.child(path)\n        ref.putFile(Uri.fromFile(file), metadata)\
n            .continueWithTask { uploadTask ->\n                if (!uploadTask.isSuccessful) {\n                    throw (uploadTask.exception ?: IllegalStateException(\"فشل رفع الملف\"))\n                }\n                // Verify the exact object that was uploaded before asking\n                // Firebase for its download URL.\n                ref.getMetadata()\n            }\n            .continueWithTask { metadataTask ->\n                if (!metadataTask.isSuccessful) {\n                    throw (metadataTask.exception ?: IllegalStateException(\"تم الرفع لكن الملف غير قابل للقراءة\"))\n                }\n                ref.downloadUrl\n            }\n            .addOnSuccessListener { onSuccess(it) }\n            .addOnFailureListener { e ->\n                val code = (e as? com.google.firebase.storage.StorageException)?.errorCode\n                val details = when (code) {\n                    com.google.firebase.storage.StorageException.ERROR_OBJECT_NOT_FOUND -> \"الملف غير موجود في Storage بعد الرفع\"\n                    com.google.firebase.storage.StorageException.ERROR_NOT_AUTHORIZED -> \"صلاحية Storage مرفوضة\"\n                    com.google.firebase.storage.StorageException.ERROR_BUCKET_NOT_FOUND -> \"Firebase Storage غير مهيأ لهذا المشروع\"\n                    else -> e.message ?: e.javaClass.simpleName\n                }\n                onFailure(IllegalStateException(\"Storage: $details | path=$path\", e))\n            }\n    }\n\n    private fun uploadChatImage(uri: Uri) {\n        val room = currentRoom ?: return\n        val peer = currentPeer ?: return\n        if (isBlocked) return\n        reserveMessageSlot {\n            loading = true\n            val id = UUID.randomUUID().toString()\n            val storagePath = \"messages/$room/$id.jpg\"\n            val compressed = compressImageUri(uri)\n            if (compressed == null) { loading = false; showError(\"تعذر تجهيز الصورة\"); return@reserveMessageSlot }\n            val metadata = com.google.firebase.storage.StorageMeta
data.Builder().setContentType(\"image/jpeg\").build()\n            uploadFileAndGetUrl(storagePath, compressed, metadata, { url ->\n                val expires = System.currentTimeMillis() + IMAGE_LIFETIME_MS\n                val data = mapOf<String, Any>(\"senderId\" to uid, \"type\" to \"image\", \"text\" to \"\", \"imageUrl\" to url.toString(), \"timestamp\" to ServerValue.TIMESTAMP, \"expiresAt\" to expires, \"deliveredAt\" to 0L, \"readAt\" to 0L, \"storagePath\" to storagePath)\n                db.reference.child(\"rooms\").child(room).child(\"messages\").child(id).setValue(data)\n                    .addOnSuccessListener { loading = false; compressed.delete(); updateChatPreview(peer, \"

📷 صورة\") }\n                    .addOnFailureListener {\n                        loading = false\n                        compressed.delete()\n                        storage.reference.child(storagePath).delete()\n                        showError(it.message ?: \"فشل إرسال الصورة\")\n                    }\n            }, { error ->\n                loading = false\n                compressed.delete()\n                showError(error.message ?: \"فشل رفع الصورة\")\n            })\n        }\n    }\n\n    private fun compressImageUri(uri: Uri): File? {\n        return try {\n            val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }\n            contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }\n            var sample = 1\n            while (bounds.outWidth / sample > 1280 || bounds.outHeight / sample > 1280) sample *= 2\n            val opts = BitmapFactory.Options().apply { inSampleSize = sample; inPreferredConfig = Bitmap.Config.RGB_565 }\n            val bitmap = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return null\n            val file = File(cacheDir, \"compressed-${UUID.randomUUID()}.jpg\")\n            file.outputStream().use { bitmap.compress(Bitmap.CompressFormat.JPEG, 80, it) }\n            bitmap.recycle()\n            file\n        } catch (_: Exception) { null }\n    }\n\n    private fun startRecording() {\n        if (isRecording) return\n        val file = File(cacheDir, \"voice-${UUID.randomUUID()}.m4a\"); recordingFile = file\n        try {\n            mediaRecorder = MediaRecorder().apply { setAudioSource(MediaRecorder.AudioSource.MIC); setOutputFormat(MediaRecorder.OutputFormat.MPEG_4); setAudioEncoder(MediaRecorder.AudioEncoder.AAC); setAudioEncodingBitRate(64000); setAudioSamplingRate(44100); setOutputFile(file.absolutePath); prepare(); start() }\n            isRecording = true\n            Toast.makeText(this, \"جاري التسجيل… اضغط الميكروفون مرة أخرى للإرسال\", Toast.LENGTH
_SHORT).show()\n        } catch (e: Exception) { mediaRecorder?.release(); mediaRecorder = null; showError(e.message ?: \"تعذر بدء التسجيل\") }\n    }\n\n    private fun stopRecordingAndSend() {\n        if (!isRecording) return\n        try { mediaRecorder?.stop() } catch (_: Exception) {}\n        mediaRecorder?.release(); mediaRecorder = null; isRecording = false\n        val file = recordingFile ?: return\n        val room = currentRoom ?: return\n        val peer = currentPeer ?: return\n        reserveMessageSlot {\n            loading = true\n            val id = UUID.randomUUID().toString()\n            val storagePath = \"messages/$room/$id.m4a\"\n            val metadata = com.google.firebase.storage.StorageMetadata.Builder().setContentType(\"audio/mp4\").build()\n            uploadFileAndGetUrl(storagePath, file, metadata, { url ->\n                val data = mapOf<String, Any>(\"senderId\" to uid, \"type\" to \"audio\", \"text\" to \"\", \"audioUrl\" to url.toString(), \"timestamp\" to ServerValue.TIMESTAMP, \"expiresAt\" to 0L, \"deliveredAt\" to 0L, \"readAt\" to 0L, \"storagePath\" to storagePath)\n                db.reference.child(\"rooms\").child(room).child(\"messages\").child(id).setValue(data)\n                    .addOnSuccessListener { loading = false; updateChatPreview(peer, \"
🎤 تسجيل صوتي\"); file.delete(); recordingFile = null }\n                    .addOnFailureListener {\n                        loading = false\n                        storage.reference.child(storagePath).delete()\n                        file.delete()\n                        recordingFile = null\n                        showError(it.message ?: \"فشل إرسال التسجيل\")\n                    }\n            }, { error ->\n                loading = false\n                file.delete()\n                showError(error.message ?: \"فشل رفع التسجيل\")\n            })\n        }\n    }\n\n    private fun playAudio(url: String) {\n        try { mediaPlayer?.release(); mediaPlayer = MediaPlayer().apply { setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build()); setDataSource(url); setOnPreparedListener { it.start() }; setOnCompletionListener { it.release(); mediaPlayer = null }; prepareAsync() } } catch (e: Exception) { showError(e.message ?: \"تعذر تشغيل التسجيل\") }\n    }\n\n    private fun playMessageSoundIfEnabled(showNotification: Boolean = false) {\n        if (uid.isBlank()) return\n        val prefs = getSharedPreferences(\"dardasha_settings\", Context.MODE_PRIVATE)\n        if (prefs.getBoolean(\"messageSoundEnabled\", true)) {\n            try { MediaPlayer.create(this, R.raw.message_chime)?.apply { setOnCompletionListener { it.release() }; start() } } catch (_: Exception) {}\n        }\n        if (showNotification && prefs.getBoolean(\"notificationsEnabled\", true)) showLocalMessageNotification()\n    }\n\n    private fun createNotificationChannel() {\n        if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return\n        val soundUri = Uri.parse(\"android.resource://$packageName/${R.raw.message_chime}\")\n        val attrs = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build()\n        val channel = NotificationChannel(NOTIFICATION_CHANNEL_ID, \"رسائل دردشة\", NotificationManag
er.IMPORTANCE_DEFAULT).apply {\n            description = \"إشعارات الرسائل الجديدة\"\n            setSound(soundUri, attrs)\n        }\n        getSystemService(NotificationManager::class.java).createNotificationChannel(channel)\n    }\n\n    private fun showLocalMessageNotification() {\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) return\n        val notification = NotificationCompat.Builder(this, NOTIFICATION_CHANNEL_ID)\n            .setSmallIcon(R.drawable.ic_dardasha)\n            .setContentTitle(\"رسالة جديدة\")\n            .setContentText(\"لديك رسالة جديدة في دردشة\")\n            .setAutoCancel(true)\n            .setPriority(NotificationCompat.PRIORITY_DEFAULT)\n            .build()\n        try { NotificationManagerCompat.from(this).notify((System.currentTimeMillis() % Int.MAX_VALUE).toInt(), notification) } catch (_: SecurityException) {}\n    }\n\n    private fun requestNotificationPermissionIfNeeded() {\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {\n            if (getSharedPreferences(\"dardasha_settings\", Context.MODE_PRIVATE).getBoolean(\"notificationsEnabled\", true)) {\n                requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), NOTIFICATION_PERMISSION_REQUEST)\n            }\n        }\n    }\n\n    private fun deleteForMe(messageId: String) {\n        val room = currentRoom ?: return\n        db.reference.child(\"messageDeletes\").child(uid).child(room).child(messageId).setValue(true).addOnFailureListener { showError(it.message ?: \"تعذر حذف الرسالة لديك\") }\n    }\n\n    private fun deleteForEveryone(m: Msg) {\n        val room = currentRoom ?: return\n        if (m.senderId != uid) return\n        db.reference.child(\"rooms\").child(room).child(\"messages\").child(m.id).removeValue().addOnSuccessListener {\n            i
f (m.storagePath.isNotBlank()) storage.reference.child(m.storagePath).delete()\n        }.addOnFailureListener { showError(it.message ?: \"تعذر حذف الرسالة للجميع\") }\n    }\n\n    private fun blockPeer() {\n        val peer = currentPeer ?: return\n        db.reference.child(\"blocks\").child(uid).child(peer.uid).setValue(true).addOnSuccessListener { isBlocked = true; closeRoom() }\n    }\n\n    private fun stopRecordingSilently() {\n        try {\n            if (isRecording) mediaRecorder?.stop()\n        } catch (_: Exception) {\n        }\n        mediaRecorder?.release()\n        mediaRecorder = null\n        recordingFile?.delete()\n        recordingFile = null\n        isRecording = false\n    }\n\n    private fun closeRoom() {\n        stopRecordingSilently()\n        stopTyping()\n        waitingListener?.let { db.reference.child(\"waiting\").child(uid).removeEventListener(it) }; waitingListener = null\n        messagesListener?.let { currentRoomRef?.removeEventListener(it) }\n        currentRoom?.let { room -> messageDeletesListener?.let { db.reference.child(\"messageDeletes\").child(uid).child(room).removeEventListener(it) } }\n        currentPeer?.uid?.let { peerId -> typingListener?.let { db.reference.child(\"typing\").child(peerId).removeEventListener(it) } }\n        messagesListener = null; messageDeletesListener = null; typingListener = null; currentRoomRef = null; currentRoom = null; currentPeer = null; messages.clear(); deletedMessageIds.clear(); peerTyping = false; messageListenerPrimed = false; isBlocked = false; isRecording = false; screen = \"main\"; selectedTab = 1\n    }\n\n    private fun saveName(name: String) {\n        val clean = sanitizeDisplayName(name)\n        db.reference.child(\"users\").child(uid).child(\"name\").setValue(clean).addOnSuccessListener {\n            if (clean == NAME_VIOLATION_REPLACEMENT) showError(\"تم حذف الاسم للمخالفة\")\n            loadProfileOrSetup()\n        }.addOnFailureListener { showError(it.message ?: \"تعذر حفظ الاسم\") }\n    }\n\n    private 
fun uploadPendingAvatar(uri: Uri) {\n        if (uid.isBlank()) { showError(\"سجل الدخول أولًا\"); return }\n        val compressed = compressImageUri(uri)\n        if (compressed == null) { showError(\"تعذر تجهيز الصورة\"); return }\n        val storagePath = \"pendingAvatars/$uid-${UUID.randomUUID()}.jpg\"\n        val metadata = com.google.firebase.storage.StorageMetadata.Builder().setContentType(\"image/jpeg\").build()\n        loading = true\n        uploadFileAndGetUrl(storagePath, compressed, metadata, { url ->\n            db.reference.child(\"users\").child(uid).updateChildren(mapOf(\"avatarPendingUrl\" to url.toString(), \"avatarPendingStoragePath\" to storagePath, \"avatarPending\" to true))\n                .addOnSuccessListener { loading = false; compressed.delete(); loadProfileOrSetup(); showError(\"تم رفع الصورة وهي الآن بانتظار موافقة الأدمن\") }\n                .addOnFailureListener { loading = false; compressed.delete(); showError(it.message ?: \"تم رفع الصورة لكن تعذر حفظ طلب المراجعة\") }\n        }, { error ->\n            loading = false\n            compressed.delete()\n            showError(\"فشل رفع الصورة: ${error.message ?: \"تحقق من تفعيل Firebase Storage ونشر Storage Rules\"}\")\n        })\n    }\n\n    private fun approveAvatar(u: UserProfile) {\n        if (u.avatarPendingUrl.isBlank()) return\n        db.reference.child(\"users\").child(u.uid).updateChildren(mapOf(\"avatarUrl\" to u.avatarPendingUrl, \"avatarStoragePath\" to u.avatarPendingStoragePath, \"avatarPending\" to false, \"avatarPendingUrl\" to \"\", \"avatarPendingStoragePath\" to \"\"))\n            .addOnFailureListener { showError(it.message ?: \"تعذر قبول الصورة\") }\n    }\n    private fun rejectAvatar(u: UserProfile) {\n        val pendingUrl = u.avatarPendingUrl\n        val pendingPath = u.avatarPendingStoragePath\n        db.reference.child(\"users\").child(u.uid).updateChildren(mapOf(\"avatarPending\" to false, \"avatarPendingUrl\" to \"\", \"avatarPendingStoragePath\" to \"\"))\n            .addOnSuccessListe
ner {\n                if (pendingPath.isNotBlank()) storage.reference.child(pendingPath).delete() else extractStoragePath(pendingUrl)?.let { storage.reference.child(it).delete() }\n            }\n            .addOnFailureListener { showError(it.message ?: \"تعذر رفض الصورة\") }\n    }\n    private fun setVerified(targetUid: String, value: Boolean) {\n        db.reference.child(\"users\").child(targetUid).child(\"verified\").setValue(value)\n            .addOnFailureListener { showError(it.message ?: \"تعذر تغيير التوثيق\") }\n    }\n    private fun setBanned(targetUid: String, value: Boolean) {\n        db.reference.child(\"users\").child(targetUid).child(\"banned\").setValue(value)\n            .addOnSuccessListener { if (value) db.reference.child(\"users\").child(targetUid).child(\"online\").setValue(false) }\n            .addOnFailureListener { showError(it.message ?: \"تعذر تغيير الحظر\") }\n    }\n\n    private fun extractStoragePath(downloadUrl: String): String? {\n        return try {\n            val uri = Uri.parse(downloadUrl)\n            val encoded = uri.path?.substringAfter(\"/o/\") ?: return null\n            java.net.URLDecoder.decode(encoded, \"UTF-8\")\n        } catch (_: Exception) {\n            null\n        }\n    }\n    private fun deleteUserData(u: UserProfile) {\n        if (u.uid == uid || u.admin) return\n        db.reference.child(\"users\").child(u.uid).removeValue()\n        db.reference.child(\"userChats\").child(u.uid).removeValue()\n        db.reference.child(\"blocks\").child(u.uid).removeValue()\n    }\n\n    private fun logout() {\n        setPresence(false); cleanup(); auth.signOut(); uid = \"\"; profile = null; screen = \"login\"; selectedTab = 0\n    }\n\n    private fun parseUser(s: DataSnapshot): UserProfile? {\n        if (!s.exists()) return null\n        return UserProfile(\n            uid = s.key ?: s.child(\"uid\").getValue(String::class.java).orEmpty(),\n            name = s.child(\"name\").getValue(String::class.java).orEmpty(),\n            email = s.child(\"ema
il\").getValue(String::class.java).orEmpty(),\n            gender = s.child(\"gender\").getValue(String::class.java).orEmpty(),\n            avatarUrl = s.child(\"avatarUrl\").getValue(String::class.java).orEmpty(),\n            avatarPendingUrl = s.child(\"avatarPendingUrl\").getValue(String::class.java).orEmpty(),\n            avatarPending = s.child(\"avatarPending\").getValue(Boolean::class.java) ?: false,\n            avatarStoragePath = s.child(\"avatarStoragePath\").getValue(String::class.java).orEmpty(),\n            avatarPendingStoragePath = s.child(\"avatarPendingStoragePath\").getValue(String::class.java).orEmpty(),\n            verified = s.child(\"verified\").getValue(Boolean::class.java) ?: false,\n            admin = (s.key == OWNER_UID),\n            banned = s.child(\"banned\").getValue(Boolean::class.java) ?: false,\n            online = s.child(\"online\").getValue(Boolean::class.java) ?: false,\n            joinedAt = s.child(\"joinedAt\").getValue(Long::class.java) ?: 0L,\n            lastSeen = s.child(\"lastSeen\").getValue(Long::class.java) ?: 0L,\n            manualOffline = s.child(\"manualOffline\").getValue(Boolean::class.java) ?: false\n        )\n    }\n\n    private fun cleanup() {\n        usersListener?.let { db.reference.child(\"users\").removeEventListener(it) }\n        chatsListener?.let { db.reference.child(\"userChats\").child(uid).removeEventListener(it) }\n        stopTyping()\n        messagesListener?.let { currentRoomRef?.removeEventListener(it) }\n        currentRoom?.let { room -> messageDeletesListener?.let { db.reference.child(\"messageDeletes\").child(uid).child(room).removeEventListener(it) } }\n        currentPeer?.uid?.let { peerId -> typingListener?.let { db.reference.child(\"typing\").child(peerId).removeEventListener(it) } }\n        waitingListener?.let { db.reference.child(\"waiting\").child(uid).removeEventListener(it) }\n        usersListener = null; chatsListener = null; messagesListener = null; messageDeletesListener = null; typingListener = null; curr
entRoomRef = null; waitingListener = null\n        onlineUsers.clear(); chats.clear(); messages.clear(); deletedMessageIds.clear(); unreadInitialized = false; lastUnreadTotal = 0\n    }\n\n    private fun showError(msg: String) { errorText = msg; Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }\n\n    private fun peerStatusText(peer: UserProfile?): String {\n        if (peer == null) return \"\"\n        if (peer.online && !peer.manualOffline) return \"متصل الآن\"\n        if (peer.manualOffline || peer.lastSeen <= 0L) return \"غير متصل\"\n        return \"آخر ظهور ${formatDateTime(peer.lastSeen)}\"\n    }\n\n    private fun formatDateTime(ts: Long): String {\n        if (ts <= 0) return \"\"\n        val d = java.text.SimpleDateFormat(\"dd/MM HH:mm\", Locale.getDefault())\n        return d.format(java.util.Date(ts))\n    }\n\n    private fun formatTime(ts: Long): String { if (ts <= 0) return \"\"; val d = java.text.SimpleDateFormat(\"HH:mm\", java.util.Locale.getDefault()); return d.format(java.util.Date(ts)) }\n}\n\n@Composable\nprivate fun DardashaTheme(content: @Composable () -> Unit) {\n    val scheme = darkColorScheme(primary = Pink, secondary = Purple, tertiary = Blue, background = Bg, surface = Panel, onBackground = TextMain, onSurface = TextMain)\n    MaterialTheme(colorScheme = scheme, typography = Typography(), content = content)\n}\n";
document.getElementById('code').value = code;
async function copyCode(){
  const t=document.getElementById('code');
  t.select(); t.setSelectionRange(0,t.value.length);
  try{
    await navigator.clipboard.writeText(t.value);
    alert('تم نسخ الكود كاملًا');
  }catch(e){
    document.execCommand('copy');
    alert('تم النسخ');
  }
}
</script>
