            Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("لا يوجد مستخدمون نشطون الآن") }
        } else {
            LazyColumn(Modifier.fillMaxSize().padding(12.dp)) {
                if (admin != null) {
                    item(key = "fixed-admin") {
                        Card(Modifier.fillMaxWidth().padding(bottom = 8.dp)) {
                            Row(Modifier.fillMaxWidth().padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                                Avatar(admin.name, true, admin.avatarUrl.takeIf { it.isNotBlank() }, Modifier.size(50.dp))
                                Spacer(Modifier.width(12.dp))
                                Column(Modifier.weight(1f)) {
                                    Text("Admin", style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.primary)
                                    Text(admin.name, style = MaterialTheme.typography.titleMedium)
                                }
                                Text("●", color = MaterialTheme.colorScheme.primary)
                            }
                        }
                    }
                }
                items(others, key = { it.uid }) { u ->
                    Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                                      Row(Modifier.fillMaxWidth().padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                            Avatar(u.name, u.verified, u.avatarUrl.takeIf { it.isNotBlank() }, Modifier.size(50.dp))
                            Spacer(Modifier.width(12.dp))
                            Column(Modifier.weight(1f)) {
                                Row(verticalAlignment = Alignment.CenterVertically) {
                                    Text(u.name, style = MaterialTheme.typography.titleMedium)
                                    if (u.verified) Text(" ✓", color = MaterialTheme.colorScheme.primary)
                                }
                                Text(if (u.admin) "الأدمن" else if (u.gender == "female") "بنت" else "ولد")
                            }
                            Text("●", color = MaterialTheme.colorScheme.primary)
                        }
                    }
                }
            }
