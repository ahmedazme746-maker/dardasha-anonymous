name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Dardasha project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/dardasha

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "ERROR: No Dardasha ZIP file found."
            exit 1
          fi

          echo "Using ZIP: ${ZIP_FILE}"

          unzip -q "${ZIP_FILE}" -d /tmp/dardasha

          PROJECT_DIR="$(find /tmp/dardasha -name settings.gradle.kts -type f -print -quit | xargs -r dirname)"

          if [ -z "${PROJECT_DIR}" ]; then
            echo "ERROR: settings.gradle.kts was not found after extraction."
            find /tmp/dardasha -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Project directory: ${PROJECT_DIR}"

          rm -rf ./project
          cp -R "${PROJECT_DIR}" ./project

          echo "Project files:"
          find ./project -maxdepth 3 -type f | sort

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/com/dardasha/anonymous/MainActivity.kt

          echo "Project structure OK."

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK successfully built:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
