name: Build Dardasha APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          set -e
          ZIP=$(find . -type f -iname "*dardasha*.zip" -not -path "./.git/*" | head -1)
          test -n "$ZIP"

          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/project"

          PROJECT=$(find "$RUNNER_TEMP/project" \
            -name settings.gradle.kts \
            -o -name settings.gradle | head -1)

          test -n "$PROJECT"

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Fix dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          FILE="app/build.gradle.kts"

          sed -i -E \
            's/(androidx\.core:core-ktx:)[0-9.]+/\11.18.0/g' \
            "$FILE"

          sed -i -E \
            's/(androidx\.core:core:)[0-9.]+/\11.18.0/g' \
            "$FILE"

          cat >> "$FILE" <<'EOF'

          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  if (requested.group == "androidx.core" &&
                      (requested.name == "core" || requested.name == "core-ktx")) {
                      useVersion("1.18.0")
                  }
              }
          }
          EOF

          echo "compileSdk:"
          grep "compileSdk" "$FILE" || true

          echo "Core:"
          grep "androidx.core" "$FILE" || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            clean \
            :app:assembleDebug \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show APK
        if: success()
        run: |
          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
