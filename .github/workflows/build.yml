    @Composable
    private fun ErrorText() {
        errorText?.let { Text(it, color = MaterialTheme.colorScheme.error, modifier = Modifier.padding(12.dp), textAlign = TextAlign.Center) }
    }

    private fun loadProfileOrSetup() {
        if (uid.isBlank()) return
        db.reference.child("users").child(uid).get().addOnSuccessListener { s ->
            val u = parseUser(s)
            profile = u
            if (u == null || u.name.isBlank() || u.gender.isBlank()) {
                screen = "setup"
            } else {
                screen = "main"
                startListeners()
                setPresence(true)
            }
        }.addOnFailureListener { e -> errorText = e.message ?: "تعذر تحميل الحساب" }
    }

    private fun createGuestProfile(name: String, gender: String) {
        if (uid.isBlank()) {
            auth.signInAnonymously().addOnSuccessListener { r ->
                uid = r.user!!.uid
                saveProfile(name.trim(), "", gender, anonymous = true)
            }
        } else saveProfile(name.trim(), "", gender, anonymous = true)
    }

    private fun register(name: String, email: String, password: String, gender: String) {
        loading = true; errorText = null
        val current = auth.currentUser
        val credential = EmailAuthProvider.getCredential(email.trim(), password)
        val task = if (current?.isAnonymous == true) current.linkWithCredential(credential)
        else auth.createUserWithEmailAndPassword(email.trim(), password)
        task.addOnSuccessListener { r ->
            uid = r.user?.uid ?: uid
            saveProfile(name.trim(), email.trim(), gender, anonymous = false)
        }.addOnFailureListener { e -> loading = false; errorText = e.message ?: "تعذر إنشاء الحساب" }
    }

    private fun login(email: String, password: String) {
        loading = true; errorText = null
        auth.signInWithEmailAndPassword(email.trim(), password)
            .addOnSuccessListener { r -> uid = r.user!!.uid; loadProfileOrSetup() }
            .addOnFailureListener { e -> loading = false; errorText = e.message ?: "تعذر تسجيل الدخول" }
    }

    private fun saveProfile(name: String, email: String, gender: String, anonymous: Boolean) {
        val ref = db.reference.child("users").child(uid)
        ref.get().addOnSuccessListener { existing ->
            val old = parseUser(existing)
            val data = mutableMapOf<String, Any>(
                "uid" to uid,
                "name" to name,
                "email" to email,
                "gender" to (old?.gender?.takeIf { it.isNotBlank() } ?: gender),
                "verified" to (old?.verified ?: false),
                "admin" to (old?.admin ?: false),
                "online" to true,
                "joinedAt" to (old?.joinedAt ?: ServerValue.TIMESTAMP)
            )
            ref.updateChildren(data).addOnSuccessListener {
                if (old?.admin != true) maybeClaimFirstAdmin()
                setPresence(true)
                loading = false
                loadProfileOrSetup()
            }.addOnFailureListener { e -> loading = false; errorText = e.message ?: "تعذر حفظ البيانات" }
        }
    }

    private fun maybeClaimFirstAdmin() {
        val meta = db.getReference("meta").child("adminUid")
        meta.runTransaction(object : Transaction.Handler {
            override fun doTransaction(d: MutableData): Transaction.Result {
                if (d.value == null) d.value = uid
                return Transaction.success(d)
            }
            override fun onComplete(e: DatabaseError?, committed: Boolean, s: DataSnapshot?) {
                if (s?.getValue(String::class.java) == uid) {
                    db.reference.child("users").child(uid).child("admin").setValue(true)
                }
            }
        })
    }

    private fun setPresence(isOnline: Boolean) {
        if (uid.isBlank()) return
        val ref = db.reference.child("users").child(uid)
        if (isOnline) {
            ref.child("online").setValue(true)
            ref.child("joinedAt").setValue(ServerValue.TIMESTAMP)
            ref.child("online").onDisconnect().setValue(false)
        } else ref.child("online").setValue(false)
    }

    private fun startListeners() {
        usersListener?.let { db.reference.child("users").removeEventListener(it) }
        usersListener = object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) {
                onlineUsers.clear()
                s.children.mapNotNull { parseUser(it) }.filter { it.online }.forEach { onlineUsers.add(it) }
                val me = s.child(uid).let { parseUser(it) }
                if (me != null) profile = me
            }
            override fun onCancelled(e: DatabaseError) {}
        }
        db.reference.child("users").addValueEventListener(usersListener!!)

        chatsListener?.let { db.reference.child("userChats").child(uid).removeEventListener(it) }
        chatsListener = object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) {
                chats.clear()
                s.children.mapNotNull { snap ->
                    ChatPreview(
                        roomId = snap.key ?: return@mapNotNull null,
                        peerId = snap.child("peerId").getValue(String::class.java).orEmpty(),
                        peerName = snap.child("peerName").getValue(String::class.java).orEmpty(),
                        peerVerified = snap.child("peerVerified").getValue(Boolean::class.java) ?: false,
                        lastMessage = snap.child("lastMessage").getValue(String::class.java).orEmpty(),
                        updatedAt = snap.child("updatedAt").getValue(Long::class.java) ?: 0L
                    )
                }.forEach { chats.add(it) }
            }
            override fun onCancelled(e: DatabaseError) {}
        }
        db.reference.child("userChats").child(uid).addValueEventListener(chatsListener!!)
    }

    private fun startMatching() {
        if (uid.isBlank()) return
        loading = true; errorText = null
        val root = db.reference.child("waiting")
        val me = root.child(uid)
              me.onDisconnect().removeValue()
        root.runTransaction(object : Transaction.Handler {
            override fun doTransaction(d: MutableData): Transaction.Result {
                var peer: String? = null
                for (c in d.children) {
                    if (c.key != uid && c.child("roomId").value == null) { peer = c.key; break }
                }
                if (peer == null) d.child(uid).value = mapOf("createdAt" to ServerValue.TIMESTAMP)
                else {
                    val p = peer!!
                    val roomId = listOf(uid, p).sorted().joinToString("-")
                    d.child(uid).value = mapOf("createdAt" to ServerValue.TIMESTAMP, "roomId" to roomId, "peerId" to p)
                    d.child(p).child("roomId").value = roomId
                    d.child(p).child("peerId").value = uid
                }
                return Transaction.success(d)
            }
            override fun onComplete(e: DatabaseError?, committed: Boolean, s: DataSnapshot?) {
                if (e != null || !committed) { loading = false; errorText = e?.message ?: "تعذر البحث"; return@onComplete }
                val r = s?.child(uid)?.child("roomId")?.getValue(String::class.java)
                if (!r.isNullOrBlank()) openRoom(r, s.child(uid).child("peerId").getValue(String::class.java).orEmpty())
                else waitForMatch()
            }
        })
    }

    private fun waitForMatch() {
        val ref = db.reference.child("waiting").child(uid)
        ref.addListenerForSingleValueEvent(object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) {
                val r = s.child("roomId").getValue(String::class.java)
                if (!r.isNullOrBlank()) {
                    ref.removeValue()
                    openRoom(r, s.child("peerId").getValue(String::class.java).orEmpty())
                } else {
                    ref.addValueEventListener(object : ValueEventListener {
                        override fun onDataChange(x: DataSnapshot) {
                            val room = x.child("roomId").getValue(String::class.java)
                            if (!room.isNullOrBlank()) { ref.removeValue(); openRoom(room, x.child("peerId").getValue(String::class.java).orEmpty()) }
                        }
                        override fun onCancelled(e: DatabaseError) {}
                    })
                }
            }
            override fun onCancelled(e: DatabaseError) { loading = false; errorText = e.message }
        })
    }

    private fun openRoom(roomId: String, peerId: String) {
        db.reference.child("waiting").child(uid).removeValue()
        currentRoomRef?.let { messagesListener?.let(it::removeEventListener) }
        currentRoom = roomId
        messages.clear()
        loading = false
        screen = "chat"
        db.reference.child("users").child(peerId).get().addOnSuccessListener { currentPeer = parseUser(it) }

        val ref = db.reference.child("rooms").child(roomId).child("messages")
        currentRoomRef = ref
        messagesListener = object : ChildEventListener {
            override fun onChildAdded(s: DataSnapshot, p: String?) {
                val m = Msg(s.key ?: return, s.child("senderId").getValue(String::class.java).orEmpty(), s.child("text").getValue(String::class.java).orEmpty(), s.child("timestamp").getValue(Long::class.java) ?: 0L)
                if (m.text.isNotBlank() && messages.none { it.id == m.id }) messages.add(m)
                messages.sortBy { it.timestamp }
            }
            override fun onChildChanged(s: DataSnapshot, p: String?) {}
            override fun onChildRemoved(s: DataSnapshot) { messages.removeAll { it.id == s.key } }
            override fun onChildMoved(s: DataSnapshot, p: String?) {}
            override fun onCancelled(e: DatabaseError) { errorText = e.message }
        }
        ref.addChildEventListener(messagesListener!!)
        db.reference.child("rooms").child(roomId).child("members").updateChildren(mapOf(uid to true, peerId to true))
    }

    private fun sendMessage(text: String) {
        val room = currentRoom ?: return
        val peer = currentPeer ?: return
        val ref = db.reference.child("rooms").child(room).child("messages").push()
        val data = mapOf<String, Any>("senderId" to uid, "text" to text.take(MAX_MESSAGE_LENGTH), "timestamp" to ServerValue.TIMESTAMP)
        ref.setValue(data).addOnSuccessListener {
            val now = System.currentTimeMillis()
            val mine = mapOf("peerId" to peer.uid, "peerName" to peer.name, "peerVerified" to peer.verified, "lastMessage" to text, "updatedAt" to now)
            val theirs = mapOf("peerId" to uid, "peerName" to (profile?.name ?: "مستخدم"), "peerVerified" to (profile?.verified ?: false), "lastMessage" to text, "updatedAt" to now)
            db.reference.child("userChats").child(uid).child(room).setValue(mine)
            db.reference.child("userChats").child(peer.uid).child(room).setValue(theirs)
        }.addOnFailureListener { errorText = it.message }
    }

    private fun closeRoom() {
        messagesListener?.let { currentRoomRef?.removeEventListener(it) }
        messagesListener = null; currentRoomRef = null; currentRoom = null; currentPeer = null; messages.clear()
        screen = "main"; selectedTab = 1
    }

    private fun saveName(name: String) {
        db.reference.child("users").child(uid).child("name").setValue(name.trim()).addOnSuccessListener { loadProfileOrSetup() }
    }

    private fun uploadPendingAvatar(uri: Uri) {
        val ref = storage.reference.child("pendingAvatars/$uid-${UUID.randomUUID()}.jpg")
        loading = true
        ref.putFile(uri).continueWithTask { ref.downloadUrl }.addOnSuccessListener { url ->
            db.reference.child("users").child(uid).updateChildren(mapOf("avatarPendingUrl" to url.toString(), "avatarPending" to true))
                .addOnSuccessListener { loading = false; loadProfileOrSetup() }
        }.addOnFailureListener { loading = false; errorText = it.message ?: "تعذر رفع الصورة" }
    }

    private fun setVerified(targetUid: String, value: Boolean) {
        db.reference.child("users").child(targetUid).child("verified").setValue(value)
    }

    private fun approveAvatar(u: UserProfile) {
        db.reference.child("users").child(u.uid).updateChildren(
            mapOf("avatarUrl" to u.avatarPendingUrl, "avatarPending" to false, "avatarPendingUrl" to "")
        )
    }

    private fun parseUser(s: DataSnapshot): UserProfile? {
        if (!s.exists()) return null
        return UserProfile(
            uid = s.key ?: s.child("uid").getValue(String::class.java).orEmpty(),
            name = s.child("name").getValue(String::class.java).orEmpty(),
            email = s.child("email").getValue(String::class.java).orEmpty(),
            gender = s.child("gender").getValue(String::class.java).orEmpty(),
            avatarUrl = s.child("avatarUrl").getValue(String::class.java).orEmpty(),
            avatarPendingUrl = s.child("avatarPendingUrl").getValue(String::class.java).orEmpty(),
            avatarPending = s.child("avatarPending").getValue(Boolean::class.java) ?: false,
            verified = s.child("verified").getValue(Boolean::class.java) ?: false,
            admin = s.child("admin").getValue(Boolean::class.java) ?: false,
            online = s.child("online").getValue(Boolean::class.java) ?: false,
            joinedAt = s.child("joinedAt").getValue(Long::class.java) ?: 0L
        )
    }

    private fun cleanup() {
        usersListener?.let { db.reference.child("users").removeEventListener(it) }
        chatsListener?.let { db.reference.child("userChats").child(uid).removeEventListener(it) }
        messagesListener?.let { currentRoomRef?.removeEventListener(it) }
        usersListener = null; chatsListener = null; messagesListener = null; currentRoomRef = null
        onlineUsers.clear(); chats.clear(); messages.clear()
    }

    private fun showError(msg: String) { errorText = msg; Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }
}
