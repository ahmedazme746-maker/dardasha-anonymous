name: Build Dardasha Anonymous Chat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select chat ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip" ]; then
            ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip"
          elif [ -f "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip" ]; then
            ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip"
          else
            echo "::error::Chat project ZIP not found in repository root."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" -printf '%f\n' | sort || true
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"
          unzip -t "$ZIP" >/dev/null

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          SETTINGS="$(find "$GITHUB_WORKSPACE/project" -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path "*/.gradle/*" | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Compose compatibility
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/app/build.gradle.kts"
          ROOT="$PROJECT_DIR/build.gradle.kts"

          test -f "$APP"
          test -f "$ROOT"

          # Compose 1.12.x requires newer Android API levels.
          # Keep this project on compileSdk 36 and use Compose 1.11.4.
          sed -i 's/compose-bom:2026\.09\.00/compose-bom:2026.07.00/g' "$APP"

          # AGP 8.13.2 supports Kotlin 2.3.
          sed -i 's/com\.android\.application" version "8\.13\.0"/com.android.application" version "8.13.2"/' "$ROOT"

          echo "Compose:"
          grep 'compose-bom:' "$APP" || true

          echo "Plugins:"
          grep -E 'com.android.application|org.jetbrains.kotlin.android|org.jetbrains.kotlin.plugin.compose' "$ROOT" || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Build completed without an APK."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
