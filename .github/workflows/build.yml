                    items(messages.filter { it.id !in deletedMessageIds && (it.type != "image" || it.expiresAt == 0L || it.expiresAt > now) }, key = { it.id }) { m -> MessageBubble(m) }
                }
                Row(Modifier.fillMaxWidth().background(Color(0xFF0A091B)).padding(8.dp).navigationBarsPadding(), verticalAlignment = Alignment.CenterVertically) {
                    IconButton({ imageLauncher.launch(arrayOf("image/*")) }, enabled = !isBlocked && !loading) { Icon(Icons.Default.CameraAlt, "صورة", tint = Pink) }
                    IconButton({ if (isRecording) stopRecordingAndSend() else micLauncher.launch(Manifest.permission.RECORD_AUDIO) }, enabled = !isBlocked && !loading) { Icon(if (isRecording) Icons.Default.Stop else Icons.Default.Mic, "صوت", tint = if (isRecording) Red else Blue) }
