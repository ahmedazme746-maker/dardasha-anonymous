name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Find CHAT project ZIP
      # --------------------------------------------------
      - name: Find and extract chat project
        shell: bash
        run: |
          set -e

          echo "Searching for chat project ZIP..."

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "dardasha-anonymous-chat-project.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: dardasha-anonymous-chat-project.zip was not found."
            echo ""
            echo "ZIP files found in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -print
            exit 1
          fi

          echo "Using CHAT project:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Chat project extracted successfully."


      # --------------------------------------------------
      # 4. Locate Android project
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android settings file was not found."

            echo ""
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 5 \
              -type f \
              | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 5. Check MainActivity
      # --------------------------------------------------
      - name: Check MainActivity
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt was not found."
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN_FILE"

          echo ""
          echo "First 30 lines:"
          head -30 "$MAIN_FILE"


      # --------------------------------------------------
      # 6. Fix Material3 experimental API
      # --------------------------------------------------
      - name: Fix Material3 experimental API
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if ! grep -q \
            "androidx.compose.material3.ExperimentalMaterial3Api" \
            "$MAIN_FILE"; then

            sed -i \
              '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' \
              "$MAIN_FILE"

            echo "Material3 opt-in added."

          else

            echo "Material3 opt-in already exists."

          fi


      # --------------------------------------------------
      # 7. Fix old Kotlin jvmTarget syntax
      # --------------------------------------------------
      - name: Fix Kotlin JVM target
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            exit 1
          fi

          echo "Checking Kotlin JVM configuration..."

          if grep -q 'jvmTarget *= *"17"' "$APP_GRADLE"; then

            echo "Old jvmTarget syntax detected."

            sed -i \
              '/^[[:space:]]*kotlinOptions[[:space:]]*{/,/^[[:space:]]*}/d' \
              "$APP_GRADLE"

          fi

          if ! grep -q \
            'JvmTarget.fromTarget("17")' \
            "$APP_GRADLE"; then

            if ! grep -q \
              'import org.jetbrains.kotlin.gradle.dsl.JvmTarget' \
              "$APP_GRADLE"; then

              sed -i \
                '1iimport org.jetbrains.kotlin.gradle.dsl.JvmTarget' \
                "$APP_GRADLE"

            fi

            cat >> "$APP_GRADLE" <<'EOF'

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget("17")
    }
}
EOF

          fi

          echo "Kotlin JVM target prepared."


      # --------------------------------------------------
      # 8. Create Gradle compatibility init script
      # --------------------------------------------------
      - name: Prepare Gradle compatibility
        shell: bash
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/force-versions.gradle" <<'EOF'
pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "org.jetbrains.kotlin.android") {
                useModule(
                    "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
                )
            }

            if (requested.id.id == "org.jetbrains.kotlin.jvm") {
                useModule(
                    "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
                )
            }

            if (requested.id.id == "com.android.application") {
                useModule(
                    "com.android.tools.build:gradle:8.13.0"
                )
            }

            if (requested.id.id == "com.android.library") {
                useModule(
                    "com.android.tools.build:gradle:8.13.0"
                )
            }
        }
    }
}
EOF

          echo "Gradle compatibility configuration created."


      # --------------------------------------------------
      # 9. Setup Gradle 8.13
      # --------------------------------------------------
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'


      # --------------------------------------------------
      # 10. Clean project
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            clean \
            --stacktrace


      # --------------------------------------------------
      # 11. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Building Dardasha Anonymous CHAT APK"
          echo "=========================================="

          gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace \
            --info


      # --------------------------------------------------
      # 12. Locate APK
      # --------------------------------------------------
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/debug/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching all APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/dardasha-anonymous-chat-debug.apk"


      # --------------------------------------------------
      # 13. Upload APK
      # --------------------------------------------------
      - name: Upload CHAT APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-chat-debug
          path: dardasha-anonymous-chat-debug.apk
