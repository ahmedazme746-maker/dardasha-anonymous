name: Build Dardasha APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. Find Dardasha ZIP
      # ==========================================
      - name: Find Dardasha ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Dardasha ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*dardasha*.zip" \
            -not -path "*/.git/*" \
            -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Dardasha ZIP was not found."
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              | sort
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP integrity: OK"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 4. Extract Android project
      # ==========================================
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$RUNNER_TEMP/dardasha-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          echo "Searching for Android project..."

          SETTINGS_FILE=$(find "$PROJECT_ROOT" \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            -not -path "*/.gradle/*" \
            -print -quit || true)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found."

            find "$PROJECT_ROOT" \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "$PROJECT_DIR"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Found app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Found app/build.gradle"
          else
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 5. Fix Compose dependencies
      # ==========================================
      - name: Normalize Compose dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          FILE="app/build.gradle.kts"

          echo "=========================================="
          echo "NORMALIZING COMPOSE"
          echo "=========================================="

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          sed -i \
            -E 's/(androidx\.compose:compose-bom:)[0-9]+\.[0-9]+\.[0-9]+/\12026.06.01/g' \
            "$FILE"

          sed -i \
            -E 's/(androidx\.compose\.(animation|foundation|runtime|ui)([^:]*):[^:]+:)[0-9]+\.[0-9]+\.[0-9]+/\11.11.4/g' \
            "$FILE"

          sed -i \
            -E 's/(androidx\.compose\.animation:animation-core:)[0-9]+\.[0-9]+\.[0-9]+/\11.11.4/g' \
            "$FILE"

          echo "Compose configuration:"
          grep -nE \
            'compose-bom|compose\.animation|compose\.foundation|compose\.runtime|compose\.ui|material3' \
            "$FILE" || true

          echo "Compose normalization: OK"

      # ==========================================
      # 6. Force AndroidX Core compatible version
      # ==========================================
      - name: Fix AndroidX Core compatibility
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          FILE="app/build.gradle.kts"

          echo "=========================================="
          echo "FIXING ANDROIDX CORE"
          echo "=========================================="

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          # Fix explicit dependencies if present.
          sed -i \
            -E 's/(androidx\.core:core-ktx:)[0-9]+\.[0-9]+\.[0-9]+/\11.18.0/g' \
            "$FILE"

          sed -i \
            -E 's/(androidx\.core:core:)[0-9]+\.[0-9]+\.[0-9]+/\11.18.0/g' \
            "$FILE"

          # Force transitive AndroidX Core dependencies too.
          cat >> "$FILE" <<'EOF'

          // CI compatibility fix:
          // AGP 8.13 + compileSdk 36 cannot use AndroidX Core 1.19.x.
          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  if (requested.group == "androidx.core" &&
                      (requested.name == "core" || requested.name == "core-ktx")) {
                      useVersion("1.18.0")
                  }
              }
          }
          EOF

          echo ""
          echo "AndroidX Core configuration:"
          grep -nE \
            'androidx\.core|resolutionStrategy|1\.18\.0' \
            "$FILE" || true

          echo ""
          echo "AndroidX Core fix: OK"

      # ==========================================
      # 7. Verify project configuration
      # ==========================================
      - name: Verify Android configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PROJECT CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "compileSdk:"
          grep -n "compileSdk" app/build.gradle.kts || true

          echo ""
          echo "Core:"
          grep -nE \
            'androidx\.core|1\.18\.0' \
            app/build.gradle.kts || true

          echo ""
          echo "Compose:"
          grep -n "compose" app/build.gradle.kts || true

          echo ""
          echo "AGP:"
          grep -R \
            -n \
            'com.android.application.*8\.13' \
            . \
            --include="*.gradle.kts" \
            || true

      # ==========================================
      # 8. Setup Gradle 8.13
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ==========================================
      # 9. Test Gradle configuration
      # ==========================================
      - name: Test Gradle configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            tasks \
            --console=plain

      # ==========================================
      # 10. Check resolved Core dependency
      # ==========================================
      - name: Verify resolved AndroidX Core
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECKING RESOLVED ANDROIDX CORE"
          echo "=========================================="

          gradle \
            --no-daemon \
            :app:dependencyInsight \
            --dependency androidx.core:core \
            --configuration debugCompileClasspath \
            --console=plain

      # ==========================================
      # 11. Build APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING DARDASHA APK"
          echo "=========================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug \
            --console=plain

      # ==========================================
      # 12. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build outputs:"
            find "$PROJECT_DIR/app/build/outputs" \
              -maxdepth 10 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "=========================================="
          echo "APK FOUND"
          echo "$APK"
          echo "=========================================="

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      # ==========================================
      # 13. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
