name: Build Dardasha Anonymous Chat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

          echo "Android API 37 installed."

      - name: Check chat project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: dardasha-anonymous-chat-project.zip was not found."

            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print

            exit 1
          fi

          echo "Chat ZIP found:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE" > /dev/null

          echo "ZIP integrity: OK"

      - name: Extract chat project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q \
            "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Project extracted."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project was not found."

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 8 \
              -type f \
              -print | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -d "$PROJECT_DIR/app"

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_FILE"

      - name: Set compile SDK 37
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "Updating compileSdk to 37..."

          sed -i -E \
            's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 37/g' \
            "$APP_GRADLE"

          sed -i -E \
            's/compileSdk[[:space:]]+[0-9]+/compileSdk 37/g' \
            "$APP_GRADLE"

          echo "compileSdk configuration:"
          grep -n "compileSdk" "$APP_GRADLE" || true

      - name: Fix Material3 opt-in
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if ! grep -q \
            "ExperimentalMaterial3Api" \
            "$MAIN_FILE"; then

            sed -i \
              '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' \
              "$MAIN_FILE"

            echo "Material3 opt-in added."
          else
            echo "Material3 opt-in already present."
          fi

      - name: Update Android Gradle Plugin
        shell: bash
        run: |
          set -e

          echo "Updating Android Gradle Plugin to 9.1.1..."

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            sed -i -E \
              's/com\.android\.application["'\'']?[[:space:]]+version[[:space:]]+["'\''][0-9.]+["'\'']/com.android.application version "9.1.1"/g' \
              "$FILE"

            sed -i -E \
              's/id[[:space:]]*\(["'\'']com\.android\.application["'\'']\)[[:space:]]*version[[:space:]]*["'\''][0-9.]+["'\'']/id("com.android.application") version "9.1.1"/g' \
              "$FILE"

          done

          echo "AGP update step completed."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify build tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="
          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK 37"
          echo "=========================================="

          sdkmanager --list_installed | grep \
            -E "platforms;android-37|build-tools;37" \
            || true

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            clean \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "=========================================="
          echo "BUILDING DARDASHA ANONYMOUS CHAT"
          echo "=========================================="

          gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/debug/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "=========================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=========================================="

          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/dardasha-anonymous-chat-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-chat-debug
          path: dardasha-anonymous-chat-debug.apk
