name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract CHAT project
        shell: bash
        run: |
          set -e

          echo "Searching for chat project..."

          ZIP_FILE="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Chat project ZIP was not found:"
            echo "$ZIP_FILE"
            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project was not found."

            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 \
              -type f \
              | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check MainActivity
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt was not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_FILE"

      - name: Fix Material3
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if ! grep -q \
            "androidx.compose.material3.ExperimentalMaterial3Api" \
            "$MAIN_FILE"; then

            sed -i \
              '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' \
              "$MAIN_FILE"

            echo "Material3 opt-in added."

          else

            echo "Material3 opt-in already exists."

          fi

      - name: Fix Kotlin JVM target
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            exit 1
          fi

          echo "Checking Kotlin JVM configuration..."

          if grep -q 'jvmTarget *= *"17"' "$APP_GRADLE"; then

            echo "Old kotlinOptions detected."

            sed -i \
              '/^[[:space:]]*kotlinOptions[[:space:]]*{/,/^[[:space:]]*}/d' \
              "$APP_GRADLE"

          fi

          if ! grep -q 'JvmTarget.fromTarget("17")' "$APP_GRADLE"; then

            if ! grep -q \
              'import org.jetbrains.kotlin.gradle.dsl.JvmTarget' \
              "$APP_GRADLE"; then

              sed -i \
                '1iimport org.jetbrains.kotlin.gradle.dsl.JvmTarget' \
                "$APP_GRADLE"

            fi

            cat >> "$APP_GRADLE" <<'EOF'

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget("17")
    }
}
EOF

          fi

          echo "Kotlin JVM target prepared."

      - name: Create Gradle compatibility script
        shell: bash
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/force-versions.gradle" <<'EOF'
settingsEvaluated { settings ->

    settings.pluginManagement {

        resolutionStrategy {

            eachPlugin {

                if (requested.id.id == "org.jetbrains.kotlin.android") {
                    useModule(
                        "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
                    )
                }

                if (requested.id.id == "org.jetbrains.kotlin.jvm") {
                    useModule(
                        "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
                    )
                }

                if (requested.id.id == "com.android.application") {
                    useModule(
                        "com.android.tools.build:gradle:8.13.0"
                    )
                }

                if (requested.id.id == "com.android.library") {
                    useModule(
                        "com.android.tools.build:gradle:8.13.0"
                    )
                }
            }
        }
    }
}
EOF

          echo "Compatibility script created."

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --init-script "$GITHUB_WORKSPACE/force-versions.gradle" \
            clean \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING DARDASHA ANONYMOUS CHAT"
          echo "=========================================="

          gradle \
            --no-daemon \
            --init-script "$GITHUB_WORKSPACE/force-versions.gradle" \
            assembleDebug \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/debug/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            echo "Searching for APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK generated:"
          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/dardasha-anonymous-chat-debug.apk"

      - name: Upload CHAT APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-chat-debug
          path: dardasha-anonymous-chat-debug.apk
