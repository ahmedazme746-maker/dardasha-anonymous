name: Build Dardasha Anonymous Chat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check chat project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip"

          echo "=========================================="
          echo "CHECKING CHAT PROJECT"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Chat project ZIP was not found."
            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -print
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE" > /dev/null

          echo "ZIP integrity check: OK"

      - name: Extract chat project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q \
            "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Chat project extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project was not found inside ZIP."
            echo ""
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 7 \
              -type f \
              -print | head -250
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory was not found."
            exit 1
          fi

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt was not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_FILE"

      - name: Fix Material3 API
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if ! grep -q \
            "androidx.compose.material3.ExperimentalMaterial3Api" \
            "$MAIN_FILE"; then

            sed -i \
              '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' \
              "$MAIN_FILE"

            echo "Material3 opt-in added."
          else
            echo "Material3 opt-in already exists."
          fi

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle version
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Cleaning project..."

          gradle \
            --no-daemon \
            clean \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "=========================================="
          echo "BUILDING DARDASHA ANONYMOUS CHAT"
          echo "=========================================="
          echo ""

          gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace

      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/debug/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching for APK files:"

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "=========================================="
          echo "APK GENERATED SUCCESSFULLY"
          echo "=========================================="

          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/dardasha-anonymous-chat-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-chat-debug
          path: dardasha-anonymous-chat-debug.apk
