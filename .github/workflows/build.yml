name: Build Dardasha Anonymous Chat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find chat project ZIP
        shell: bash
        run: |
          set -euo pipefail

          # Use the actual chat ZIP currently in the repository.
          # Prefer the FINAL name if it exists; otherwise use the uploaded chat project.
          if [ -f "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip" ]; then
            ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project-FINAL.zip"
          elif [ -f "$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip" ]; then
            ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip"
          else
            echo "::error::No chat project ZIP was found in the repository root."
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" -printf '%f\n' | sort || true
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP"
          unzip -t "$ZIP" >/dev/null
          echo "ZIP integrity: OK"

      - name: Extract chat project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "*/.gradle/*" | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle(.kts) found inside the selected chat ZIP."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts" || test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || test -f "$PROJECT_DIR/app/build.gradle"

          echo "Project structure: OK"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            find "$PROJECT_DIR/app/build" -maxdepth 6 -type f 2>/dev/null | sort | head -200 || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
