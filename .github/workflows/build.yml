private fun normalizeNameForFilter(value: String): String {
    return value.lowercase(Locale.getDefault())
        .replace(Regex("[\u064B-\u065F\u0670]"), "")
        .replace('أ', 'ا').replace('إ', 'ا').replace('آ', 'ا').replace('ى', 'ي').replace('ة', 'ه').replace("ـ", "")
        .replace(Regex("[^\\p{L}\\p{N}]"), "")
        .replace(Regex("(.)\\1{2,}"), "$1$1")
}

private fun sanitizeDisplayName(value: String): String {
    val trimmed = value.trim().take(32)
    if (trimmed.isBlank()) return NAME_VIOLATION_REPLACEMENT
    val normalized = normalizeNameForFilter(trimmed)
    val bad = FORBIDDEN_NAME_WORDS.any { normalizeNameForFilter(it) in normalized }
    return if (bad) NAME_VIOLATION_REPLACEMENT else trimmed
}


