name: Build Dardasha Anonymous APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find and extract Dardasha project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for candidate in \
            "Dardasha-MASTER-CLEAN-BUILD.zip" \
            "Dardasha-MAIN-BUILD-ALL-FIXES-CORRECTED2.zip" \
            "Dardasha-MAIN-BUILD-ALL-FIXES-CORRECTED.zip"; do

            if [ -f "$GITHUB_WORKSPACE/$candidate" ]; then
              ZIP="$GITHUB_WORKSPACE/$candidate"
              break
            fi

          done

          if [ -z "$ZIP" ]; then
            echo "::error::No supported Dardasha project ZIP was found in the repository root."
            echo "ZIP files currently present:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort || true
            exit 1
          fi

          echo "Using project ZIP: $(basename "$ZIP")"

          unzip -t "$ZIP" >/dev/null

          rm -rf "$GITHUB_WORKSPACE/extracted-dardasha"
          mkdir -p "$GITHUB_WORKSPACE/extracted-dardasha"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted-dardasha"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted-dardasha" -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::The ZIP does not contain an Android Gradle project."
            find "$GITHUB_WORKSPACE/extracted-dardasha" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Verify clean master project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/dardasha/anonymous/MainActivity.kt"
          test -f "$PROJECT_DIR/database.rules.json"
          test -f "$PROJECT_DIR/storage.rules"

          SRC="$PROJECT_DIR/app/src/main/java/com/dardasha/anonymous/MainActivity.kt"

          grep -Fq 'OWNER_UID = "wDMqt8jpP1gEJJtLuUMrTTaeU8q1"' "$SRC"

          grep -Fq 'BUILD_STAMP = "DARDASHA-MAIN-BUILD-ALL-FIXES"' "$SRC"

          if grep -Fq "replace('ـ', '')" "$SRC"; then
            echo "::error::Invalid Kotlin empty character literal found."
            exit 1
          fi

          echo "Project verification: OK"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
