name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ==========================================
      # Find and extract Dardasha project ZIP
      # ==========================================
      - name: Find and extract Dardasha project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Searching for Dardasha project ZIP..."
          echo "======================================"

          ZIP_FILE=""

          # Prefer V3
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "Dardasha-FINAL-FIXED-V3.zip" \
            -not -path "*/.git/*" \
            -print -quit || true)

          # Fallback to any Dardasha ZIP
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*dardasha*.zip" \
              -not -path "*/.git/*" \
              -print -quit || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Dardasha ZIP found."

            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -print \
              | sort

            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP integrity: OK"

          PROJECT_ROOT="$RUNNER_TEMP/dardasha-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          unzip -q "$ZIP_FILE" \
            -d "$PROJECT_ROOT"

          echo ""
          echo "ZIP extracted."

          # ==========================================
          # Find actual Android project
          # ==========================================

          SETTINGS_FILE=$(find "$PROJECT_ROOT" \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o -name "settings.gradle" \
            \) \
            -not -path "*/.gradle/*" \
            -print -quit || true)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project was not found inside ZIP."

            echo ""
            echo "Extracted files:"
            find "$PROJECT_ROOT" \
              -maxdepth 8 \
              -type f \
              | sort \
              | head -400

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "======================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

          # Verify app module
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then

            echo "ERROR: app/build.gradle.kts was not found."

            find "$PROJECT_DIR" \
              -maxdepth 5 \
              -type f \
              | sort

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # Verify Firebase
      # ==========================================
      - name: Verify Firebase
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "WARNING: google-services.json was not found."
            echo "Continuing because the project may configure Firebase differently."
          else
            echo "Firebase configuration: OK"
          fi

      # ==========================================
      # Show actual project
      # ==========================================
      - name: Show project configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "PROJECT CONFIGURATION"
          echo "======================================"

          pwd

          echo ""
          echo "Project files:"
          find . \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

          echo ""
          echo "Compose BOM:"
          grep -Rni "compose-bom" . \
            --include="*.gradle.kts" \
            --include="*.gradle" \
            || true

      # ==========================================
      # Gradle configuration
      # ==========================================
      - name: Test Gradle configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            tasks \
            --console=plain

      # ==========================================
      # Build APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING DARDASHA APK"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug \
            --console=plain

      # ==========================================
      # Find APK
      # ==========================================
      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build outputs:"
            find "$PROJECT_DIR/app/build/outputs" \
              -maxdepth 8 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      # ==========================================
      # Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
