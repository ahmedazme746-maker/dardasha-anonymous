name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          rm -rf build-project
          mkdir -p build-project
          unzip -q dardasha-anonymous-project-fixed.zip -d build-project
          find build-project -maxdepth 3 -type f | sort

      - name: Prepare project
        run: |
          PROJECT_DIR=$(find build-project -name settings.gradle.kts -type f -print -quit)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_DIR")
          echo "Project root: $PROJECT_ROOT"

          if [ "$PROJECT_ROOT" != "build-project" ]; then
            rm -rf build-project/source
            mkdir -p build-project/source
            cp -R "$PROJECT_ROOT"/. build-project/source/
            rm -rf "$PROJECT_ROOT"
            mv build-project/source/* build-project/source/.[!.]* build-project/ 2>/dev/null || true
            rm -rf build-project/source
          fi

          test -f build-project/settings.gradle.kts
          test -f build-project/app/build.gradle.kts

      - name: Build APK
        run: |
          cd build-project
          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f build-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-apk
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
