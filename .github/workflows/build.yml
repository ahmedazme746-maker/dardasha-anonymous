name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Find and extract Dardasha V3
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./Dardasha-FINAL-CLEAN-SOURCE-V3.zip"

          echo "Checking for V3:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Dardasha-FINAL-CLEAN-SOURCE-V3.zip was not found."
            echo "ZIP files in repository:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          rm -rf /tmp/dardasha
          mkdir -p /tmp/dardasha

          unzip -q "$ZIP_FILE" -d /tmp/dardasha

          PROJECT_DIR=$(find /tmp/dardasha \
            -name "settings.gradle.kts" \
            -type f \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          rm -rf project
          cp -R "$PROJECT_DIR" project

          echo "Project selected:"
          pwd
          find project -maxdepth 3 -type f | sort

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="project/app/src/main/java/com/dardasha/anonymous/MainActivity.kt"

          test -f "$MAIN"

          echo "Checking withStyle import..."
          grep -n "import androidx.compose.ui.text.withStyle" "$MAIN"

          echo "Checking verticalScroll import..."
          grep -n "import androidx.compose.foundation.verticalScroll" "$MAIN"

          echo "Checking owner UID..."
          grep -n "wDMqt8jpP1gEJJtLuUMrTTaeU8q1" "$MAIN"

          echo "SOURCE CHECK PASSED"

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK FOUND:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
