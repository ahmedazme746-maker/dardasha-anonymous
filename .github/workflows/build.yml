    @Composable
    private fun AdminScreen() {
        var users by remember { mutableStateOf<List<UserProfile>>(emptyList()) }
        var reports by remember { mutableStateOf<List<ReportItem>>(emptyList()) }
        ScreenBackground {
            Column(Modifier.fillMaxSize()) {
                Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically) { IconButton({ screen = "main" }) { Icon(Icons.Default.ArrowBack, null, tint = TextMain) }; Text("لوحة تحكم الأدمن", color = TextMain, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.ExtraBold) }
                Text("صلاحيات كاملة: إدارة المستخدمين • التوثيق • الصور • الحظر", color = TextMuted, modifier = Modifier.padding(horizontal = 18.dp))
                Spacer(Modifier.height(10.dp))
                LazyColumn(Modifier.fillMaxSize().padding(12.dp)) {
                    item { AdminSectionTitle("البلاغات") }
                    if (reports.isEmpty()) item { Text("لا توجد بلاغات جديدة", color = TextMuted, modifier = Modifier.padding(bottom = 8.dp)) }
                    items(reports.sortedByDescending { it.createdAt }, key = { it.id }) { r ->
                        GlassCard(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                            Text("السبب: ${r.reason}", color = Pink, fontWeight = FontWeight.Bold)
                            Text("المُبلّغ: ${r.reporterId}", color = TextMuted, maxLines = 1)
                            Text("على المستخدم: ${r.reportedId}", color = TextMuted, maxLines = 1)
                            Text(formatDateTime(r.createdAt), color = TextMuted, style = MaterialTheme.typography.labelSmall)
                        }
                    }
                    item { AdminSectionTitle("المستخدمون") }
                    items(users.sortedWith(compareByDescending<UserProfile> { it.admin }.thenByDescending { it.joinedAt }), key = { it.uid }) { u -> AdminUserCard(u) }
                }
            }
        }
        DisposableEffect(uid) {
            val ref = db.reference.child("users")
            val listener = object : ValueEventListener {
                override fun onDataChange(s: DataSnapshot) { users = s.children.mapNotNull { parseUser(it) } }
                override fun onCancelled(e: DatabaseError) { showError(e.message) }
            }
            ref.addValueEventListener(listener)
            onDispose { ref.removeEventListener(listener) }
        }
        DisposableEffect(uid) {
            val ref = db.reference.child("reports")
            val listener = object : ValueEventListener {
                override fun onDataChange(s: DataSnapshot) {
                    reports = s.children.mapNotNull { snap ->
                        ReportItem(snap.key ?: return@mapNotNull null, snap.child("reporterId").getValue(String::class.java).orEmpty(), snap.child("reportedId").getValue(String::class.java).orEmpty(), snap.child("reason").getValue(String::class.java).orEmpty(), snap.child("createdAt").getValue(Long::class.java) ?: 0L)
                    }
                }
                override fun onCancelled(e: DatabaseError) { showError(e.message) }
            }
            ref.addValueEventListener(listener)
            onDispose { ref.removeEventListener(listener) }
        }
    }

