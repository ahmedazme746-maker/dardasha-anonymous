name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1) تحميل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) إعداد Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3) إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4) تثبيت Android SDK 36
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5) التأكد من وجود النسخة النهائية
      - name: Find final project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Dardasha-FINAL-WORK-READY-V2.zip..."

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'Dardasha-FINAL-WORK-READY-V2.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Dardasha-FINAL-WORK-READY-V2.zip was not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 6) فك المشروع في مجلد منفصل
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/dardasha-build"
          mkdir -p "$GITHUB_WORKSPACE/dardasha-build"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/dardasha-build"

          echo "Extracted project files:"
          find "$GITHUB_WORKSPACE/dardasha-build" \
            -maxdepth 4 \
            -type f \
            \( -name 'settings.gradle.kts' \
            -o -name 'build.gradle.kts' \
            -o -name 'AndroidManifest.xml' \
            -o -name 'MainActivity.kt' \
            -o -name 'google-services.json' \) \
            -print

      # 7) تحديد مجلد مشروع Android الحقيقي
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/dardasha-build" \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: root build.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: app/google-services.json is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 8) إعداد Gradle 8.13
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 9) التحقق من Java وGradle
      - name: Verify build tools
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          sdkmanager --list_installed | head -100

      # 10) تنظيف أي ملفات بناء قديمة
      - name: Clean project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle --no-daemon clean

      # 11) بناء APK Debug
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      # 12) التأكد أن APK تم إنتاجه
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available build outputs:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # 13) رفع APK كملف يمكن تنزيله من GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dardasha-Anonymous-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
