name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Dardasha ZIP..."

          ZIP=""

          # Prefer the corrected ZIP
          ZIP=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "Dardasha-GitHub-READY-FIXED.zip" \
            -not -path "*/.git/*" \
            -print -quit || true)

          # Then try the other known names
          if [ -z "$ZIP" ]; then
            ZIP=$(find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -iname "dardasha-anonymous-chat-project-FINAL.zip" \
                -o -iname "dardasha-anonymous-chat-project.zip" \
                -o -iname "*dardasha*ready*.zip" \
                -o -iname "*dardasha*.zip" \
              \) \
              -not -path "*/.git/*" \
              -print -quit || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: No Dardasha ZIP was found."
            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -print | sort || true
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

          unzip -t "$ZIP" >/dev/null

          echo "ZIP integrity: OK"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/dardasha-project"
          mkdir -p "$RUNNER_TEMP/dardasha-project"

          unzip -q "$ZIP_FILE" \
            -d "$RUNNER_TEMP/dardasha-project"

          echo "Searching for Android project..."

          SETTINGS_FILE=$(find "$RUNNER_TEMP/dardasha-project" \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o -name "settings.gradle" \
            \) \
            -not -path "*/.gradle/*" \
            -print -quit || true)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."

            echo ""
            echo "Files inside ZIP:"
            find "$RUNNER_TEMP/dardasha-project" \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle"

          test -d "$PROJECT_DIR/app/src/main"

          echo "Android project structure: OK"

      - name: Fix Android build compatibility
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PROJECT_DIR/build.gradle.kts"
          APP="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$ROOT" ]; then

            # Use compatible Android Gradle Plugin
            sed -i \
              's/com.android.application" version "8.13.0"/com.android.application" version "8.13.2"/g' \
              "$ROOT"

            # Force the Kotlin plugin version used by this project
            sed -i \
              's/org.jetbrains.kotlin.android" version "2.3.0"/org.jetbrains.kotlin.android" version "2.3.0"/g' \
              "$ROOT"

          fi

          if [ -f "$APP" ]; then

            # Keep Compose BOM compatible with compileSdk 36
            sed -i \
              's/compose-bom:2026.09.00/compose-bom:2026.07.00/g' \
              "$APP"

          fi

          echo "Compatibility fixes applied."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Starting Gradle build..."

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              | head -300 || true

            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
