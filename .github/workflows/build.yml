name: Build Dardasha Anonymous Chat

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find chat project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::dardasha-anonymous-chat-project.zip not found."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          unzip -t "$ZIP" >/dev/null

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

          echo "Project ZIP found and verified."

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Fix Android compatibility
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PROJECT_DIR/build.gradle.kts"
          APP="$PROJECT_DIR/app/build.gradle.kts"

          test -f "$ROOT"
          test -f "$APP"

          # AGP
          sed -i \
            's/8\.13\.0/8.13.2/g' \
            "$ROOT"

          # Compose BOM
          sed -i \
            's/2026\.09\.00/2026.06.01/g' \
            "$APP"

          # Core KTX:
          # 1.18+ requires compileSdk 36.1.
          # Project stays on compileSdk 36.
          sed -i \
            's/androidx\.core:core-ktx:1\.19\.1/androidx.core:core-ktx:1.17.0/g' \
            "$APP"

          # Keep compileSdk at 36.
          sed -i \
            's/compileSdk = 37/compileSdk = 36/g' \
            "$APP"

          echo "===== FINAL ROOT CONFIG ====="
          cat "$ROOT"

          echo
          echo "===== FINAL APP CONFIG ====="
          cat "$APP"

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'id("com.android.application") version "8.13.2"' \
            "$PROJECT_DIR/build.gradle.kts"

          grep -q \
            'compileSdk = 36' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'androidx.core:core-ktx:1.17.0' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'compose-bom:2026.06.01' \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo "Configuration verified successfully."

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android SDK 36 is available."

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          java -version
          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK was not created."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          echo "APK created successfully:"
          ls -lh \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
