name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          unzip -q dardasha-anonymous-project.zip
          ls -la dardasha-anonymous

      - name: Fix Java and Kotlin JVM targets
        run: |
          cd dardasha-anonymous

          find . -name "*.gradle" -type f -print0 | xargs -0 sed -i \
            -e "s/VERSION_1_8/VERSION_17/g" \
            -e "s/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g" \
            -e "s/sourceCompatibility = 1\.8/sourceCompatibility = 17/g" \
            -e "s/targetCompatibility = 1\.8/targetCompatibility = 17/g"

      - name: Build APK
        run: |
          cd dardasha-anonymous
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-apk
          path: dardasha-anonymous/app/build/outputs/apk/debug/app-debug.apk
