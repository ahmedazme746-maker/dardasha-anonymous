name: Build Dardasha Anonymous Chat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find chat project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/dardasha-anonymous-chat-project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::dardasha-anonymous-chat-project.zip was not found."
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" -printf '%f\n'
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP check passed."

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -not -path "*/.gradle/*" \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android project was not found."

            find "$GITHUB_WORKSPACE/project" \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Fix project compatibility
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PROJECT_DIR/build.gradle.kts"
          APP="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$ROOT" ]; then
            echo "::error::Root build.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$APP" ]; then
            echo "::error::app/build.gradle.kts not found."
            exit 1
          fi

          # AGP compatible with Kotlin 2.3
          sed -i \
            's/id("com.android.application") version "8\.13\.0"/id("com.android.application") version "8.13.2"/g' \
            "$ROOT"

          # Keep compileSdk on API 36
          sed -i \
            's/compileSdk = 37/compileSdk = 36/g' \
            "$APP"

          # Compose stable line compatible with API 36
          sed -i \
            's/2026\.09\.00/2026.06.01/g' \
            "$APP"

          # Core 1.18+ requires API 36.1.
          # Use 1.17.0 so compileSdk 36 remains sufficient.
          sed -i \
            's/androidx\.core:core-ktx:1\.19\.1/androidx.core:core-ktx:1.17.0/g' \
            "$APP"

          echo
          echo "===== ROOT BUILD FILE ====="
          cat "$ROOT"

          echo
          echo "===== APP BUILD FILE ====="
          cat "$APP"

      - name: Fix Material3 opt-in
        shell: bash
        run: |
          set -euo pipefail

          MAIN_FILE="$(
            find "$PROJECT_DIR/app/src/main" \
              -type f \
              -name "MainActivity.kt" \
              -print -quit
          )"

          if [ -z "$MAIN_FILE" ]; then
            echo "::error::MainActivity.kt was not found."
            exit 1
          fi

          if ! grep -q \
            "ExperimentalMaterial3Api" \
            "$MAIN_FILE"; then

            sed -i \
              '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' \
              "$MAIN_FILE"
          fi

          echo "Material3 opt-in checked."

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking AGP..."

          grep -q \
            'id("com.android.application") version "8.13.2"' \
            "$PROJECT_DIR/build.gradle.kts"

          echo "AGP OK."

          echo "Checking compileSdk..."

          grep -q \
            'compileSdk = 36' \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo "compileSdk OK."

          echo "Checking Core KTX..."

          grep -q \
            'androidx.core:core-ktx:1.17.0' \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo "Core KTX OK."

          echo "Checking Compose BOM..."

          grep -q \
            'compose-bom:2026.06.01' \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo "Compose BOM OK."

          echo
          echo "===== FINAL DEPENDENCY CHECK ====="

          grep -n \
            -E \
            'compileSdk|core-ktx|compose-bom' \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo
          echo "All configuration checks passed."

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d \
            "$ANDROID_HOME/platforms/android-36"

          test -d \
            "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android SDK 36 is available."

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo
          echo "===== GRADLE ====="
          gradle --version

          echo
          echo "===== BUILDING APK ====="

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK was not generated."

            find "$PROJECT_DIR/app/build" \
              -type f \
              | sort || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          echo "APK created:"
          ls -lh \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
