name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Find final Dardasha ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name 'Dardasha-FINAL-FIXED-V3-UPDATED.zip' \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Dardasha-FINAL-FIXED-V3-UPDATED.zip was not found."

            echo ""
            echo "ZIP files in repository:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              -not -path '*/.git/*' \
              -print

            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="$RUNNER_TEMP/dardasha-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          SETTINGS_FILE="$(find "$PROJECT_ROOT" \
            -type f \
            \( \
              -name 'settings.gradle.kts' \
              -o \
              -name 'settings.gradle' \
            \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "ANDROID PROJECT"
          echo "$PROJECT_DIR"
          echo "================================"

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Gradle
        run: |
          set -e
          gradle --version

      - name: Fix source and dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          MAIN="app/src/main/java/com/dardasha/anonymous/MainActivity.kt"
          FILE="app/build.gradle.kts"

          echo "================================"
          echo "FIXING SOURCE"
          echo "================================"

          test -f "$MAIN"
          test -f "$FILE"

          # Fix known Firebase Presence compilation error.
          sed -i \
            's/ref\.onDisconnect()\.child("online")\.setValue(false)/ref.child("online").onDisconnect().setValue(false)/g' \
            "$MAIN"

          if grep -q 'ref\.onDisconnect()\.child' "$MAIN"; then
            echo "ERROR: Invalid onDisconnect().child() still exists."
            exit 1
          fi

          echo "Presence source check: OK"

          echo ""
          echo "================================"
          echo "FIXING ANDROID CONFIGURATION"
          echo "================================"

          # Keep project on API 36.
          sed -i -E \
            's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' \
            "$FILE"

          # Compose BOM compatible with compileSdk 36.
          sed -i -E \
            's/(androidx\.compose:compose-bom:)[0-9]+\.[0-9]+\.[0-9]+/\12026.06.01/g' \
            "$FILE"

          # Core compatible with compileSdk 36.
          sed -i -E \
            's/(androidx\.core:core-ktx:)[0-9]+\.[0-9]+\.[0-9]+/\11.18.0/g' \
            "$FILE"

          sed -i -E \
            's/(androidx\.core:core:)[0-9]+\.[0-9]+\.[0-9]+/\11.18.0/g' \
            "$FILE"

          # Prevent transitive dependencies from upgrading
          # Core or Compose beyond the compatible versions.
          cat >> "$FILE" <<'EOF'

          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  if (requested.group == "androidx.core" &&
                      (requested.name == "core" ||
                       requested.name == "core-ktx")) {
                      useVersion("1.18.0")
                  }

                  if (requested.group == "androidx.compose.animation" ||
                      requested.group == "androidx.compose.foundation" ||
                      requested.group == "androidx.compose.runtime" ||
                      requested.group == "androidx.compose.ui") {
                      useVersion("1.11.4")
                  }
              }
          }
          EOF

          echo "Android configuration:"
          grep -nE \
            'compileSdk|compose-bom|androidx.core|resolutionStrategy' \
            "$FILE" || true

      - name: Clean
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle --no-daemon clean

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            :app:assembleDebug \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          echo "================================"
          echo "APK SUCCESSFULLY CREATED"
          echo "================================"

          ls -lh \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dardasha-Anonymous-APK
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
          retention-days: 14
