name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Firebase project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*firebase*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Firebase project ZIP was not found."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Kotlin 2.3 compiler options
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: $BUILD_FILE not found."
            exit 1
          fi

          echo "Patching: $BUILD_FILE"

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
              text = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n" + text

          pattern = r'(?ms)^[ \t]*kotlinOptions[ \t]*\{[ \t]*\n[ \t]*jvmTarget[ \t]*=[ \t]*["\']17["\'][ \t]*\n[ \t]*\}[ \t]*\n?'

          text, count = re.subn(pattern, "", text)

          compiler_block = '''
          kotlin {
              compilerOptions {
                  jvmTarget = JvmTarget.fromTarget("17")
              }
          }
          '''

          if "jvmTarget = JvmTarget.fromTarget(\"17\")" not in text:
              text = text.rstrip() + "\n\n" + compiler_block.strip() + "\n"

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Removed old kotlinOptions block:", count)
          print("Applied compilerOptions with JVM target 17.")
          PY

          echo "Final relevant configuration:"
          grep -n -A5 -B2 "compilerOptions" "$BUILD_FILE" || true

      - name: Fix Material3 experimental API
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          if ! grep -q "ExperimentalMaterial3Api" "$MAIN_FILE"; then
            sed -i '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' "$MAIN_FILE"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          cat > "$GITHUB_WORKSPACE/ci-version-fix.init.gradle" <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  resolutionStrategy {
                      eachPlugin {
                          if (requested.id.id.startsWith("org.jetbrains.kotlin.")) {
                              useVersion("2.3.0")
                          }

                          if (requested.id.id == "com.android.application" ||
                              requested.id.id == "com.android.library") {
                              useVersion("8.13.0")
                          }
                      }
                  }
              }
          }
          EOF

          gradle \
            --no-daemon \
            --init-script "$GITHUB_WORKSPACE/ci-version-fix.init.gradle" \
            assembleDebug \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/dardasha-anonymous-debug.apk"

          echo "APK:"
          echo "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: dardasha-anonymous-debug.apk
