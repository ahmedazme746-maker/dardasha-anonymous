name: Build Dardasha V12.2 EXACT

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Select V12.2 project EXACTLY
        shell: bash
        run: |
          set -euo pipefail

          ZIP='Dardasha-V12.2-STORAGE-AUDIO-HARDENED.zip'

          test -f "$ZIP" || {
            echo "ERROR: $ZIP is missing from repository root."
            exit 1
          }

          rm -rf project /tmp/dardasha-project
          mkdir -p project /tmp/dardasha-project

          unzip -q -o "$ZIP" -d /tmp/dardasha-project

          PROJECT_DIR=$(find /tmp/dardasha-project \
            -type f \
            -name settings.gradle.kts \
            -print \
            -quit | xargs -r dirname)

          test -n "$PROJECT_DIR" || {
            echo "ERROR: settings.gradle.kts not found inside V12.2 ZIP."
            exit 1
          }

          cp -R "$PROJECT_DIR"/. project/

          echo "PROJECT_DIR=$PWD/project" >> "$GITHUB_ENV"
          echo "SELECTED_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Verify selected source is V12.2
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          MAIN='app/src/main/java/com/dardasha/anonymous/MainActivity.kt'
          SERVICE='app/src/main/java/com/dardasha/anonymous/DardashaMessagingService.kt'

          test -f "$MAIN"
          test -f "$SERVICE"

          grep -Fq 'versionName = "12.2-STORAGE-AUDIO-HARDENED"' app/build.gradle.kts
          grep -Fq 'FirebaseStorage.getInstance("gs://dardasha-anonymous.firebasestorage.app")' "$MAIN"
          grep -Fq 'ref.putFile' "$MAIN"
          grep -Fq 'ref.downloadUrl' "$MAIN"
          grep -Fq 'MediaRecorder.AudioSource.MIC' "$MAIN"
          grep -Fq 'recipientId' "$MAIN"
          grep -Fq 'FirebaseMessagingService' "$SERVICE"

          echo "EXACT V12.2 SOURCE AUDIT: PASSED"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean :app:assembleDebug

      - name: Verify APK version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK='app/build/outputs/apk/debug/app-debug.apk'

          test -s "$APK"

          echo "APK created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-v12-2-exact
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
