private const val DB_URL = "https://dardasha-anonymous-default-rtdb.firebaseio.com"
private const val MAX_MESSAGE_LENGTH = 1000

data class UserProfile(
    val uid: String = "",
    val name: String = "",
    val email: String = "",
    val gender: String = "",
    val avatarUrl: String = "",
    val avatarPendingUrl: String = "",
    val avatarPending: Boolean = false,
    val verified: Boolean = false,
    val admin: Boolean = false,
    val online: Boolean = false,
    val joinedAt: Long = 0L
)

data class Msg(val id: String, val senderId: String, val text: String, val timestamp: Long)
data class ChatPreview(val roomId: String, val peerId: String, val peerName: String, val peerVerified: Boolean, val lastMessage: String, val updatedAt: Long)

class MainActivity : ComponentActivity() {
    private lateinit var auth: FirebaseAuth
    private lateinit var db: FirebaseDatabase
    private lateinit var storage: FirebaseStorage

    private var uid by mutableStateOf("")
    private var profile by mutableStateOf<UserProfile?>(null)
    private var screen by mutableStateOf("landing")
    private var selectedTab by mutableStateOf(0)
    private var loading by mutableStateOf(false)
    private var errorText by mutableStateOf<String?>(null)

    private val messages = mutableStateListOf<Msg>()
    private val onlineUsers = mutableStateListOf<UserProfile>()
    private val chats = mutableStateListOf<ChatPreview>()
    private var currentRoom by mutableStateOf<String?>(null)
    private var currentPeer by mutableStateOf<UserProfile?>(null)

    private var usersListener: ValueEventListener? = null
    private var chatsListener: ValueEventListener? = null
    private var messagesListener: ChildEventListener? = null
    private var currentRoomRef: DatabaseReference? = null

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        auth = FirebaseAuth.getInstance()
        db = FirebaseDatabase.getInstance(DB_URL)
        storage = FirebaseStorage.getInstance()

        val current = auth.currentUser
        if (current == null) {
            uid = ""
            screen = "landing"
        } else {
            uid = current.uid
            loadProfileOrSetup()
        }

        setContent {
            MaterialTheme {
                Surface(Modifier.fillMaxSize()) { App() }
            }
        }
    }

    override fun onStart() {
        super.onStart()
        if (uid.isNotBlank()) setPresence(true)
    }

    override fun onStop() {
        if (uid.isNotBlank()) setPresence(false)
        super.onStop()
    }

    @Composable
    private fun App() {
        when (screen) {
            "landing" -> LandingScreen()
            "guest" -> GuestScreen()
            "register" -> RegisterScreen()
            "login" -> LoginScreen()
            "setup" -> GuestScreen()
            "main" -> MainScreen()
            "chat" -> ChatScreen()
            "admin" -> AdminScreen()
            "edit" -> EditProfileScreen()
            else -> LandingScreen()
        }
    }

