    @Composable
    private fun AdminScreen() {
        var users by remember { mutableStateOf<List<UserProfile>>(emptyList()) }
        var pending by remember { mutableStateOf<List<UserProfile>>(emptyList()) }
        DisposableEffect(Unit) {
            val ref = db.reference.child("users")
            val l = object : ValueEventListener {
                override fun onDataChange(s: DataSnapshot) {
                    val all = s.children.mapNotNull { parseUser(it) }.filter { it.uid != uid }
                    users = all
                    pending = all.filter { it.avatarPending && it.avatarPendingUrl.isNotBlank() }
                }
                override fun onCancelled(e: DatabaseError) {}
            }
            ref.addValueEventListener(l)
            onDispose { ref.removeEventListener(l) }
        }
        SimpleScaffold("لوحة الأدمن", back = { screen = "main" }) {
            LazyColumn(Modifier.fillMaxSize().padding(12.dp)) {
                item { Text("إدارة المستخدمين", style = MaterialTheme.typography.headlineSmall); Spacer(Modifier.height(10.dp)) }
                items(users, key = { it.uid }) { u ->
                    Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                        Column(Modifier.padding(12.dp)) {
                            Row(verticalAlignment = Alignment.CenterVertically) {
                                Avatar(u.name, u.verified, u.avatarUrl.takeIf { it.isNotBlank() }, Modifier.size(48.dp))
                                Spacer(Modifier.width(10.dp))
                                Column(Modifier.weight(1f)) {
                                    Text(u.name)
                                    Text(u.email.ifBlank { "زائر" })
                                }
                            }
                            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                Button({ setVerified(u.uid, !u.verified) }, Modifier.weight(1f)) {
                                    Text(if (u.verified) "إلغاء التوثيق" else "توثيق ✓")
                                }
                                if (u.avatarPending) {
                                    Button({ approveAvatar(u) }, Modifier.weight(1f)) { Text("قبول الصورة") }
                                }
                            }
                        }
                    }
                }
            }
        }
    }

