    private val heartbeat = object : Runnable {
        override fun run() {
            if (appInForeground && uid.isNotBlank() && profile?.manualOffline != true) {
                db.reference.child("users").child(uid).updateChildren(
                    mapOf("online" to true, "lastSeen" to ServerValue.TIMESTAMP)
                )
            }
            heartbeatHandler.postDelayed(this, HEARTBEAT_MS)
        }
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        auth = FirebaseAuth.getInstance()
        db = FirebaseDatabase.getInstance(DB_URL)
        // Always use the Firebase default Storage bucket from the initialized
        // FirebaseApp. Do not reconstruct a gs:// URL in app code; that can
        // point to a different bucket after a Firebase project migration.
        storage = FirebaseStorage.getInstance()
        now = System.currentTimeMillis()
        createNotificationChannel()

        val current = auth.currentUser
        if (current != null) {
            uid = current.uid
            loadProfileOrSetup()
        }

        setContent {
            DardashaTheme { Surface(Modifier.fillMaxSize(), color = Bg) { App() } }
        }

        heartbeatHandler.post(heartbeat)
    }

    override fun onStart() {
        super.onStart()
        appInForeground = true
        if (uid.isNotBlank() && profile?.manualOffline != true) setPresence(true)
    }

    override fun onStop() {
        appInForeground = false
        if (uid.isNotBlank()) setPresence(false)
        super.onStop()
    }

    override fun onDestroy() {
        heartbeatHandler.removeCallbacks(heartbeat)
        stopRecordingSilently()
        mediaPlayer?.release()
        mediaPlayer = null
        super.onDestroy()
    }

