import androidx.compose.runtime.getValue
import androidx.compose.runtime.mutableStateOf
import androidx.compose.runtime.remember
import androidx.compose.runtime.setValue
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.text.style.TextAlign
import androidx.compose.ui.unit.dp
import com.google.firebase.auth.FirebaseAuth
import com.google.firebase.database.DataSnapshot
import com.google.firebase.database.DatabaseError
import com.google.firebase.database.FirebaseDatabase
import com.google.firebase.database.ValueEventListener
import com.google.firebase.database.DatabaseReference
import com.google.firebase.database.ServerValue
import java.util.UUID

private const val DB_URL =
    "https://dardasha-anonymous-default-rtdb.firebaseio.com"

private data class ChatMessage(
    val id: String = "",
    val senderId: String = "",
    val text: String = "",
    val timestamp: Long = 0L
)

private enum class Screen {
    HOME,
    MATCHING,
    CHAT
}

class MainActivity : ComponentActivity() {

    private val auth: FirebaseAuth by lazy {
        FirebaseAuth.getInstance()
    }

    private val database: FirebaseDatabase by lazy {
        FirebaseDatabase.getInstance(DB_URL)
    }

    private val root: DatabaseReference by lazy {
        database.reference
    }

    private var waitingRef: DatabaseReference? = null
    private var matchingListener: ValueEventListener? = null

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        setContent {
            MaterialTheme {
                Surface(
                    modifier = Modifier.fillMaxSize()
                ) {
                    DardashaApp()
                }
            }
        }
    }

    override fun onDestroy() {
        stopMatching()
        super.onDestroy()
    }

    @androidx.compose.runtime.Composable
    private fun DardashaApp() {

        var screen by remember {
            mutableStateOf(Screen.HOME)
        }

        var roomId by remember {
            mutableStateOf<String?>(null)
        }

        var errorMessage by remember {
            mutableStateOf<String?>(null)
        }

        LaunchedEffect(Unit) {
            if (auth.currentUser == null) {
                auth.signInAnonymously()
                    .addOnFailureListener {
                        errorMessage = "تعذر الاتصال بالخادم"
                    }
            }
        }

        when (screen) {

            Screen.HOME -> {
                HomeScreen(
                    errorMessage = errorMessage,
                    onStart = {
                        errorMessage = null
                        screen = Screen.MATCHING

                        startMatching(
                            onMatched = { matchedRoom ->
                                roomId = matchedRoom
                                screen = Screen.CHAT
                            },
                            onError = { message ->
                                errorMessage = message
                                screen = Screen.HOME
                            }
                        )
                    }
                )
            }

            Screen.MATCHING -> {
                MatchingScreen(
                    onCancel = {
                        stopMatching()
                        screen = Screen.HOME
                    }
                )
            }

            Screen.CHAT -> {
                val currentRoom = roomId

                if (currentRoom != null) {
                    ChatScreen(
                        roomId = currentRoom,
                        onLeave = {
                            leaveRoom(currentRoom)
                            roomId = null
                            screen = Screen.HOME
                        }
                    )
                } else {
                    screen = Screen.HOME
                }
            }
        }
    }

    @androidx.compose.runtime.Composable
    private fun HomeScreen(
        errorMessage: String?,
        onStart: () -> Unit
    ) {
        Scaffold(
            topBar = {
                TopAppBar(
                    title = {
                        Text("دردشة مع مجهول")
                    }
                )
            }
        ) { padding ->

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(padding)
                    .padding(24.dp),
                horizontalAlignment = Alignment.CenterHorizontally,
                verticalArrangement = Arrangement.Center
            ) {

                Text(
                    text = "أهلاً بك في دردشة مع مجهول",
                    style = MaterialTheme.typography.headlineSmall,
                    textAlign = TextAlign.Center
                )

                Spacer(
                    modifier = Modifier.height(12.dp)
                )

                Text(
                    text = "تواصل مع أشخاص جدد بشكل مجهول.",
                    style = MaterialTheme.typography.bodyLarge,
                    textAlign = TextAlign.Center
                )

                Spacer(
                    modifier = Modifier.height(32.dp)
                )

                Button(
                    onClick = onStart,
                    modifier = Modifier.fillMaxWidth()
                ) {
                    Icon(
                        imageVector = Icons.Default.Search,
                        contentDescription = null
                    )

                    Spacer(
                        modifier = Modifier.size(8.dp)
                    )

                    Text("ابدأ محادثة عشوائية")
                }

                if (!errorMessage.isNullOrBlank()) {

                    Spacer(
                        modifier = Modifier.height(20.dp)
                    )

                    Text(
                        text = errorMessage,
                        color = MaterialTheme.colorScheme.error,
                        textAlign = TextAlign.Center
                    )
                }
            }
        }
    }

    @androidx.compose.runtime.Composable
    private fun MatchingScreen(
        onCancel: () -> Unit
    ) {
        Scaffold(
            topBar = {
                TopAppBar(
                    title = {
                        Text("جاري البحث")
                    },
                    navigationIcon = {
                        IconButton(
                            onClick = onCancel
                        ) {
                            Icon(
                                imageVector = Icons.Default.ArrowBack,
                                contentDescription = "رجوع"
                            )
                        }
                    }
                )
            }
        ) { padding ->

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(padding)
                    .padding(24.dp),
                horizontalAlignment = Alignment.CenterHorizontally,
                verticalArrangement = Arrangement.Center
            ) {

                CircularProgressIndicator()

                Spacer(
                    modifier = Modifier.height(24.dp)
                )

                Text(
                    text = "جاري البحث عن شخص للمحادثة...",
                    style = MaterialTheme.typography.titleMedium,
                    textAlign = TextAlign.Center
                )

                Spacer(
                    modifier = Modifier.height(24.dp)
                )

                TextButton(
                    onClick = onCancel
                ) {
                    Text("إلغاء البحث")
                }
            }
        }
    }

    @androidx.compose.runtime.Composable
    private fun ChatScreen(
        roomId: String,
        onLeave: () -> Unit
    ) {

        var messageText by remember {
            mutableStateOf("")
        }

        var messages by remember {
            mutableStateOf<List<ChatMessage>>(emptyList())
        }

        var sending by remember {
            mutableStateOf(false)
        }

        var error by remember {
            mutableStateOf<String?>(null)
        }

        val listState = rememberLazyListState()

        val currentUserId = auth.currentUser?.uid ?: ""

        val messagesRef = remember(roomId) {
            root
                .child("rooms")
                .child(roomId)
                .child("messages")
        }

        LaunchedEffect(roomId) {

            messagesRef
                .limitToLast(200)
                .addValueEventListener(
                    object : ValueEventListener {

                        override fun onDataChange(snapshot: DataSnapshot) {

                            val result = mutableListOf<ChatMessage>()

                            for (child in snapshot.children) {

                                val id =
                                    child.key ?: continue

                                val senderId =
                                    child.child("senderId")
                                        .getValue(String::class.java)
                                        ?: ""

                                val text =
                                    child.child("text")
                                        .getValue(String::class.java)
                                        ?: ""

                                val timestamp =
                                    child.child("timestamp")
                                        .getValue(Long::class.java)
                                        ?: 0L

                                result.add(
                                    ChatMessage(
                                        id = id,
                                        senderId = senderId,
                                        text = text,
                                        timestamp = timestamp
                                    )
                                )
                            }

                            messages = result.sortedBy {
                                it.timestamp
                            }
                        }

                        override fun onCancelled(
                            databaseError: DatabaseError
                        ) {
                            error = "تعذر تحميل الرسائل"
                        }
                    }
                )
        }

        LaunchedEffect(messages.size) {

            if (messages.isNotEmpty()) {
                listState.animateScrollToItem(
                    messages.lastIndex
                )
            }
        }

        Scaffold(

            topBar = {

                TopAppBar(

                    title = {
                        Text("محادثة مجهولة")
                    },

                    navigationIcon = {

                        IconButton(
                            onClick = onLeave
                        ) {
                            Icon(
                                imageVector = Icons.Default.ArrowBack,
                                contentDescription = "إنهاء المحادثة"
                            )
                        }
                    },

                    actions = {

                        IconButton(
                            onClick = onLeave
                        ) {
                            Icon(
                                imageVector = Icons.Default.Close,
                                contentDescription = "إنهاء"
                            )
                        }
                    }
                )
            }

        ) { padding ->

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(padding)
            ) {

                if (!error.isNullOrBlank()) {

                    Text(
                        text = error!!,
                        color = MaterialTheme.colorScheme.error,
                        modifier = Modifier.padding(12.dp)
                    )
                }

                LazyColumn(
                    modifier = Modifier
                        .weight(1f)
                        .fillMaxWidth()
                        .padding(horizontal = 8.dp),
                    state = listState
                ) {

                    items(
                        items = messages,
                        key = {
                            it.id
                        }
                    ) { message ->

                        val mine =
                            message.senderId == currentUserId

                        Row(
                            modifier = Modifier
                                .fillMaxWidth()
                                .padding(
                                    vertical = 4.dp
                                ),
                            horizontalArrangement =
                                if (mine) {
                                    Arrangement.End
                                } else {
                                    Arrangement.Start
                                }
                        ) {

                            Card(
                                shape = RoundedCornerShape(
                                    16.dp
                                ),
                                modifier = Modifier
                                    .fillMaxWidth(
                                        0.82f
                                    )
                            ) {

                                Text(
                                    text = message.text,
                                    modifier = Modifier.padding(
                                        horizontal = 16.dp,
                                        vertical = 10.dp
                                    )
                                )
                            }
                        }
                    }
                }

                Row(
                    modifier = Modifier
                        .fillMaxWidth()
                        .navigationBarsPadding()
                        .padding(8.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {

                    OutlinedTextField(
                        value = messageText,
                        onValueChange = {
                            if (it.length <= 1000) {
                                messageText = it
                            }
                        },
                        modifier = Modifier.weight(1f),
                        placeholder = {
                            Text("اكتب رسالتك...")
                        },
                        singleLine = true,
                        enabled = !sending
                    )

                    Spacer(
                        modifier = Modifier.size(8.dp)
                    )

                    IconButton(
                        onClick = {

                            val cleanText =
                                messageText.trim()

                            if (
                                cleanText.isBlank() ||
                                sending
                            ) {
                                return@IconButton
                            }

                            val userId =
                                auth.currentUser?.uid

                            if (userId == null) {
                                error =
                                    "لم يتم تسجيل الدخول بعد"
                                return@IconButton
                            }

                            sending = true
                            error = null

                            val messageId =
                                messagesRef.push().key
                                    ?: UUID.randomUUID()
                                        .toString()

                            val data =
                                hashMapOf<String, Any>(
                                    "senderId" to userId,
                                    "text" to cleanText,
                                    "timestamp" to
                                            ServerValue.TIMESTAMP
                                )

                            messagesRef
                                .child(messageId)
                                .setValue(data)
                                .addOnSuccessListener {
                                    messageText = ""
                                    sending = false
                                }
                                .addOnFailureListener {
                                    sending = false
                                    error =
                                        "تعذر إرسال الرسالة"
                                }
                        },
                        enabled =
                            messageText.trim().isNotEmpty()
                                    && !sending
                    ) {

                        Icon(
                            imageVector = Icons.Default.Send,
                            contentDescription = "إرسال"
                        )
                    }
                }
            }
        }
    }

    private fun startMatching(
        onMatched: (String) -> Unit,
        onError: (String) -> Unit
    ) {

        stopMatching()

        val user = auth.currentUser

        if (user == null) {
            onError("لم يتم تسجيل الدخول إلى الخادم")
            return
        }

        val userId = user.uid

        val waiting =
            root
                .child("waiting")
                .child(userId)

        waitingRef = waiting

        val data =
            hashMapOf<String, Any>(
                "uid" to userId,
                "createdAt" to ServerValue.TIMESTAMP
            )

        waiting.setValue(data)
            .addOnFailureListener {
                waiting.removeValue()
                waitingRef = null
                onError("تعذر بدء البحث")
                return@addOnFailureListener
            }

        val waitingRoot =
            root.child("waiting")

        matchingListener =
            object : ValueEventListener {

                override fun onDataChange(
                    snapshot: DataSnapshot
                ) {

                    val currentUser =
                        auth.currentUser
                            ?: return

                    val myId =
                        currentUser.uid

                    var otherId: String? = null

                    for (child in snapshot.children) {

                        val candidate =
                            child.key ?: continue

                        if (candidate != myId) {
                            otherId = candidate
                            break
                        }
                    }

                    val partner =
                        otherId ?: return

                    val first =
                        if (myId < partner) {
                            myId
                        } else {
                            partner
                        }

                    val second =
                        if (myId < partner) {
                            partner
                        } else {
                            myId
                        }

                    val roomId =
                        "${first}_$second"

                    val room =
                        root
                            .child("rooms")
                            .child(roomId)

                    val roomData =
                        hashMapOf<String, Any>(
                            "user1" to first,
                            "user2" to second,
                            "createdAt" to
                                    ServerValue.TIMESTAMP
                        )

                    room
                        .updateChildren(roomData)
                        .addOnSuccessListener {

                            root
                                .child("waiting")
                                .child(myId)
                                .removeValue()

                            root
                                .child("waiting")
                                .child(partner)
                                .removeValue()

                            stopMatching()

                            onMatched(roomId)
                        }
                        .addOnFailureListener {

                            onError(
                                "تعذر إنشاء المحادثة"
                            )
                        }
                }

                override fun onCancelled(
                    error: DatabaseError
                ) {

                    onError(
                        "تعذر الاتصال بقاعدة البيانات"
                    )
                }
            }

        waitingRoot.addValueEventListener(
            matchingListener!!
        )
    }

    private fun stopMatching() {

        matchingListener?.let {
            root
                .child("waiting")
                .removeEventListener(it)
        }

        matchingListener = null

        waitingRef?.removeValue()

        waitingRef = null
    }

    private fun leaveRoom(
        roomId: String
    ) {

        stopMatching()

        val userId =
            auth.currentUser?.uid
                ?: return

        root
            .child("rooms")
            .child(roomId)
            .child("presence")
            .child(userId)
            .removeValue()
    }
}
