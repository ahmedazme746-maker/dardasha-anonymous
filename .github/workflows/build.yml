name: Build Dardasha Anonymous APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ---------------------------------------
      # Find the REAL Android project
      # ---------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android project..."

          SETTINGS=$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts was not found."

            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle.kts was not found."

            find "$PROJECT_DIR" \
              -maxdepth 4 \
              -type f \
              | sort

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ---------------------------------------
      # Verify Firebase
      # ---------------------------------------
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: google-services.json not found."
            exit 1
          fi

          echo "Firebase configuration: OK"

      # ---------------------------------------
      # Configure Compose BOM
      # ---------------------------------------
      - name: Configure Compose BOM
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/app/build.gradle.kts"

          echo "Current Compose BOM:"
          grep -n "compose-bom" "$APP" || true

          # Keep the Compose BOM consistent.
          sed -i \
            -E 's/compose-bom:[0-9]+\.[0-9]+\.[0-9]+/compose-bom:2026.09.00/g' \
            "$APP"

          echo "Compose BOM after configuration:"
          grep -n "compose-bom" "$APP" || true

      # ---------------------------------------
      # Show important project configuration
      # ---------------------------------------
      - name: Show project configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "================================"
          echo "PROJECT"
          echo "================================"

          pwd

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Compose BOM:"
          grep -n "compose-bom" app/build.gradle.kts || true

          echo ""
          echo "Android SDK:"
          echo "ANDROID_HOME=$ANDROID_HOME"

      # ---------------------------------------
      # Gradle configuration test
      # ---------------------------------------
      - name: Test Gradle configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            tasks \
            --console=plain

      # ---------------------------------------
      # Build APK
      # ---------------------------------------
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "================================"
          echo "BUILDING DARDASHA APK"
          echo "================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            :app:assembleDebug \
            --console=plain

      # ---------------------------------------
      # Find APK
      # ---------------------------------------
      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build/outputs" \
              -maxdepth 8 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      # ---------------------------------------
      # Upload APK
      # ---------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
