name: Build Dardasha Anonymous Chat

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find ZIP
        shell: bash
        run: |
          set -e
          if [ -f "dardasha-anonymous-chat-project.zip" ]; then
            echo "ZIP_FILE=dardasha-anonymous-chat-project.zip" >> "$GITHUB_ENV"
          elif [ -f "dardasha-anonymous-chat-project-FINAL.zip" ]; then
            echo "ZIP_FILE=dardasha-anonymous-chat-project-FINAL.zip" >> "$GITHUB_ENV"
          else
            echo "No chat ZIP found"
            exit 1
          fi

      - name: Extract
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project

          SETTINGS=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Fix Compose
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$APP" ]; then
            sed -i 's/2026\.09\.00/2026.07.00/g' "$APP"
          fi

      - name: Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dardasha-anonymous-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
