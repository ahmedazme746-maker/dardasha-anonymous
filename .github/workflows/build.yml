name: Build Dardasha Anonymous APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find and extract Dardasha project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for candidate in \
            "Dardasha-MASTER-CLEAN-BUILD.zip" \
            "Dardasha-MAIN-BUILD-ALL-FIXES-CORRECTED2.zip" \
            "Dardasha-MAIN-BUILD-ALL-FIXES-CORRECTED.zip"; do

            if [ -f "$GITHUB_WORKSPACE/$candidate" ]; then
              ZIP="$GITHUB_WORKSPACE/$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "::error::Dardasha project ZIP not found in repository root."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort || true
            exit 1
          fi

          echo "Using: $(basename "$ZIP")"

          unzip -t "$ZIP" >/dev/null

          rm -rf "$GITHUB_WORKSPACE/extracted-dardasha"
          mkdir -p "$GITHUB_WORKSPACE/extracted-dardasha"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted-dardasha"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted-dardasha" -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle(.kts) found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Deterministic source repair
        shell: bash
        run: |
          set -euo pipefail

          SRC="$PROJECT_DIR/app/src/main/java/com/dardasha/anonymous/MainActivity.kt"
          ROOT="$PROJECT_DIR/build.gradle.kts"
          APP="$PROJECT_DIR/app/build.gradle.kts"

          test -f "$SRC"
          test -f "$ROOT"
          test -f "$APP"

          python3 - "$SRC" <<'PY'
          import pathlib
          import sys

          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          # Fix missing verticalScroll import.
          imp = "import androidx.compose.foundation.verticalScroll\n"

          if imp not in s:
              marker = "import androidx.compose.foundation.lazy.LazyColumn\n"

              if marker in s:
                  s = s.replace(marker, imp + marker, 1)
              else:
                  s = s.replace(
                      "package com.dardasha.anonymous\n",
                      "package com.dardasha.anonymous\n\n" + imp,
                      1
                  )

          # Fix the known Kotlin character-literal error.
          s = s.replace(
              ".replace('ـ', '')",
              '.replace("ـ", "")'
          )

          # Explicit Material3 opt-in.
          opt = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)"

          if not s.lstrip().startswith(opt):
              s = opt + "\n\n" + s.lstrip()

          p.write_text(s, encoding="utf-8")
          PY

          # Force compatible Android/Kotlin plugin versions.
          sed -i \
            's/com.android.application") version "[^"]*"/com.android.application") version "8.13.2"/' \
            "$ROOT" || true

          sed -i \
            's/org.jetbrains.kotlin.android") version "[^"]*"/org.jetbrains.kotlin.android") version "2.3.0"/' \
            "$ROOT" || true

          sed -i \
            's/org.jetbrains.kotlin.plugin.compose") version "[^"]*"/org.jetbrains.kotlin.plugin.compose") version "2.3.0"/' \
            "$ROOT" || true

          echo "Source repair complete."

          echo "verticalScroll references:"
          grep -n "verticalScroll" "$SRC" || true

          echo "Owner check:"
          grep -Fq \
            'OWNER_UID = "wDMqt8jpP1gEJJtLuUMrTTaeU8q1"' \
            "$SRC"

          echo "Build stamp check:"
          grep -Fq \
            'BUILD_STAMP = "DARDASHA-MAIN-BUILD-ALL-FIXES"' \
            "$SRC"

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/database.rules.json"
          test -f "$PROJECT_DIR/storage.rules"

          echo "Project validation: OK"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/release/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
