name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          for file in *fixed*.zip; do
            if [ -f "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            for file in *.zip; do
              if [ -f "$file" ]; then
                ZIP_FILE="$file"
                break
              fi
            done
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Android project..."
          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/dardasha-anonymous-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: dardasha-anonymous-debug.apk
