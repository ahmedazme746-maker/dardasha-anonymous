                Modifier.fillMaxSize().padding(24.dp),
                horizontalAlignment = Alignment.CenterHorizontally,
                verticalArrangement = Arrangement.Center
            ) {
                Text("أهلاً بك", style = MaterialTheme.typography.headlineLarge)
                Spacer(Modifier.height(12.dp))
                Text("اختر طريقة الدخول", textAlign = TextAlign.Center)
                Spacer(Modifier.height(28.dp))
                Button({ screen = "login" }, Modifier.fillMaxWidth()) { Text("تسجيل الدخول") }
                Spacer(Modifier.height(12.dp))
                OutlinedButton({ screen = "guest" }, Modifier.fillMaxWidth()) { Text("دخول كزائر") }
                Spacer(Modifier.height(12.dp))
                OutlinedButton({ screen = "register" }, Modifier.fillMaxWidth()) { Text("إنشاء حساب") }
