    @Composable
    private fun OnlineScreen() {
        // Never treat a missing/zero lastSeen value as online. Older records may
        // have online=true left over from previous app versions; they stay in
        // Firebase but are not shown as currently active.
        val fresh = onlineUsers.filter {
            it.uid == uid || (!it.manualOffline && it.online && it.lastSeen > 0L && now - it.lastSeen <= 90_000L)
        }
        val admin = fresh.firstOrNull { it.admin }
        val others = fresh.filterNot { it.admin }.sortedByDescending { it.joinedAt }
        ScreenBackground {
            Column(Modifier.fillMaxSize()) {
                Row(Modifier.fillMaxWidth().padding(18.dp), verticalAlignment = Alignment.CenterVertically) {
                    Text("نشط الآن", style = MaterialTheme.typography.headlineSmall, color = TextMain, fontWeight = FontWeight.ExtraBold, modifier = Modifier.weight(1f))
                    Text("${fresh.size} متصل", color = Green, fontWeight = FontWeight.Bold)
                }
                if (fresh.isEmpty()) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("لا يوجد مستخدمون نشطون الآن", color = TextMuted) }
                else LazyColumn(Modifier.fillMaxSize().padding(horizontal = 12.dp)) {
                    if (admin != null) item(key = "admin") { OnlineRow(admin, true); Spacer(Modifier.height(8.dp)) }
                    items(others, key = { it.uid }) { u -> OnlineRow(u, false); Spacer(Modifier.height(8.dp)) }
                }
            }
        }
    }

