    private fun loadProfileOrSetup() {
        if (uid.isBlank()) return
        db.reference.child("users").child(uid).get().addOnSuccessListener { s ->
            val u = parseUser(s)
            profile = u
            // Repair old accounts that were created before the name filter existed.
            if (u != null && u.name.isNotBlank()) {
                val safe = sanitizeDisplayName(u.name)
                if (safe != u.name) {
                    db.reference.child("users").child(uid).child("name").setValue(safe)
                    profile = u.copy(name = safe)
                }
            }
            if (u?.banned == true) { showError("هذا الحساب محظور من الإدارة"); logout(); return@addOnSuccessListener }
            if (u == null || u.name.isBlank() || u.gender.isBlank()) screen = "guest" else { screen = "main"; if (uid == OWNER_UID) normalizeAdminFlags(); startListeners(); setPresence(true); requestNotificationPermissionIfNeeded() }
        }.addOnFailureListener { showError(it.message ?: "تعذر تحميل الحساب") }
    }

    private fun normalizeAdminFlags() {
        if (uid != OWNER_UID) return
        db.reference.child("users").get().addOnSuccessListener { snap ->
            snap.children.forEach { child ->
                val id = child.key ?: return@forEach
                val isAdmin = child.child("admin").getValue(Boolean::class.java) ?: false
                if (id != OWNER_UID && isAdmin) db.reference.child("users").child(id).child("admin").setValue(false)
            }
            db.reference.child("users").child(OWNER_UID).child("admin").setValue(true)
        }
    }

    private fun createGuestProfile(name: String, gender: String) {
        loading = true; errorText = null
        if (uid.isBlank()) auth.signInAnonymously().addOnSuccessListener { uid = it.user!!.uid; saveProfile(sanitizeDisplayName(name), "", gender, true) }.addOnFailureListener { loading = false; showError(it.message ?: "تعذر دخول الزائر") }
        else saveProfile(sanitizeDisplayName(name), "", gender, true)
    }

    private fun register(name: String, email: String, password: String, gender: String) {
        loading = true; errorText = null
        val current = auth.currentUser
        val credential = EmailAuthProvider.getCredential(email.trim(), password)
        val task = if (current?.isAnonymous == true) current.linkWithCredential(credential) else auth.createUserWithEmailAndPassword(email.trim(), password)
        task.addOnSuccessListener { uid = it.user?.uid ?: uid; saveProfile(sanitizeDisplayName(name), email.trim(), gender, false) }.addOnFailureListener { loading = false; showError(it.message ?: "تعذر إنشاء الحساب") }
    }

    private fun signInWithGoogle() {
        val clientIdRes = resources.getIdentifier("default_web_client_id", "string", packageName)
        if (clientIdRes == 0) {
            showError("فعّل Google من Firebase ثم نزّل google-services.json الجديد وضعه في المشروع")
            return
        }
        val serverClientId = getString(clientIdRes)
        if (serverClientId.isBlank()) {
            showError("معرّف Google OAuth غير موجود في إعدادات Firebase")
            return
        }
        loading = true
        val credentialManager = CredentialManager.create(this)
        val googleIdOption = GetGoogleIdOption.Builder()
            .setServerClientId(serverClientId)
            .setFilterByAuthorizedAccounts(false)
            .setAutoSelectEnabled(false)
            .build()
        val request = GetCredentialRequest.Builder().addCredentialOption(googleIdOption).build()
        lifecycleScope.launch {
            try {
                val result = credentialManager.getCredential(this@MainActivity, request)
                val credential = result.credential
                if (credential is CustomCredential && credential.type == GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL) {
                    val googleCredential = try {
                        GoogleIdTokenCredential.createFrom(credential.data)
                    } catch (e: GoogleIdTokenParsingException) {
                        loading = false
                        showError("تعذر قراءة حساب Google")
                        return@launch
                    }
                    val firebaseCredential = GoogleAuthProvider.getCredential(googleCredential.idToken, null)
                    val current = auth.currentUser
                    val authTask = if (current?.isAnonymous == true) current.linkWithCredential(firebaseCredential) else auth.signInWithCredential(firebaseCredential)
                    authTask
                        .addOnSuccessListener { uid = it.user?.uid ?: uid; loadProfileOrSetup() }
                        .addOnFailureListener { loading = false; showError(it.message ?: "تعذر تسجيل الدخول عبر Google") }
                } else {
                    loading = false
                    showError("لم يتم اختيار حساب Google صالح")
                }
            } catch (e: Exception) {
                loading = false
                showError(e.message ?: "تعذر تسجيل الدخول عبر Google")
            }
        }
    }

    private fun login(email: String, password: String) {
        loading = true; errorText = null
        auth.signInWithEmailAndPassword(email.trim(), password).addOnSuccessListener { uid = it.user!!.uid; loadProfileOrSetup() }.addOnFailureListener { loading = false; showError(it.message ?: "تعذر تسجيل الدخول") }
    }

    private fun resetPassword(email: String) {
        if (!email.contains("@")) { showError("اكتب بريدًا إلكترونيًا صحيحًا"); return }
        auth.sendPasswordResetEmail(email.trim()).addOnSuccessListener { showError("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك") }.addOnFailureListener { showError(it.message ?: "تعذر إرسال الرابط") }
    }

    private fun changePassword(current: String, newPassword: String, confirm: String) {
        val user = auth.currentUser
        val email = user?.email
        if (user == null || email.isNullOrBlank() || user.isAnonymous) { showError("هذا الحساب لا يدعم تغيير كلمة المرور"); return }
        if (current.isBlank() || newPassword.length < 6 || confirm.isBlank()) { showError("أدخل كلمة المرور الحالية والجديدة وتأكيدها"); return }
        if (newPassword != confirm) { showError("كلمتا المرور الجديدتان غير متطابقتين"); return }
        loading = true
        user.reauthenticate(EmailAuthProvider.getCredential(email, current))
            .continueWithTask { user.updatePassword(newPassword) }
            .addOnSuccessListener { loading = false; showError("تم تغيير كلمة المرور بنجاح") }
            .addOnFailureListener { loading = false; showError(it.message ?: "تعذر تغيير كلمة المرور") }
    }

    private fun saveProfile(name: String, email: String, gender: String, anonymous: Boolean) {
        val safeName = sanitizeDisplayName(name)
        val ref = db.reference.child("users").child(uid)
        ref.get().addOnSuccessListener { existing ->
            val old = parseUser(existing)
            val data = mutableMapOf<String, Any>(
                "uid" to uid, "name" to safeName, "email" to email,
                "gender" to (old?.gender?.takeIf { it.isNotBlank() } ?: gender),
                "verified" to (old?.verified ?: false),
                "banned" to (old?.banned ?: false),
                "online" to (old?.manualOffline != true),
                "joinedAt" to if ((old?.joinedAt ?: 0L) > 0L) old!!.joinedAt else ServerValue.TIMESTAMP,
                "lastSeen" to ServerValue.TIMESTAMP,
                "manualOffline" to (old?.manualOffline ?: false)
            )
            // Admin is derived from the fixed owner UID. Preserve any legacy
            // non-owner admin flag instead of trying to rewrite it during profile updates.
            if (uid == OWNER_UID || !existing.hasChild("admin")) {
                data["admin"] = (uid == OWNER_UID)
            }
            ref.updateChildren(data).addOnSuccessListener {
                if (old?.manualOffline == true) setPresence(false) else setPresence(true)
                loading = false
                loadProfileOrSetup()
            }.addOnFailureListener { loading = false; showError(it.message ?: "تعذر حفظ البيانات") }
        }.addOnFailureListener {
            loading = false
            showError(it.message ?: "تعذر قراءة بيانات الحساب")
        }
    }

    private fun setManualOffline(offline: Boolean) {
        if (uid.isBlank()) return
        db.reference.child("users").child(uid).updateChildren(mapOf("manualOffline" to offline, "online" to !offline, "lastSeen" to ServerValue.TIMESTAMP))
            .addOnSuccessListener {
                profile = profile?.copy(manualOffline = offline, online = !offline, lastSeen = System.currentTimeMillis())
                if (offline) db.reference.child("waiting").child(uid).removeValue() else setPresence(true)
            }
            .addOnFailureListener { showError(it.message ?: "تعذر تغيير حالة الظهور") }
    }

    private fun setPresence(isOnline: Boolean) {
        if (uid.isBlank()) return
        if (isOnline && profile?.manualOffline == true) return
        val ref = db.reference.child("users").child(uid)
        if (isOnline) {
            // Register disconnect handlers once per foreground session. Do not
            // rewrite joinedAt here; it is the user's original join time.
            ref.child("online").onDisconnect().setValue(false)
            ref.child("lastSeen").onDisconnect().setValue(ServerValue.TIMESTAMP)
            ref.updateChildren(mapOf("online" to true, "lastSeen" to ServerValue.TIMESTAMP))
        } else {
            ref.updateChildren(mapOf("online" to false, "lastSeen" to ServerValue.TIMESTAMP))
        }
    }

    private fun startListeners() {
        usersListener?.let { db.reference.child("users").removeEventListener(it) }
        usersListener = object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) {
                onlineUsers.clear()
                s.children.mapNotNull { parseUser(it) }.forEach { if (it.online || it.uid == uid) onlineUsers.add(it) }
                parseUser(s.child(uid))?.let { profile = it }
            }
            override fun onCancelled(e: DatabaseError) { showError(e.message) }
        }
        db.reference.child("users").addValueEventListener(usersListener!!)

        chatsListener?.let { db.reference.child("userChats").child(uid).removeEventListener(it) }
        chatsListener = object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) {
                chats.clear()
                s.children.mapNotNull { snap -> ChatPreview(snap.key ?: return@mapNotNull null, snap.child("peerId").getValue(String::class.java).orEmpty(), snap.child("peerName").getValue(String::class.java).orEmpty(), snap.child("peerVerified").getValue(Boolean::class.java) ?: false, snap.child("peerAvatar").getValue(String::class.java).orEmpty(), snap.child("peerAvatarPath").getValue(String::class.java).orEmpty(), snap.child("lastMessage").getValue(String::class.java).orEmpty(), snap.child("updatedAt").getValue(Long::class.java) ?: 0L, snap.child("unreadCount").getValue(Int::class.java) ?: 0) }.forEach { chats.add(it) }
                val totalUnread = chats.sumOf { it.unreadCount }
                if (unreadInitialized && totalUnread > lastUnreadTotal && screen != "chat") playMessageSoundIfEnabled(true)
                lastUnreadTotal = totalUnread
                unreadInitialized = true
            }
            override fun onCancelled(e: DatabaseError) { showError(e.message) }
        }
        db.reference.child("userChats").child(uid).addValueEventListener(chatsListener!!)
    }

    private fun startMatching() {
        if (uid.isBlank()) return
        if (profile?.manualOffline == true) { showError("فعّل الظهور متصل لاستخدام العشوائي"); return }
        loading = true; errorText = null
        val root = db.reference.child("waiting")
        val me = root.child(uid)
        me.onDisconnect().removeValue()
        root.runTransaction(object : Transaction.Handler {
            override fun doTransaction(d: MutableData): Transaction.Result {
                var peer: String? = null
                for (c in d.children) if (c.key != uid && c.child("roomId").value == null) { peer = c.key; break }
                if (peer == null) d.child(uid).value = mapOf("createdAt" to ServerValue.TIMESTAMP)
                else {
                    val p = peer!!; val roomId = listOf(uid, p).sorted().joinToString("-")
                    d.child(uid).value = mapOf("createdAt" to ServerValue.TIMESTAMP, "roomId" to roomId, "peerId" to p)
                    d.child(p).child("roomId").value = roomId; d.child(p).child("peerId").value = uid
                }
                return Transaction.success(d)
            }
            override fun onComplete(e: DatabaseError?, committed: Boolean, s: DataSnapshot?) {
                if (e != null || !committed) { loading = false; showError(e?.message ?: "تعذر البحث"); return }
                val meSnap = s?.child(uid); val room = meSnap?.child("roomId")?.getValue(String::class.java)
                if (!room.isNullOrBlank()) openRoom(room, meSnap.child("peerId").getValue(String::class.java).orEmpty()) else waitForMatch()
            }
        })
    }

    private fun waitForMatch() {
        val ref = db.reference.child("waiting").child(uid)
        waitingListener?.let { ref.removeEventListener(it) }
        waitingListener = object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) {
                val room = s.child("roomId").getValue(String::class.java)
                if (!room.isNullOrBlank()) { ref.removeValue(); waitingListener?.let { ref.removeEventListener(it) }; waitingListener = null; openRoom(room, s.child("peerId").getValue(String::class.java).orEmpty()) }
            }
            override fun onCancelled(e: DatabaseError) { loading = false; showError(e.message) }
        }
        ref.addValueEventListener(waitingListener!!)
    }

    private fun openRoom(roomId: String, peerId: String) {
        if (peerId.isBlank() || peerId == uid) { showError("لا يمكن فتح محادثة مع هذا الحساب"); return }
        db.reference.child("waiting").child(uid).removeValue()
        stopTyping()
        currentRoomRef?.let { old -> messagesListener?.let { old.removeEventListener(it) } }
        messageDeletesListener?.let { db.reference.child("messageDeletes").child(uid).child(roomId).removeEventListener(it) }
        typingListener?.let { db.reference.child("typing").child(peerId).removeEventListener(it) }
        currentRoomRef = null; messagesListener = null; messageDeletesListener = null; typingListener = null
        currentRoom = roomId; currentPeer = null; messages.clear(); deletedMessageIds.clear(); peerTyping = false; isBlocked = false; iBlockedPeer = false; loading = false; errorText = null; screen = "chat"

        db.reference.child("users").child(peerId).get().addOnSuccessListener { snap -> currentPeer = parseUser(snap); checkBlocked() }.addOnFailureListener { showError("تعذر تحميل بيانات المستخدم") }

        val membersRef = db.reference.child("rooms").child(roomId).child("members")
        membersRef.child(uid).setValue(true).addOnSuccessListener {
            // Each participant adds only their own UID. The other participant
            // will become a member automatically when they open the same room.
            attachRoomMessages(roomId, peerId)
            markRoomMessagesRead(roomId)
            db.reference.child("userChats").child(uid).child(roomId).child("unreadCount").setValue(0)
        }.addOnFailureListener { showError(it.message ?: "تعذر فتح المحادثة") }
    }

    private fun addMessageSnapshot(s: DataSnapshot) {
        val type = s.child("type").getValue(String::class.java).orEmpty().ifBlank { "text" }
        val expires = s.child("expiresAt").getValue(Long::class.java) ?: 0L
        if (type == "image" && expires > 0 && expires <= System.currentTimeMillis()) { s.ref.removeValue(); return }
        val m = Msg(
            s.key ?: return,
            s.child("senderId").getValue(String::class.java).orEmpty(),
            type,
            s.child("text").getValue(String::class.java).orEmpty(),
            s.child("imageUrl").getValue(String::class.java).orEmpty(),
            s.child("audioUrl").getValue(String::class.java).orEmpty(),
            s.child("storagePath").getValue(String::class.java).orEmpty(),
            s.child("timestamp").getValue(Long::class.java) ?: 0L,
            expires,
            s.child("deliveredAt").getValue(Long::class.java) ?: 0L,
            s.child("readAt").getValue(Long::class.java) ?: 0L
        )
        val idx = messages.indexOfFirst { it.id == m.id }
        if (idx >= 0) messages[idx] = m else messages.add(m)
        messages.sortBy { it.timestamp }
    }

    private fun attachRoomMessages(roomId: String, peerId: String) {
        if (currentRoom != roomId) return
        currentRoomRef?.let { old -> messagesListener?.let { old.removeEventListener(it) } }
        val ref = db.reference.child("rooms").child(roomId).child("messages")
        currentRoomRef = ref
        messageListenerPrimed = false
        messagesListener = object : ChildEventListener {
            override fun onChildAdded(s: DataSnapshot, p: String?) {
                val wasKnown = messages.any { it.id == s.key }
                addMessageSnapshot(s)
                if (!wasKnown && s.child("senderId").getValue(String::class.java) != uid) {
                    markMessageRead(roomId, s.key.orEmpty())
                    if (messageListenerPrimed) playMessageSoundIfEnabled(false)
                }
            }
            override fun onChildChanged(s: DataSnapshot, p: String?) {
                val idx = messages.indexOfFirst { it.id == s.key }
                if (idx >= 0) {
                    val old = messages[idx]
                    messages[idx] = old.copy(deliveredAt = s.child("deliveredAt").getValue(Long::class.java) ?: old.deliveredAt, readAt = s.child("readAt").getValue(Long::class.java) ?: old.readAt)
                }
            }
            override fun onChildRemoved(s: DataSnapshot) { messages.removeAll { it.id == s.key } }
            override fun onChildMoved(s: DataSnapshot, p: String?) {}
            override fun onCancelled(e: DatabaseError) { showError(e.message) }
        }
        ref.addChildEventListener(messagesListener!!)
        ref.get().addOnSuccessListener { s ->
            s.children.forEach { addMessageSnapshot(it) }
            markRoomMessagesRead(roomId)
            messageListenerPrimed = true
        }.addOnFailureListener { messageListenerPrimed = true }

        val deletesRef = db.reference.child("messageDeletes").child(uid).child(roomId)
        messageDeletesListener = object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) { deletedMessageIds.clear(); s.children.forEach { if (it.getValue(Boolean::class.java) == true) it.key?.let(deletedMessageIds::add) } }
            override fun onCancelled(e: DatabaseError) {}
        }
        deletesRef.addValueEventListener(messageDeletesListener!!)

        typingListener = object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) { peerTyping = s.getValue(Boolean::class.java) == true }
            override fun onCancelled(e: DatabaseError) {}
        }
        db.reference.child("typing").child(peerId).addValueEventListener(typingListener!!)

        ref.orderByChild("expiresAt").addListenerForSingleValueEvent(object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) {
                val cutoff = System.currentTimeMillis() - MESSAGE_RETENTION_MS
                s.children.forEach {
                    val ex = it.child("expiresAt").getValue(Long::class.java) ?: 0L
                    val ts = it.child("timestamp").getValue(Long::class.java) ?: 0L
                    val path = it.child("storagePath").getValue(String::class.java).orEmpty()
                    if ((ex > 0 && ex <= System.currentTimeMillis()) || (ts > 0 && ts < cutoff)) {
                        it.ref.removeValue()
                        if (path.isNotBlank()) storage.reference.child(path).delete()
                    }
                }
            }
            override fun onCancelled(e: DatabaseError) {}
        })
    }

    private fun markRoomMessagesRead(roomId: String) {
        val ref = db.reference.child("rooms").child(roomId).child("messages")
        ref.addListenerForSingleValueEvent(object : ValueEventListener {
            override fun onDataChange(s: DataSnapshot) { s.children.forEach { if (it.child("senderId").getValue(String::class.java) != uid && it.child("readAt").getValue(Long::class.java) ?: 0L == 0L) markMessageRead(roomId, it.key.orEmpty()) } }
            override fun onCancelled(e: DatabaseError) {}
        })
    }

    private fun markMessageRead(roomId: String, messageId: String) {
        if (messageId.isBlank()) return
        val ts = ServerValue.TIMESTAMP
        db.reference.child("rooms").child(roomId).child("messages").child(messageId).updateChildren(mapOf("deliveredAt" to ts, "readAt" to ts))
