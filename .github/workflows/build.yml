        waitingListener?.let { db.reference.child("waiting").child(uid).removeEventListener(it) }
        usersListener = null; chatsListener = null; messagesListener = null; messageDeletesListener = null; typingListener = null; currentRoomRef = null; waitingListener = null
        onlineUsers.clear(); chats.clear(); messages.clear(); deletedMessageIds.clear(); unreadInitialized = false; lastUnreadTotal = 0
    }

    private fun showError(msg: String) { errorText = msg; Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }

    private fun peerStatusText(peer: UserProfile?): String {
        if (peer == null) return ""
        if (peer.online && !peer.manualOffline) return "متصل الآن"
        if (peer.manualOffline || peer.lastSeen <= 0L) return "غير متصل"
        return "آخر ظهور ${formatDateTime(peer.lastSeen)}"
    }

    private fun formatDateTime(ts: Long): String {
        if (ts <= 0) return ""
        val d = java.text.SimpleDateFormat("dd/MM HH:mm", Locale.getDefault())
        return d.format(java.util.Date(ts))
    }

    private fun formatTime(ts: Long): String { if (ts <= 0) return ""; val d = java.text.SimpleDateFormat("HH:mm", java.util.Locale.getDefault()); return d.format(java.util.Date(ts)) }
}

@Composable
private fun DardashaTheme(content: @Composable () -> Unit) {
    val scheme = darkColorScheme(primary = Pink, secondary = Purple, tertiary = Blue, background = Bg, surface = Panel, onBackground = TextMain, onSurface = TextMain)
    MaterialTheme(colorScheme = scheme, typography = Typography(), content = content)
}
