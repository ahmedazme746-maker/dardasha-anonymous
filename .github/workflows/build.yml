name: Build Dardasha APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify tools
        run: |
          java -version
          gradle --version

      - name: Extract Dardasha
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "Dardasha-FINAL-FIXED-V3.zip" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Dardasha-FINAL-FIXED-V3.zip not found"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/dardasha"
          mkdir -p "$RUNNER_TEMP/dardasha"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/dardasha"

          SETTINGS=$(find "$RUNNER_TEMP/dardasha" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT:"
          echo "$PROJECT_DIR"

      - name: Fix source and dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          FILE="app/build.gradle.kts"
          MAIN="app/src/main/java/com/dardasha/anonymous/MainActivity.kt"

          echo "================================"
          echo "FIXING MAINACTIVITY"
          echo "================================"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          # Fix Firebase Realtime Database presence.
          sed -i \
            's/ref\.onDisconnect()\.child("online")\.setValue(false)/ref.child("online").onDisconnect().setValue(false)/g' \
            "$MAIN"

          echo "Checking presence code:"
          grep -n "onDisconnect" "$MAIN" || true

          echo ""
          echo "================================"
          echo "FIXING DEPENDENCIES"
          echo "================================"

          sed -i -E \
            's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' \
            "$FILE"

          sed -i -E \
            's/(androidx\.compose:compose-bom:)[0-9]+\.[0-9]+\.[0-9]+/\12026.06.01/g' \
            "$FILE"

          sed -i -E \
            's/(androidx\.core:core-ktx:)[0-9]+\.[0-9]+\.[0-9]+/\11.18.0/g' \
            "$FILE"

          sed -i -E \
            's/(androidx\.core:core:)[0-9]+\.[0-9]+\.[0-9]+/\11.18.0/g' \
            "$FILE"

          cat >> "$FILE" <<'EOF'

          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  if (requested.group == "androidx.core" &&
                      (requested.name == "core" || requested.name == "core-ktx")) {
                      useVersion("1.18.0")
                  }

                  if (requested.group == "androidx.compose.animation" ||
                      requested.group == "androidx.compose.foundation" ||
                      requested.group == "androidx.compose.runtime" ||
                      requested.group == "androidx.compose.ui") {
                      useVersion("1.11.4")
                  }
              }
          }
          EOF

          echo ""
          echo "compileSdk:"
          grep -n "compileSdk" "$FILE" || true

          echo ""
          echo "Compose:"
          grep -n "compose-bom" "$FILE" || true

          echo ""
          echo "Core:"
          grep -n "androidx.core" "$FILE" || true

      - name: Check source for known error
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          MAIN="app/src/main/java/com/dardasha/anonymous/MainActivity.kt"

          if grep -n 'ref\.onDisconnect()\.child' "$MAIN"; then
            echo "ERROR: Old onDisconnect().child() code still exists"
            exit 1
          fi

          if ! grep -n 'ref\.child("online")\.onDisconnect()' "$MAIN"; then
            echo "ERROR: Correct presence code not found"
            exit 1
          fi

          echo "Known source error: FIXED"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            clean \
            :app:assembleDebug \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/dardasha-anonymous-debug.apk

          echo "=============================="
          echo "APK READY"
          echo "=============================="

          ls -lh release/dardasha-anonymous-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dardasha-anonymous-debug
          path: release/dardasha-anonymous-debug.apk
          if-no-files-found: error
